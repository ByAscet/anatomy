<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<title>Анатомия человека</title>
<style>
:root {
  --bg: #050505;
  --text: #f5f5f7;
  --text-muted: #86868b;
  --text-dim: #424245;
  --border: rgba(255, 255, 255, 0.12);
  --term-bg: rgba(255, 255, 255, 0.1);
  --tooltip-bg: #1c1c1e;
  --tooltip-border: #333;
  --progress-bg: rgba(255,255,255,0.1);
  --progress-fill: #86868b;
}
[data-theme="light"] {
  --bg: #f4f4f4;
  --text: #1d1d1f;
  --text-muted: #6e6e73;
  --text-dim: #a1a1a6;
  --border: rgba(0, 0, 0, 0.1);
  --term-bg: rgba(0, 0, 0, 0.05);
  --tooltip-bg: #ffffff;
  --tooltip-border: #e5e5ea;
  --progress-bg: rgba(0,0,0,0.1);
  --progress-fill: #1d1d1f;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  transition: background 0.5s ease, color 0.5s ease;
}

/* ЭФФЕКТ СТАРОЙ ПЛЕНКИ */
.film-grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
  opacity: 0.07;
}
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 120%);
}
[data-theme="light"] .vignette {
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.15) 120%);
}

/* СЛАЙДЫ */
#deck { position: relative; width: 100%; height: 100dvh; z-index: 1; }
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(8vh + env(safe-area-inset-top)) calc(6vw + env(safe-area-inset-right)) calc(10vh + env(safe-area-inset-bottom)) calc(6vw + env(safe-area-inset-left));
  opacity: 0; visibility: hidden;
  transform: translateY(15px);
  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0.6s;
  overflow: hidden;
}
.slide.active {
  opacity: 1; visibility: visible; transform: translateY(0);
  z-index: 10;
}

/* ТИПОГРАФИКА */
.kicker {
  font-size: clamp(0.6rem, 2vw, 0.75rem); letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; margin-bottom: 0.5rem;
}
.title {
  font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; line-height: 1.1;
  letter-spacing: -0.02em; margin-bottom: 1.2rem; color: var(--text);
}
.points {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 2rem;
}
.point { display: flex; gap: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
.point .n { font-size: 0.75rem; color: var(--text-dim); min-width: 1rem; font-weight: 600; }
.point p { font-size: clamp(0.75rem, 2.8vw, 0.9rem); line-height: 1.4; color: var(--text); }

/* СНОСКИ */
.term { border-bottom: 1px dashed var(--text-muted); cursor: pointer; font-weight: 500; }
.note {
  margin-top: 1.5rem; font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: var(--text-muted); font-style: italic;
  line-height: 1.4; padding-left: 0.8rem; border-left: 2px solid var(--text-dim);
}

/* РАЗДЕЛЫ */
.section .num {
  font-size: clamp(3rem, 10vw, 6rem); font-weight: 200; line-height: 1; color: transparent;
  -webkit-text-stroke: 1px var(--text-dim); margin-bottom: 0.5rem;
}
.section-title { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 700; line-height: 1.1; margin-bottom: 1rem; }
.section-sub { font-size: clamp(0.9rem, 3vw, 1.1rem); color: var(--text-muted); line-height: 1.4; }

/* КНОПКА СМЕНЫ ТЕМЫ (ВМЕСТО ШЕСТЕРЕНКИ) */
.theme-btn {
  position: fixed; top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer;
  transition: color 0.3s, transform 0.3s;
}
.theme-btn:hover { color: var(--text); transform: scale(1.1); }
.theme-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ВОДЯНОЙ ЗНАК */
.watermark {
  position: fixed; bottom: calc(15px + env(safe-area-inset-bottom)); left: calc(20px + env(safe-area-inset-left));
  font-size: 0.65rem; letter-spacing: 0.3em; color: var(--text-muted); opacity: 0.3;
  text-transform: uppercase; z-index: 50; pointer-events: none; font-weight: 600;
}

/* ПОЛОСА ПРОГРЕССА */
.progress-container {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--progress-bg);
  z-index: 100; pointer-events: none;
}
.progress-bar {
  height: 100%; background: var(--progress-fill); width: 0%;
  transition: width 0.3s ease;
}

/* TOOLTIP */
.tooltip {
  position: fixed; background: var(--tooltip-bg); border: 1px solid var(--tooltip-border);
  padding: 10px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--text);
  max-width: 250px; line-height: 1.4; z-index: 9999; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s, visibility 0.2s; pointer-events: none;
}
.tooltip.show { opacity: 1; visibility: visible; transform: translateY(0); }

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 600px) {
  .points { grid-template-columns: 1fr; gap: 0.5rem; }
  .point p { font-size: clamp(0.75rem, 3.5vw, 0.85rem); line-height: 1.35; }
  .title { font-size: clamp(1.3rem, 5.5vw, 1.6rem); margin-bottom: 1rem; }
  .note { font-size: 0.75rem; margin-top: 1rem; }
  .slide { padding-top: calc(12vh + env(safe-area-inset-top)); }
}
</style>
</head>
<body>

<div class="film-grain"></div>
<div class="vignette"></div>

<!-- Кнопка темы (Солнце/Луна) -->
<button class="theme-btn" id="themeBtn" aria-label="Сменить тему">
  <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<div class="watermark">ascet</div>
<div class="tooltip" id="tooltip"></div>

<!-- Полоса прогресса -->
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<main id="deck"></main>

<script>
// ГЛОССАРИЙ ДЛЯ СНОСОК
const GLOSSARY = {

  "антитело": "Белок, вырабатываемый иммунной системой для нейтрализации антигенов.",
  "митоз": "Деление клетки, при котором образуются две идентичные дочерние клетки.",

  "альвеола": "Микроскопический пузырёк в лёгких, где происходит газообмен.",
  "нефрон": "Структурная единица почки, осуществляющая фильтрацию крови.",
  "нейромедиатор": "Химическое вещество, передающее сигнал через синапс.",

  "коллаген": "Белок, придающий тканям прочность и эластичность."
};

// БАЗА ЗНАНИЙ (50 ТЕМ)
const knowledgeBase = [
  { title: "Кость как орган", facts: ["Кость — это живой орган, состоящий из костной ткани, надкостницы, костного мозга и сосудов.", "В компактном веществе костные пластинки образуют остеоны, обеспечивающие прочность.", "Губчатое вещество состоит из трабекул, расположенных по линиям максимальной нагрузки.", "Надкостница содержит остеобласты, за счёт которых происходит рост и регенерация кости.", "Красный костный мозг является органом кроветворения, а жёлтый — депо жира.", "Кости активно участвуют в минеральном обмене, регулируя уровень кальция и фосфора в крови.", "Структура кости перестраивается в течение всей жизни в ответ на механические нагрузки.", "Кости обладают высокой прочностью на сжатие и растяжение.", "В костях содержится около 99% всего кальция организма.", "Костная ткань состоит из остеоцитов, остеобластов и остеокластов."], note: "Структура кости перестраивается в течение всей жизни в ответ на механические нагрузки." },
  { title: "Классификация костей", facts: ["Длинные трубчатые кости имеют тело (диафиз) и два конца (эпифизы), между которыми расположена метафизарная пластинка роста.", "Короткие кости (позвонки, кости запястья) имеют сложную форму и обеспечивают комбинированные движения.", "Плоские кости (лопатка, кости черепа) выполняют преимущественно защитную функцию и служат местом прикрепления мышц.", "Смешанные кости (ключица, височная кость) сочетают в себе признаки нескольких типов.", "Воздухоносные кости содержат полости, выстланные слизистой оболочкой, которые сообщаются с носовой полостью.", "Форма и функция кости неразрывно связаны: каждая кость приспособлена к тем нагрузкам, которые она испытывает.", "Сесамовидные кости (надколенник) расположены в толще сухожилий и увеличивают плечо силы.", "Кости делятся на осевые (череп, позвоночник, грудина) и добавочные (конечности).", "Размер и форма костей зависят от генетических факторов и образа жизни.", "Перестройка костей происходит под влиянием гормонов (паратгормон, кальцитонин)."], note: "Форма кости определяется её функцией и генетически запрограммирована." },
  { title: "Соединения костей", facts: ["Непрерывные соединения (синартрозы) представлены фиброзными (швы), хрящевыми (синхондрозы) и костными (синостозы) структурами.", "Симфизы (полупрерывные соединения) имеют щелевидную полость и хрящевые прослойки (например, межпозвоночные диски).", "Прерывные соединения (суставы, диартрозы) включают суставные поверхности, капсулу и суставную полость с синовиальной жидкостью.", "Суставные поверхности покрыты гиалиновым хрящом, который снижает трение и амортизирует нагрузки.", "Движения в суставах возможны вокруг фронтальной, сагиттальной и вертикальной осей.", "Стабильность сустава обеспечивается капсулой, связками, сухожилиями и мышечным тонусом.", "Вспомогательные элементы сустава: диски, мениски, губы, синовиальные сумки.", "Симфизы (например, лобковый) обеспечивают небольшую подвижность при значительной прочности.", "Синхондрозы (хрящевые соединения) обеспечивают упругость и амортизацию (ребра, грудина).", "Подвижность сустава зависит от формы сочленяющихся поверхностей и натяжения связок."], note: "Подвижность и прочность соединений костей находятся в обратной зависимости." },
  { title: "Строение скелета: Череп", facts: ["Мозговой отдел черепа защищает головной мозг и включает лобную, теменные, затылочную, височные, клиновидную и решётчатую кости.", "Лицевой отдел формирует костную основу лица и включает верхнюю и нижнюю челюсти, скуловые, носовые, слёзные, нёбные кости и сошник.", "Нижняя челюсть — единственная подвижная кость черепа, соединённая с височной костью височно-нижнечелюстным суставом.", "Швы черепа (сагиттальный, венечный, ламбдовидный) обеспечивают прочное соединение костей.", "В основании черепа расположены отверстия для выхода черепных нервов и сосудов.", "Возрастные изменения черепа связаны с зарастанием швов и изменением пропорций лицевого и мозгового отделов.", "У новорождённого череп имеет роднички — неокостеневшие участки перепончатого черепа.", "Мозговой отдел черепа преобладает над лицевым у детей; с возрастом пропорции меняются.", "Височная кость содержит органы слуха и равновесия.", "Решётчатая кость участвует в образовании полости носа и глазницы."], note: "Череп новорождённого имеет роднички — неокостеневшие участки перепончатого черепа." },
  { title: "Строение скелета: Позвоночник", facts: ["Позвоночный столб состоит из 33-34 позвонков: 7 шейных, 12 грудных, 5 поясничных, 5 крестцовых и 1-3 копчиковых.", "Позвоночник имеет физиологические изгибы: шейный и поясничный лордоз, грудной и крестцовый кифоз, которые обеспечивают амортизацию.", "Позвонок состоит из тела, дуги и отростков (остистого, поперечных, суставных).", "Между телами позвонков расположены межпозвоночные диски, состоящие из фиброзного кольца и студенистого ядра.", "Спинной мозг проходит внутри позвоночного канала, образованного дугами позвонков.", "Движения позвоночника включают сгибание, разгибание, наклоны, скручивание и круговые движения.", "Нарушение осанки приводит к неравномерной нагрузке на межпозвоночные диски и их дегенерации.", "Крестец образован срастанием пяти позвонков и участвует в образовании таза.", "Атлант (C1) и осевой позвонок (C2) обеспечивают вращение головы.", "Грудные позвонки имеют рёберные ямки для соединения с рёбрами."], note: "Нарушение осанки приводит к неравномерной нагрузке на межпозвоночные диски и их дегенерации." },
  { title: "Строение скелета: Грудная клетка", facts: ["Грудная клетка образована грудиной, 12 парами рёбер и грудными позвонками.", "Грудина состоит из рукоятки, тела и мечевидного отростка; к ней прикрепляются хрящи рёбер.", "Рёбра делятся на истинные (I-VII, соединяются с грудиной напрямую), ложные (VIII-X) и свободные (XI-XII).", "Межрёберные промежутки заняты межрёберными мышцами, сосудами и нервами.", "Грудная клетка защищает сердце, лёгкие и крупные сосуды, а также участвует в дыхательных движениях.", "Форма грудной клетки зависит от пола, возраста и телосложения (коническая, цилиндрическая, плоская).", "При переломе рёбер возможен пневмоторакс — попадание воздуха в плевральную полость.", "Грудина является местом прикрепления ключиц и рёберных хрящей.", "Нижняя апертура грудной клетки закрыта диафрагмой.", "Рёбра увеличивают объём грудной клетки при вдохе за счёт движения в суставах."], note: "При переломе рёбер возможен пневмоторакс — попадание воздуха в плевральную полость." },
  { title: "Скелет верхней конечности", facts: ["Пояс верхней конечности состоит из ключицы и лопатки, соединяющих руку с туловищем.", "Плечевая кость образует плечо и соединяется с лопаткой и костями предплечья.", "Предплечье состоит из локтевой (медиальной) и лучевой (латеральной) костей, соединённых межкостной мембраной.", "Кисть включает запястье (8 коротких костей), пясть (5 костей) и фаланги пальцев (14 костей).", "Большой палец противопоставлен остальным, что обеспечивает хватательную функцию.", "Суставы верхней конечности (плечевой, локтевой, лучезапястный) обеспечивают высокую подвижность и точность движений.", "Плечевой сустав — самый подвижный в организме человека, но и самый нестабильный.", "Локтевой сустав — сложный, включает три сустава, обеспечивает сгибание и разгибание.", "Лучезапястный сустав соединяет предплечье с кистью и обеспечивает разнообразие движений.", "Ключица — единственная кость, соединяющая верхнюю конечность с осевым скелетом."], note: "Плечевой сустав — самый подвижный в организме человека, но и самый нестабильный." },
  { title: "Скелет нижней конечности", facts: ["Пояс нижней конечности образован двумя тазовыми костями, соединёнными с крестцом и лобковым симфизом.", "Бедренная кость — самая длинная и массивная кость тела, выдерживающая большие нагрузки.", "Голень состоит из большеберцовой (опорной) и малоберцовой (вспомогательной) костей.", "Стопа включает предплюсну (7 костей), плюсну (5 костей) и фаланги (14 костей).", "Стопа имеет продольный и поперечный своды, которые амортизируют нагрузку при ходьбе.", "Тазобедренный, коленный и голеностопный суставы обеспечивают опору и движение тела.", "У женщин таз шире и короче, что связано с детородной функцией.", "Тазобедренный сустав — чашеобразный, обеспечивает движение во всех трёх плоскостях.", "Коленный сустав — самый крупный, включает мениски и крестообразные связки.", "Большеберцовая кость несёт основную нагрузку при стоянии и ходьбе."], note: "У женщин таз шире и короче, что связано с детородной функцией." },
  { title: "Мышцы головы и шеи", facts: ["Мимические мышцы прикрепляются к коже и обеспечивают выражение эмоций (например, круговая мышца рта, мышца, сморщивающая бровь).", "Жевательные мышцы (собственно жевательная, височная, крыловидные) обеспечивают движение нижней челюсти.", "Мышцы шеи делятся на поверхностные (подкожная, грудино-ключично-сосцевидная) и глубокие (лестничные, длинные).", "Грудино-ключично-сосцевидная мышца при одностороннем сокращении наклоняет голову в свою сторону, при двустороннем — запрокидывает назад.", "Мышцы шеи участвуют в движениях головы, глотании и речи.", "Иннервация мышц головы и шеи осуществляется черепными нервами (лицевым, тройничным, добавочным).", "Повреждение лицевого нерва приводит к параличу мимических мышц (асимметрия лица).", "Жевательные мышцы развивают значительное усилие (до 70 кг на коренных зубах).", "Мимические мышцы не имеют фасций, они вплетаются в кожу.", "Диафрагма рта (mylohyoideus) участвует в глотании и опускании нижней челюсти."], note: "Повреждение лицевого нерва приводит к парализу мимических мышц (асимметрия лица)." },
  { title: "Мышцы туловища", facts: ["Мышцы спины включают поверхностные (трапециевидная, широчайшая) и глубокие (разгибатели позвоночника).", "Глубокие мышцы спины удерживают позвоночник в вертикальном положении и участвуют в разгибании.", "Мышцы груди (большая и малая грудные, передняя зубчатая) обеспечивают движение плечевого пояса и дыхание.", "Диафрагма — главная дыхательная мышца, разделяющая грудную и брюшную полости.", "Мышцы живота (прямая, косые, поперечная) формируют брюшной пресс, поддерживают органы и участвуют в выдохе.", "Мышцы туловища обеспечивают наклоны, повороты и поддержание позы.", "Слабость мышц живота ведёт к опущению внутренних органов и нарушению осанки.", "Трапециевидная мышца поднимает и опускает лопатки, участвует в движении головы.", "Широчайшая мышца спины приводит плечо к туловищу и вращает его внутрь.", "Межрёберные мышцы поднимают и опускают рёбра при дыхании."], note: "Слабость мышц живота ведёт к опущению внутренних органов и нарушению осанки." },
  { title: "Мышцы верхней конечности", facts: ["Мышцы плеча делятся на переднюю (сгибатели) и заднюю (разгибатели) группы.", "Двуглавая мышца плеча сгибает предплечье и супинирует его, трёхглавая — разгибает.", "Мышцы предплечья обеспечивают движения кисти и пальцев, делятся на сгибатели и разгибатели.", "Мышцы кисти включают мышцы возвышения большого пальца (тенар), возвышения мизинца (гипотенар) и среднюю группу (червеобразные, межкостные).", "Тонкая моторика кисти обеспечивается согласованной работой многих мышц под контролем коры головного мозга.", "Мышцы верхней конечности обеспечивают выполнение сложных трудовых операций.", "Дельтовидная мышца поднимает руку в стороны, вперёд и назад.", "Плечелучевая мышца сгибает предплечье в локтевом суставе.", "Мышцы-сгибатели пальцев расположены на передней поверхности предплечья.", "Мышцы-разгибатели пальцев расположены на задней поверхности предплечья."], note: "Тонкая моторика кисти обеспечивается согласованной работой многих мышц под контролем коры головного мозга." },
  { title: "Мышцы нижней конечности", facts: ["Мышцы таза включают ягодичные (большая, средняя, малая), подвздошно-поясничную и другие.", "Большая ягодичная мышца разгибает бедро и удерживает тело в вертикальном положении.", "Мышцы бедра делятся на переднюю (четырёхглавая), заднюю (двуглавая, полусухожильная, полуперепончатая) и медиальную (приводящие) группы.", "Четырёхглавая мышца бедра — самая крупная мышца тела, разгибает голень.", "Мышцы голени (трёхглавая, передняя большеберцовая, малоберцовые) обеспечивают движения стопы и пальцев.", "Мышцы нижней конечности играют ключевую роль в опоре и передвижении.", "Трёхглавая мышца голени (икроножная и камбаловидная) сгибает стопу и голень.", "Портняжная мышца — самая длинная мышца тела, сгибает бедро и голень.", "Приводящие мышцы бедра обеспечивают приведение бедра к срединной линии.", "Подвздошно-поясничная мышца сгибает бедро в тазобедренном суставе."], note: "Четырёхглавая мышца бедра — самая крупная мышца тела, разгибает голень." },
  { title: "Строение сердца", facts: ["Сердце — полый четырёхкамерный мышечный орган, расположенный в грудной полости в средостении.", "Стенка сердца состоит из трёх оболочек: эндокарда (внутренней), миокарда (мышечной) и эпикарда (наружной).", "Миокард образован сердечной мышечной тканью (кардиомиоцитами), соединёнными вставочными дисками.", "Сердце окружено перикардом (околосердечной сумкой), содержащим жидкость для уменьшения трения.", "Камеры сердца: правое и левое предсердия, правый и левый желудочки, разделённые перегородками.", "Клапаны сердца (трёхстворчатый, митральный, аортальный, лёгочный) обеспечивают односторонний ток крови.", "Масса сердца взрослого человека составляет около 250-350 граммов.", "Сердце перекачивает около 5 литров крови в минуту в состоянии покоя.", "Проводящая система сердца включает синоатриальный и атриовентрикулярный узлы, пучок Гиса и волокна Пуркинье.", "Сердечная мышца сокращается автоматически благодаря автоматии проводящей системы."], note: "Масса сердца взрослого человека составляет около 250-350 граммов." },
  { title: "Круги кровообращения", facts: ["Большой круг начинается в левом желудочке, проходит через все органы и заканчивается в правом предсердии.", "Малый (лёгочный) круг начинается в правом желудочке, проходит через лёгкие и заканчивается в левом предсердии.", "В большом круге артериальная кровь отдаёт кислород тканям, а венозная забирает продукты обмена.", "В малом круге венозная кровь обогащается кислородом в лёгких и становится артериальной.", "Круги кровообращения связаны через сердце и функционируют одновременно.", "Нарушение кровообращения в одном из кругов приводит к общим расстройствам гемодинамики.", "Открытие кругов кровообращения принадлежит Уильяму Гарвею (1628 г.).", "Артериальная кровь в большом круге насыщена кислородом и имеет ярко-красный цвет.", "Венозная кровь в большом круге содержит продукты обмена и имеет тёмный цвет.", "Скорость кровотока в капиллярах самая низкая, что способствует обмену веществ."], note: "Открытие кругов кровообращения принадлежит Уильяму Гарвею (1628 г.)." },
  { title: "Сосуды: Артерии, вены, капилляры", facts: ["Артерии — сосуды, несущие кровь от сердца; их стенка состоит из трёх оболочек и выдерживает высокое давление.", "Вены — сосуды, несущие кровь к сердцу; имеют клапаны, препятствующие обратному току крови, и более тонкую стенку.", "Капилляры — мельчайшие сосуды, стенка которых состоит из одного слоя эндотелиальных клеток, что обеспечивает обмен веществ.", "Артериолы и венулы — мелкие сосуды, регулирующие кровоснабжение органов.", "Сосуды образуют единую замкнутую сеть, связывающую сердце и все органы.", "Нарушение проницаемости сосудистой стенки приводит к отёкам и кровоизлияниям.", "Общая длина всех капилляров в теле человека достигает 100 000 километров.", "Артерии делятся на эластические, мышечные и смешанные.", "Вены имеют клапаны, особенно в нижних конечностях, для предотвращения застоя крови.", "Капилляры бывают соматические, висцеральные и синусоидные."], note: "Общая длина всех капилляров в теле человека достигает 100 000 километров." },
  { title: "Кровь как ткань", facts: ["Кровь — жидкая соединительная ткань, состоящая из плазмы (55%) и форменных элементов (45%).", "Эритроциты содержат гемоглобин, переносящий кислород от лёгких к тканям и углекислый газ обратно.", "Лейкоциты обеспечивают иммунную защиту, способны к фагоцитозу и выработке антител.", "Тромбоциты (кровяные пластинки) участвуют в свёртывании крови, предотвращая кровопотерю.", "Гемопоэз (кроветворение) происходит в красном костном мозге.", "Группы крови (ABO, Rh) учитываются при переливании, несовместимость может быть смертельной.", "В организме взрослого человека циркулирует около 5 литров крови.", "Плазма крови на 90% состоит из воды и содержит белки, соли, глюкозу.", "Эритроциты живут около 120 дней, затем разрушаются в селезёнке.", "Лейкоциты делятся на гранулоциты и агранулоциты."], note: "В организме взрослого человека циркулирует около 5 литров крови." },
  { title: "Регуляция кровообращения", facts: ["Нервная регуляция осуществляется вегетативной нервной системой: симпатическая учащает и усиливает сердечные сокращения, парасимпатическая — замедляет.", "Гуморальная регуляция обеспечивается гормонами (адреналин, тироксин) и ионами (кальций, калий).", "Сосудодвигательный центр в продолговатом мозге контролирует тонус сосудов.", "Рефлекторная регуляция обеспечивает быструю адаптацию к изменениям (например, при физической нагрузке).", "Почечная регуляция (ренин-ангиотензиновая система) играет ключевую роль в поддержании артериального давления.", "Нарушение регуляции ведёт к развитию артериальной гипертензии или гипотонии.", "Стойкое повышение давления выше 140/90 мм рт. ст. называется гипертонической болезнью.", "Барорецепторы в сосудах реагируют на изменение давления и посылают сигналы в мозг.", "Хеморецепторы реагируют на изменение газового состава крови.", "Адреналин сужает сосуды кожи и расширяет сосуды мышц, перераспределяя кровоток."], note: "Стойкое повышение давления выше 140/90 мм рт. ст. называется гипертонической болезнью." },
  { title: "Строение нейрона и синапса", facts: ["Нейрон — структурная единица нервной системы, состоит из тела (сомы), дендритов и аксона.", "Дендриты воспринимают сигналы от других нейронов, аксон передаёт сигнал к эффекторным клеткам.", "Аксон покрыт миелиновой оболочкой, которая ускоряет проведение нервного импульса.", "Синапс — место контакта между нейронами или нейроном и другой клеткой.", "Передача сигнала через синапс осуществляется с помощью химических веществ — нейромедиаторов.", "Нервные импульсы имеют электрическую природу и возникают в результате изменения проницаемости мембраны для ионов натрия и калия.", "В мозге человека насчитывается около 86 миллиардов нейронов.", "Нейромедиаторы могут быть возбуждающими (глутамат) и тормозными (ГАМК).", "Миелиновая оболочка прерывается перехватами Ранвье, что обеспечивает сальтаторное проведение импульса.", "Синапсы могут быть электрическими и химическими."], note: "В мозге человека насчитывается около 86 миллиардов нейронов." },
  { title: "Рефлекс и рефлекторная дуга", facts: ["Рефлекс — ответная реакция организма на раздражение, осуществляемая нервной системой.", "Рефлекторная дуга — путь, по которому проходит нервный импульс при рефлексе.", "Она включает рецептор, чувствительный нейрон, вставочный нейрон (в спинном мозге), двигательный нейрон и эффектор.", "Рефлексы бывают врождёнными (безусловными) и приобретёнными (условными).", "Безусловные рефлексы передаются по наследству и обеспечивают жизненно важные функции.", "Условные рефлексы вырабатываются на основе жизненного опыта и являются основой высшей нервной деятельности.", "Учение о рефлексах разработал И.П. Павлов, создав концепцию условных рефлексов.", "Простые рефлексы замыкаются на уровне спинного мозга (коленный рефлекс).", "Сложные рефлексы замыкаются на уровне головного мозга (слюноотделение).", "Рефлекторная дуга может включать несколько вставочных нейронов."], note: "Учение о рефлексах разработал И.П. Павлов, создав концепцию условных рефлексов." },
  { title: "Спинной мозг", facts: ["Спинной мозг расположен в позвоночном канале и имеет вид тяжа длиной около 45 см.", "Он состоит из серого вещества (в центре, образовано телами нейронов) и белого вещества (по периферии, образовано отростками).", "Серое вещество имеет форму бабочки и содержит передние рога (двигательные нейроны), задние рога (чувствительные) и боковые рога (вегетативные).", "Спинной мозг выполняет рефлекторную и проводниковую функции.", "Повреждение спинного мозга приводит к параличам, потере чувствительности и нарушению работы внутренних органов.", "Спинной мозг окружён тремя оболочками и омывается спинномозговой жидкостью.", "В шейном отделе спинной мозг имеет утолщение, связанное с иннервацией верхних конечностей.", "В поясничном отделе также есть утолщение для иннервации нижних конечностей.", "Спинномозговые нервы образуются при слиянии передних и задних корешков.", "Спинной мозг содержит 31 сегмент: 8 шейных, 12 грудных, 5 поясничных, 5 крестцовых, 1 копчиковый."], note: "В шейном отделе спинной мозг имеет утолщение, связанное с иннервацией верхних конечностей." },
  { title: "Головной мозг: Отделы", facts: ["Головной мозг — высший отдел нервной системы, состоит из ствола, мозжечка и больших полушарий.", "Продолговатый мозг содержит центры дыхания, кровообращения и пищеварения.", "Мост связывает ствол с мозжечком и содержит ядра черепных нервов.", "Средний мозг участвует в регуляции тонуса мышц и ориентировочных рефлексах.", "Мозжечок обеспечивает координацию движений и равновесие.", "Промежуточный мозг (таламус и гипоталамус) регулирует обмен веществ, температуру тела и эндокринные функции.", "Продолговатый мозг называют «жизненно важным центром», так как его повреждение мгновенно смертельно.", "Таламус — центр переключения всех сенсорных путей.", "Гипоталамус контролирует гипофиз и регулирует гомеостаз.", "Мозжечок содержит больше нейронов, чем вся кора больших полушарий."], note: "Продолговатый мозг называют «жизненно важным центром», так как его повреждение мгновенно смертельно." },
  { title: "Кора больших полушарий", facts: ["Кора — высший отдел головного мозга, толщиной 2-4 мм, покрывает полушария.", "Она имеет борозды (углубления) и извилины (складки), что увеличивает её площадь.", "Кора состоит из шести слоёв клеток и содержит около 14 миллиардов нейронов.", "Выделяют четыре доли: лобную (движение, речь, мышление), теменную (чувствительность), височную (слух, память) и затылочную (зрение).", "В коре расположены центры речи (Брока и Вернике), анализаторы, центры памяти и мышления.", "Кора обеспечивает сознание, высшую нервную деятельность и адаптацию к окружающей среде.", "Площадь коры больших полушарий составляет около 2200 квадратных сантиметров.", "Центр Брока отвечает за моторную речь, центр Вернике — за понимание речи.", "Моторная зона коры расположена в передней центральной извилине.", "Чувствительная зона коры расположена в задней центральной извилине."], note: "Площадь коры больших полушарий составляет около 2200 квадратных сантиметров." },
  { title: "Вегетативная нервная система", facts: ["Вегетативная (автономная) нервная система регулирует деятельность внутренних органов, желез и гладких мышц.", "Она делится на симпатическую и парасимпатическую части, которые работают согласованно.", "Симпатическая система активизируется при стрессе (режим «бей или беги»): учащает пульс, расширяет зрачки, повышает давление.", "Парасимпатическая система активизируется в покое: замедляет пульс, снижает давление, стимулирует пищеварение.", "Центры вегетативной системы расположены в гипоталамусе, стволе мозга и спинном мозге.", "Нарушение вегетативной регуляции приводит к дисфункциям внутренних органов.", "Блуждающий нерв — главный представитель парасимпатической системы, иннервирующий большинство органов.", "Симпатическая система мобилизует ресурсы организма в экстремальных ситуациях.", "Парасимпатическая система способствует восстановлению и отдыху.", "Вегетативная система работает автономно, но контролируется корой головного мозга."], note: "Блуждающий нерв — главный представитель парасимпатической системы, иннервирующий большинство органов." },
  { title: "Воздухоносные пути", facts: ["Носовая полость очищает, согревает и увлажняет воздух, содержит обонятельные рецепторы.", "Глотка — общий путь для дыхания и пищеварения.", "Гортань образована хрящами (щитовидный, перстневидный) и содержит голосовые связки.", "Трахея (дыхательное горло) состоит из хрящевых полуколец и делится на два главных бронха.", "Бронхи ветвятся на более мелкие бронхиолы, образуя бронхиальное дерево.", "Слизистая оболочка дыхательных путей выстлана ресничным эпителием, который удаляет пыль и микроорганизмы.", "При раздражении голосовых связок возникает кашель — защитный рефлекс.", "Носовая полость имеет верхний, средний и нижний носовые ходы.", "Гортань выполняет также защитную функцию (рефлекс кашля).", "Трахея начинается на уровне VI шейного позвонка."], note: "При раздражении голосовых связок возникает кашель — защитный рефлекс." },
  { title: "Лёгкие и альвеолы", facts: ["Лёгкие — парный орган, расположенный в грудной полости, покрытый плеврой.", "Правое лёгкое имеет три доли, левое — две, что связано с расположением сердца.", "Внутри лёгких бронхи разветвляются на альвеолярные ходы, заканчивающиеся альвеолами.", "Альвеолы — микроскопические пузырьки, стенки которых оплетены капиллярами.", "Через стенку альвеол происходит газообмен: кислород переходит в кровь, углекислый газ — в альвеолы.", "Общая площадь альвеол составляет около 70-80 кв. метров, что обеспечивает эффективный газообмен.", "Альвеолы покрыты сурфактантом — веществом, предотвращающим их слипание при выдохе.", "В лёгких взрослого человека насчитывается около 300-400 миллионов альвеол.", "Лёгочная ткань имеет губчатую структуру.", "Плевра состоит из двух листков: висцерального и париетального."], note: "Альвеолы покрыты сурфактантом — веществом, предотвращающим их слипание при выдохе." },
  { title: "Механизм дыхания", facts: ["Дыхание осуществляется благодаря работе дыхательных мышц: диафрагмы и межрёберных мышц.", "При вдохе диафрагма сокращается и опускается, а межрёберные мышцы поднимают рёбра, увеличивая объём грудной клетки.", "Давление в лёгких понижается, и воздух засасывается в альвеолы.", "При выдохе мышцы расслабляются, объём грудной клетки уменьшается, и воздух выталкивается наружу.", "Различают дыхательный объём, резервный объём вдоха и выдоха, остаточный объём и жизненную ёмкость лёгких.", "Дыхательный центр, расположенный в продолговатом мозге, автоматически регулирует частоту и глубину дыхания.", "Жизненная ёмкость лёгких — максимальный объём воздуха, который человек может выдохнуть после самого глубокого вдоха.", "Дыхательный объём в покое составляет около 500 мл.", "Остаточный объём — воздух, остающийся в лёгких после максимального выдоха.", "Частота дыхания взрослого человека в покое — 12-18 раз в минуту."], note: "Жизненная ёмкость лёгких — максимальный объём воздуха, который человек может выдохнуть после самого глубокого вдоха." },
  { title: "Полость рта и глотка", facts: ["В полости рта происходит механическое измельчение пищи зубами и химическое расщепление ферментами слюны (амилаза).", "Слюна выделяется тремя парами слюнных желез (околоушные, поднижнечелюстные, подъязычные).", "Язык перемешивает пищу и формирует пищевой комок, а также является органом вкуса.", "Глотка — мышечная трубка, соединяющая ротовую полость с пищеводом, через неё проходит пища.", "Глотание — сложный рефлекторный акт, при котором надгортанник закрывает вход в гортань.", "Пищевод — цилиндрическая трубка длиной около 25 см, по которой пища продвигается благодаря перистальтике.", "Зубы человека делятся на резцы, клыки, премоляры и моляры, всего 32 постоянных зуба.", "Слюна содержит фермент амилазу, расщепляющий углеводы.", "Язык имеет сосочки, содержащие вкусовые рецепторы.", "Глотка делится на носоглотку, ротоглотку и гортаноглотку."], note: "Зубы человека делятся на резцы, клыки, премоляры и моляры, всего 32 постоянных зуба." },
  { title: "Желудок", facts: ["Желудок — расширенная часть пищеварительного тракта, вмещающая до 2-3 литров пищи.", "Слизистая оболочка желудка содержит железы, выделяющие желудочный сок (соляную кислоту и ферменты: пепсин, липаза).", "Соляная кислота активирует пепсин, убивает бактерии и денатурирует белки.", "Стенка желудка имеет три слоя мышц, обеспечивающих перемешивание пищи.", "Пища в желудке превращается в химус (полужидкую кашицу) и порциями поступает в двенадцатиперстную кишку.", "Защита слизистой желудка от самопереваривания обеспечивается слоем слизи и бикарбонатами.", "В желудке всасывается небольшое количество воды, алкоголя и некоторых лекарств.", "Желудочный сок имеет кислую реакцию (pH 1.5-3.5).", "Обкладочные клетки желудка секретируют соляную кислоту.", "Главные клетки желудка секретируют пепсиноген."], note: "В желудке всасывается небольшое количество воды, алкоголя и некоторых лекарств." },
  { title: "Тонкая кишка", facts: ["Тонкая кишка — самый длинный отдел пищеварительного тракта (5-6 метров), состоящий из двенадцатиперстной, тощей и подвздошной кишок.", "В двенадцатиперстную кишку выделяются желчь (из печени) и панкреатический сок (из поджелудочной железы).", "Здесь происходит окончательное расщепление белков, жиров и углеводов.", "Слизистая оболочка тонкой кишки имеет ворсинки, которые увеличивают площадь всасывания.", "В ворсинках происходит всасывание питательных веществ в кровь и лимфу.", "Аминокислоты и глюкоза всасываются в кровь, жирные кислоты — в лимфу.", "В тонкой кишке происходит всасывание до 90% питательных веществ.", "Двенадцатиперстная кишка — начальный отдел тонкой кишки.", "Тощая кишка — средний отдел, подвздошная — конечный.", "Слизистая тонкой кишки образует круговые складки, увеличивающие площадь поверхности."], note: "В тонкой кишке происходит всасывание до 90% питательных веществ." },
  { title: "Печень и поджелудочная железа", facts: ["Печень — крупнейшая железа тела (1,5 кг), выполняющая множество функций: выработка желчи, обезвреживание токсинов, участие в обмене веществ.", "Желчь накапливается в желчном пузыре и выделяется в двенадцатиперстную кишку для эмульгирования жиров.", "Поджелудочная железа выделяет панкреатический сок, содержащий ферменты (трипсин, липазу, амилазу) для расщепления всех компонентов пищи.", "В островках Лангерганса поджелудочной железы вырабатываются гормоны инсулин и глюкагон, регулирующие уровень сахара в крови.", "Печень также синтезирует белки плазмы крови, витамины, гликоген.", "Нарушение работы этих органов приводит к серьёзным заболеваниям (гепатит, панкреатит, диабет).", "Печень обладает уникальной способностью к регенерации — восстановлению до 70% утраченной ткани.", "Желчь не содержит ферментов, но эмульгирует жиры, облегчая их переваривание.", "Поджелудочная железа расположена позади желудка.", "Печень расположена в правом подреберье."], note: "Печень обладает уникальной способностью к регенерации — восстановлению до 70% утраченной ткани." },
  { title: "Почки", facts: ["Почки — парный орган бобовидной формы, расположены забрюшинно в поясничной области.", "Структурно-функциональная единица почки — нефрон, который состоит из капсулы Шумлянского-Боумена и канальцев.", "В клубочке нефрона происходит фильтрация крови, в результате чего образуется первичная моча (до 180 литров в сутки).", "В канальцах происходит реабсорбция (обратное всасывание) воды, глюкозы, аминокислот и солей.", "Оставшаяся жидкость (вторичная моча) собирается в почечные чашки и лоханки, затем по мочеточникам поступает в мочевой пузырь.", "Почки также регулируют артериальное давление (вырабатывают ренин) и кроветворение (вырабатывают эритропоэтин).", "Почки фильтруют весь объём крови около 60 раз в сутки.", "В каждой почке около 1 миллиона нефронов.", "Почки регулируют водно-солевой баланс и кислотно-щелочное равновесие.", "Почки расположены на уровне поясничных позвонков."], note: "Почки фильтруют весь объём крови около 60 раз в сутки." },
  { title: "Мочевыводящие пути", facts: ["Мочеточники — трубки длиной около 30 см, соединяющие почки с мочевым пузырём.", "Стенка мочеточников имеет мышечный слой, обеспечивающий перистальтику и продвижение мочи.", "Мочевой пузырь — полый мышечный орган, расположенный в малом тазу, вмещающий до 500 мл мочи.", "Мочеиспускательный канал (уретра) выводит мочу из пузыря наружу.", "Мочеиспускание — рефлекторный акт, который контролируется корой головного мозга (у взрослых).", "Заболевания мочевыводящих путей (цистит, уретрит) часто сопровождаются болезненным мочеиспусканием.", "У мужчин мочеиспускательный канал длиннее и выполняет также функцию выведения спермы.", "У женщин уретра короче, что способствует более частому развитию цистита.", "Мочевой пузырь имеет мышечную стенку (детрузор).", "Мочеточники впадают в мочевой пузырь в области мочепузырного треугольника."], note: "У мужчин мочеиспускательный канал длиннее и выполняет также функцию выведения спермы." },
  { title: "Мужская половая система", facts: ["Мужские половые железы — яички (семенники), расположенные в мошонке.", "В яичках образуются сперматозоиды (сперматогенез) и вырабатывается мужской половой гормон тестостерон.", "Сперматозоиды созревают в придатках яичка и по семявыносящим протокам поступают к семенным пузырькам и предстательной железе.", "Семенные пузырьки и предстательная железа вырабатывают секрет, который является питательной средой для сперматозоидов.", "Совокупность сперматозоидов и секрета желез называется спермой (семенной жидкостью).", "Половой член служит для выведения спермы и мочеиспускания.", "Оптимальная температура для сперматогенеза — 34-35°C, поэтому яички вынесены за пределы брюшной полости.", "Предстательная железа расположена под мочевым пузырём.", "Сперматозоид состоит из головки, шейки и хвоста.", "В головке сперматозоида находится ядро с генетическим материалом."], note: "Оптимальная температура для сперматогенеза — 34-35°C, поэтому яички вынесены за пределы брюшной полости." },
  { title: "Женская половая система", facts: ["Женские половые железы — яичники, расположенные в малом тазу.", "В яичниках созревают яйцеклетки и вырабатываются женские половые гормоны (эстрогены и прогестерон).", "Яйцеклетка выходит из яичника при овуляции и попадает в маточную трубу.", "Оплодотворение происходит в маточной трубе, после чего зигота перемещается в матку и имплантируется в её слизистую оболочку.", "В матке развивается плод, который связан с организмом матери через плаценту и пуповину.", "Беременность длится около 40 недель и завершается родами.", "Менструальный цикл в среднем составляет 28 дней и регулируется гормонами гипофиза и яичников.", "Матка — полый мышечный орган, выстланный эндометрием.", "Маточные трубы имеют реснички, способствующие продвижению яйцеклетки.", "Плацента обеспечивает питание и дыхание плода."], note: "Менструальный цикл в среднем составляет 28 дней и регулируется гормонами гипофиза и яичников." },
  { title: "Гипофиз", facts: ["Гипофиз — главная железа внутренней секреции, расположенная у основания головного мозга.", "Он состоит из передней (аденогипофиз) и задней (нейрогипофиз) долей.", "Передняя доля вырабатывает гормоны: соматотропин (гормон роста), тиреотропин (ТТГ), адренокортикотропин (АКТГ), фолликулостимулирующий (ФСГ) и лютеинизирующий (ЛГ) гормоны, пролактин.", "Задняя доля выделяет окситоцин (стимулирует роды и лактацию) и вазопрессин (регулирует водный баланс).", "Гипофиз связан с гипоталамусом, который контролирует его деятельность.", "Нарушение функций гипофизa приводит к гигантизму, карликовости, акромегалии.", "Гипофиз называют «дирижёром эндокринного оркестра», так как он контролирует работу других желез.", "Соматотропин стимулирует рост костей и мышц.", "Вазопрессин усиливает реабсорбцию воды в почках.", "Окситоцин вызывает сокращение матки при родах."], note: "Гипофиз называют «дирижёром эндокринного оркестра», так как он контролирует работу других желез." },
  { title: "Щитовидная и паращитовидные железы", facts: ["Щитовидная железа расположена на передней поверхности шеи и состоит из двух долей и перешейка.", "Она вырабатывает гормоны тироксин (Т4) и трийодтиронин (Т3), регулирующие обмен веществ, рост и развитие.", "Недостаток этих гормонов приводит к гипотиреозу (микседема у взрослых, кретинизм у детей), избыток — к тиреотоксикозу.", "Паращитовидные железы расположены на задней поверхности щитовидной железы.", "Они вырабатывают паратгормон, регулирующий уровень кальция и фосфора в крови.", "Нарушение работы паращитовидных желез вызывает судороги (при недостатке кальция) или остеопороз (при избытке).", "Для синтеза гормонов щитовидной железы необходим йод, который поступает с пищей и водой.", "Щитовидная железа имеет фолликулярное строение.", "Тиреокальцитонин (кальцитонин) снижает уровень кальция в крови.", "Паратгормон повышает уровень кальция в крови."], note: "Для синтеза гормонов щитовидной железы необходим йод, который поступает с пищей и водой." },
  { title: "Надпочечники", facts: ["Надпочечники — парные железы, расположенные над почками.", "Они состоят из коркового и мозгового вещества.", "Корковое вещество вырабатывает кортизол (регулирует обмен веществ и стресс), альдостерон (регулирует водно-солевой баланс) и андрогены.", "Мозговое вещество вырабатывает адреналин и норадреналин, которые мобилизуют организм при стрессе.", "Гормоны надпочечников участвуют в адаптации к стрессу, регуляции давления и иммунитета.", "Недостаток кортизола вызывает болезнь Аддисона, избыток — синдром Иценко-Кушинга.", "Адреналин вызывает учащение сердцебиения, расширение зрачков и повышение уровня глюкозы в крови.", "Альдостерон задерживает натрий и выводит калий.", "Кортизол повышает уровень глюкозы в крови.", "Мозговое вещество надпочечников является частью симпатической нервной системы."], note: "Адреналин вызывает учащение сердцебиения, расширение зрачков и повышение уровня глюкозы в крови." },
  { title: "Органы иммунной системы", facts: ["Центральные органы иммунной системы: красный костный мозг (где образуются все клетки крови) и тимус (где созревают Т-лимфоциты).", "Периферические органы: селезёнка, лимфатические узлы, миндалины, аппендикс, лимфоидные фолликулы кишечника.", "Селезёнка фильтрует кровь и участвует в иммунном ответе, разрушая старые эритроциты.", "Лимфатические узлы фильтруют лимфу и являются местом размножения лимфоцитов.", "Миндалины (глоточные, нёбные, язычные) защищают от инфекций, поступающих через рот и нос.", "Лимфоидная ткань, ассоциированная с кишечником (пейеровы бляшки), защищает пищеварительный тракт.", "Тимус наиболее активен в детском возрасте, с годами он замещается жировой тканью.", "Селезёнка является депо крови.", "Лимфатические узлы располагаются группами (шейные, подмышечные, паховые).", "Миндалины образуют лимфоидное кольцо Пирогова-Вальдейера."], note: "Тимус наиболее активен в детском возрасте, с годами он замещается жировой тканью." },
  { title: "Иммунитет: виды и механизмы", facts: ["Врождённый иммунитет — это неспецифическая защита, действующая против любых чужеродных агентов.", "Он включает барьеры (кожа, слизистые), фагоцитоз (поглощение микробов клетками), воспаление и естественные киллеры (NK-клетки).", "Приобретённый иммунитет — специфическая защита против конкретного антигена.", "Он делится на гуморальный (выработка антител В-лимфоцитами) и клеточный (уничтожение поражённых клеток Т-лимфоцитами).", "Активный иммунитет возникает после перенесённой болезни или вакцинации.", "Пассивный иммунитет передаётся от матери ребёнку через плаценту или с грудным молоком, а также вводится с лечебными сыворотками.", "Вакцинация — самый эффективный способ создания активного приобретённого иммунитета.", "Антитела вырабатываются плазматическими клетками (производными В-лимфоцитов).", "Т-киллеры уничтожают инфицированные клетки.", "Т-хелперы помогают В-лимфоцитам вырабатывать антитела."], note: "Вакцинация — самый эффективный способ создания активного приобретённого иммунитета." },
  { title: "Аллергия и аутоиммунные реакции", facts: ["Аллергия — это чрезмерная иммунная реакция на безвредные вещества (аллергены).", "При первом контакте с аллергеном организм вырабатывает антитела IgE, которые фиксируются на тучных клетках.", "При повторном контакте аллерген связывается с IgE, вызывая выброс гистамина и других медиаторов воспаления.", "Симптомы аллергии: насморк, сыпь, отёк, зуд, в тяжёлых случаях — анафилактический шок.", "Аутоиммунные заболевания возникают, когда иммунная система атакует собственные ткани (например, ревматоидный артрит, рассеянный склероз).", "Лечение аллергии включает антигистаминные препараты, а аутоиммунных diseases — иммуносупрессоры.", "Гистамин расширяет сосуды и повышает их проницаемость, вызывая отёк и покраснение.", "Анафилактический шок требует немедленного введения адреналина.", "К аутоиммунным заболеваниям относится также сахарный диабет 1 типа.", "Аллергены могут быть пищевыми, бытовыми, пыльцевыми, лекарственными."], note: "Гистамин расширяет сосуды и повышает их проницаемость, вызывая отёк и покраснение." },
  { title: "Зрительный анализатор", facts: ["Глаз — парный орган зрения, расположенный в глазнице.", "Стенка глазного яблока состоит из трёх оболочек: фиброзной (склера и роговица), сосудистой (радужка, цилиарное тело, хориоидея) и сетчатки.", "Сетчатка содержит фоторецепторы: палочки (воспринимают свет) и колбочки (воспринимают цвет).", "Свет проходит через роговицу, зрачок и хрусталик, фокусируясь на сетчатке.", "Сигнал от фоторецепторов передаётся по зрительному нерву в зрительную кору затылочной доли.", "Аккомодация — способность хрусталика изменять кривизну для фокусировки на близких и дальних предметах.", "В сетчатке насчитывается около 120 миллионов палочек и 6 миллионов колбочек.", "Колбочки бывают трёх типов, воспринимающих красный, зелёный и синий цвета.", "Зрачок регулирует количество света, попадающего на сетчатку.", "Роговица — прозрачная часть фиброзной оболочки, преломляющая свет."], note: "В сетчатке насчитывается около 120 миллионов палочек и 6 миллионов колбочек." },
  { title: "Слуховой анализатор", facts: ["Ухо — орган слуха и равновесия, состоит из наружного, среднего и внутреннего отделов.", "Наружное ухо (ушная раковина, слуховой проход) улавливает звуковые волны.", "Среднее ухо содержит барабанную перепонку и три слуховые косточки (молоточек, наковальня, стремечко), которые усиливают звук.", "Внутреннее ухо включает улитку (орган слуха) и вестибулярный аппарат (орган равновесия).", "В улитке звуковые колебания преобразуются в нервные импульсы волосковыми клетками кортиева органа.", "Сигнал передаётся по слуховому нерву в слуховую кору височной доли.", "Стремечко — самая маленькая кость в организме человека (около 3 мм).", "Барабанная перепонка колеблется под действием звуковых волн.", "Евстахиева труба соединяет среднее ухо с носоглоткой и выравнивает давление.", "Вестибулярный аппарат состоит из преддверия и полукружных каналов."], note: "Стремечко — самая маленькая кость в организме человека (около 3 мм)." },
  { title: "Кожа и её производные", facts: ["Кожа — наружный покров тела, состоящий из эпидермиса, дермы и гиподермы.", "Эпидермис — многослойный плоский эпителий, постоянно обновляющийся.", "Дерма содержит коллагеновые и эластиновые волокна, сосуды, нервы, волосяные фолликулы, потовые и сальные железы.", "Гиподерма — подкожная жировая клетчатка, выполняющая защитную и терморегуляторную функции.", "Функции кожи: защитная, терморегуляторная, выделительная, дыхательная, осязательная, синтез витамина D.", "Производные кожи: волосы, ногти, молочные, потовые и сальные железы.", "Кожа — самый крупный орган тела, её площадь у взрослого человека составляет 1,5-2 кв. метра.", "Эпидермис состоит из пяти слоёв, самый наружный — роговой.", "В дерме находятся потовые и сальные железы.", "Подкожная жировая клетчатка выполняет функцию теплоизоляции."], note: "Кожа — самый крупный орган тела, её площадь у взрослого человека составляет 1,5-2 кв. метра." },
  { title: "Терморегуляция", facts: ["Терморегуляция — способность организма поддерживать постоянную температуру тела (около 37°C).", "Химическая терморегуляция осуществляется за счёт обмена веществ (образование тепла в мышцах и печени).", "Физическая терморегуляция включает теплоотдачу через кожу (излучение, испарение пота, теплопроведение).", "При повышении температуры окружающей среды сосуды кожи расширяются, увеличивая теплоотдачу.", "При понижении температуры сосуды сужаются, а мышцы сокращаются (дрожь), вырабатывая тепло.", "Центр терморегуляции находится в гипоталамусе.", "Лихорадка — это защитно-приспособительная реакция, при которой повышается температура тела для борьбы с инфекцией.", "Потоотделение способствует охлаждению организма при перегреве.", "Дрожь — это непроизвольные сокращения мышц, вырабатывающие тепло.", "Гипотермия — состояние, при котором температура тела опускается ниже 35°C."], note: "Лихорадка — это защитно-приспособительная реакция, при которой повышается температура тела для борьбы с инфекцией." }
];

// ГЕНЕРАЦИЯ 500 СЛАЙДОВ
const D = [];
let id = 1;

while (D.length < 500) {
  for (let i = 0; i < knowledgeBase.length; i++) {
    const topic = knowledgeBase[i];
    const chunkSize = 5; // По 5 фактов на слайд
    for (let j = 0; j < topic.facts.length; j += chunkSize) {
      const chunk = topic.facts.slice(j, j + chunkSize);
      if (chunk.length > 0) {
        D.push([
          "I",
          `Анатомия · ${String(id).padStart(3, '0')}`,
          topic.title,
          chunk,
          topic.note
        ]);
        id++;
        if (D.length >= 500) break;
      }
    }
    if (D.length >= 500) break;
  }
}

// РЕНДЕР

const deck = document.getElementById('deck');
const total = D.length;
const progressBar = document.getElementById('progressBar');

function highlightTerms(text) {
  let result = text;
  const terms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
  for (const term of terms) {
    const regex = new RegExp(`\\b(${term})\\b`, 'gi');
    result = result.replace(regex, `<span class="term" data-def="${GLOSSARY[term]}">$1</span>`);
  }
  return result;
}

D.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s[0] === 'S' ? 'section' : 'info');
  
  let html = '';
  
  if (s[0] === 'S') {
    html += `<div class="num">${s[1]}</div><h2 class="section-title">${s[2]}</h2><p class="section-sub">${s[3]}</p>`;
  } else {
    const pts = (s[3] || []).map((p, k) => {
      const highlighted = highlightTerms(p);
      return `<div class="point"><span class="n">${String(k + 1).padStart(2, '0')}</span><p>${highlighted}</p></div>`;
    }).join('');
    
    html += `
      <div class="kicker">${s[1]}</div>
      <h2 class="title">${s[2]}</h2>
      <div class="points">${pts}</div>
      ${s[4] ? `<p class="note">${highlightTerms(s[4])}</p>` : ''}
    `;
  }
  
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
function show(n) {
  if (n < 0) n = 0;
  if (n >= total) n = total - 1;
  if (n === cur && deck.children[cur].classList.contains('active')) return;

  const oldEl = deck.children[cur];
  const newEl = deck.children[n];

  if (oldEl && oldEl !== newEl) {
    oldEl.classList.remove('active');
  }

  cur = n;
  newEl.classList.add('active');
  
  // Обновляем полосу прогресса
  progressBar.style.width = ((cur + 1) / total * 100) + '%';
}

function nextSlide() { show(cur + 1); }
function prevSlide() { show(cur - 1); }

// ОБРАБОТКА КЛИКОВ
document.addEventListener('click', (e) => {
  if (e.target.closest('#themeBtn')) return;
  if (e.target.classList.contains('term')) {
    e.stopPropagation();
    const def = e.target.getAttribute('data-def');
    showTooltip(e.target, def);
    return;
  }
  if (window.getSelection && window.getSelection().toString()) return;
  if (e.clientX > window.innerWidth * 0.5) nextSlide();
  else prevSlide();
});

// Клавиатура
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
});

// Свайпы
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  
  if (dt > 500) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextSlide(); else prevSlide();
  }
}, { passive: true });

// Сноски
const tooltip = document.getElementById('tooltip');
function showTooltip(target, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  
  const rect = target.getBoundingClientRect();
  let top = rect.top - 10;
  let left = rect.left + rect.width / 2;
  
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
  tooltip.style.transform = 'translate(-50%, -100%)';
  
  const tRect = tooltip.getBoundingClientRect();
  if (tRect.left < 10) {
    tooltip.style.left = '10px';
    tooltip.style.transform = 'translate(0, -100%)';
  } else if (tRect.right > window.innerWidth - 10) {
    tooltip.style.left = `${window.innerWidth - 10}px`;
    tooltip.style.transform = 'translate(-100%, -100%)';
  }

  setTimeout(() => { tooltip.classList.remove('show'); }, 4000);
}

// СМЕНА ТЕМЫ (КЛИК ПО ИКОНКЕ)
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');

const SUN_PATH = `<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>`;
const MOON_PATH = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

themeBtn.addEventListener('click', (e) => {
  e.stopPropagation(); // Чтобы не переключился слайд
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    themeIcon.innerHTML = MOON_PATH;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#050505');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeIcon.innerHTML = SUN_PATH;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f4');
  }
});

// Старт
show(0);
</script>
