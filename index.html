<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>Анатомия человека — 500 слайдов</title>
<style>
:root {
  --bg: #080808;
  --text: #f5f5f7;
  --text-muted: #86868b;
  --text-dim: #424245;
  --border: rgba(255, 255, 255, 0.12);
  --term-bg: rgba(255, 255, 255, 0.1);
  --tooltip-bg: #1c1c1e;
  --tooltip-border: #333;
  --progress-bg: rgba(255,255,255,0.1);
  --progress-fill: #86868b;
}
[data-theme="light"] {
  --bg: #f4f4f4;
  --text: #1d1d1f;
  --text-muted: #6e6e73;
  --text-dim: #a1a1a6;
  --border: rgba(0, 0, 0, 0.1);
  --term-bg: rgba(0, 0, 0, 0.05);
  --tooltip-bg: #ffffff;
  --tooltip-border: #e5e5ea;
  --progress-bg: rgba(0,0,0,0.1);
  --progress-fill: #1d1d1f;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  transition: background 0.5s ease, color 0.5s ease;
}

/* СТАТИЧНЫЙ ФОН С ЗЕРНИСТОСТЬЮ (КАК ПЛЁНКА) */
.film-grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
  opacity: 0.08;
}
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 110%);
}
[data-theme="light"] .vignette {
  background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.1) 110%);
}

/* СЛАЙДЫ С ПЛАВНЫМ ПЕРЕХОДОМ */
#deck { position: relative; width: 100%; height: 100dvh; z-index: 1; }
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(8vh + env(safe-area-inset-top)) calc(6vw + env(safe-area-inset-right)) calc(10vh + env(safe-area-inset-bottom)) calc(6vw + env(safe-area-inset-left));
  opacity: 0; pointer-events: none; z-index: 1;
  transition: opacity 1.6s cubic-bezier(0.25, 0.1, 0.25, 1);
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: auto; z-index: 10; }

/* ТИПОГРАФИКА */
.kicker {
  font-size: clamp(0.6rem, 2vw, 0.75rem); letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; margin-bottom: 0.5rem;
}
.title {
  font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; line-height: 1.1;
  letter-spacing: -0.02em; margin-bottom: 1.2rem; color: var(--text);
}
.points {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 2rem;
}
.point { display: flex; gap: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
.point .n { font-size: 0.75rem; color: var(--text-dim); min-width: 1rem; font-weight: 600; }
.point p { font-size: clamp(0.75rem, 2.8vw, 0.9rem); line-height: 1.4; color: var(--text); }

/* СНОСКИ */
.term { border-bottom: 1px dashed var(--text-muted); cursor: pointer; font-weight: 500; }
.note {
  margin-top: 1.5rem; font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: var(--text-muted); font-style: italic;
  line-height: 1.4; padding-left: 0.8rem; border-left: 2px solid var(--text-dim);
}

/* РАЗДЕЛЫ */
.section .num {
  font-size: clamp(3rem, 10vw, 6rem); font-weight: 200; line-height: 1; color: transparent;
  -webkit-text-stroke: 1px var(--text-dim); margin-bottom: 0.5rem;
}
.section-title { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 700; line-height: 1.1; margin-bottom: 1rem; }
.section-sub { font-size: clamp(0.9rem, 3vw, 1.1rem); color: var(--text-muted); line-height: 1.4; }

/* КНОПКА ТЕМЫ */
.theme-btn {
  position: fixed; top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer;
  transition: color 0.3s, transform 0.3s;
}
.theme-btn:hover { color: var(--text); transform: scale(1.1); }
.theme-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ВОДЯНОЙ ЗНАК */
.watermark {
  position: fixed; bottom: calc(15px + env(safe-area-inset-bottom)); left: calc(20px + env(safe-area-inset-left));
  font-size: 0.65rem; letter-spacing: 0.3em; color: var(--text-muted); opacity: 0.3;
  text-transform: uppercase; z-index: 50; pointer-events: none; font-weight: 600;
}

/* ПОЛОСА ПРОГРЕССА */
.progress-container {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--progress-bg);
  z-index: 100; pointer-events: none;
}
.progress-bar {
  height: 100%; background: var(--progress-fill); width: 0%;
  transition: width 0.3s ease;
}

/* TOOLTIP */
.tooltip {
  position: fixed; background: var(--tooltip-bg); border: 1px solid var(--tooltip-border);
  padding: 10px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--text);
  max-width: 250px; line-height: 1.4; z-index: 9999; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s, visibility 0.2s; pointer-events: none;
}
.tooltip.show { opacity: 1; visibility: visible; transform: translateY(0); }

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 600px) {
  .points { grid-template-columns: 1fr; gap: 0.5rem; }
  .point p { font-size: clamp(0.75rem, 3.5vw, 0.85rem); line-height: 1.35; }
  .title { font-size: clamp(1.3rem, 5.5vw, 1.6rem); margin-bottom: 1rem; }
  .note { font-size: 0.75rem; margin-top: 1rem; }
  .slide { padding-top: calc(12vh + env(safe-area-inset-top)); }
}
</style>
</head>

// РЕНДЕР
const deck = document.getElementById('deck');
const total = D.length;
const progressBar = document.getElementById('progressBar');

function highlightTerms(text) {
  let result = text;
  const terms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
  for (const term of terms) {
    const regex = new RegExp(`\\b(${term})\\b`, 'gi');
    result = result.replace(regex, `<span class="term" data-def="${GLOSSARY[term]}">$1</span>`);
  }
  return result;
}

D.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s[0] === 'S' ? 'section' : 'info');
  
  let html = '';
  
  if (s[0] === 'S') {
    html += `<div class="num">${s[1]}</div><h2 class="section-title">${s[2]}</h2><p class="section-sub">${s[3]}</p>`;
  } else {
    const pts = (s[3] || []).map((p, k) => {
      const highlighted = highlightTerms(p);
      return `<div class="point"><span class="n">${String(k + 1).padStart(2, '0')}</span><p>${highlighted}</p></div>`;
    }).join('');
    
    html += `
      <div class="kicker">${s[1]}</div>
      <h2 class="title">${s[2]}</h2>
      <div class="points">${pts}</div>
      ${s[4] ? `<p class="note">${highlightTerms(s[4])}</p>` : ''}
    `;
  }
  
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
function show(n) {
  if (n < 0) n = 0;
  if (n >= total) n = total - 1;
  if (n === cur && deck.children[cur].classList.contains('active')) return;

  const oldEl = deck.children[cur];
  const newEl = deck.children[n];

  if (oldEl && oldEl !== newEl) {
    oldEl.classList.remove('active');
  }

  cur = n;
  newEl.classList.add('active');
  
  progressBar.style.width = ((cur + 1) / total * 100) + '%';
}

function nextSlide() { show(cur + 1); }
function prevSlide() { show(cur - 1); }

// ОБРАБОТКА КЛИКОВ
document.addEventListener('click', (e) => {
  if (e.target.closest('#themeBtn')) return;
  if (e.target.classList.contains('term')) {
    e.stopPropagation();
    const def = e.target.getAttribute('data-def');
    showTooltip(e.target, def);
    return;
  }
  if (window.getSelection && window.getSelection().toString()) return;
  if (e.clientX > window.innerWidth * 0.5) nextSlide();
  else prevSlide();
});

// Клавиатура
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
});

// Свайпы
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  
  if (dt > 500) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextSlide(); else prevSlide();
  }
}, { passive: true });

// Сноски
const tooltip = document.getElementById('tooltip');
function showTooltip(target, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  
  const rect = target.getBoundingClientRect();
  let top = rect.top - 10;
  let left = rect.left + rect.width / 2;
  
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
  tooltip.style.transform = 'translate(-50%, -100%)';
  
  const tRect = tooltip.getBoundingClientRect();
  if (tRect.left < 10) {
    tooltip.style.left = '10px';
    tooltip.style.transform = 'translate(0, -100%)';
  } else if (tRect.right > window.innerWidth - 10) {
    tooltip.style.left = `${window.innerWidth - 10}px`;
    tooltip.style.transform = 'translate(-100%, -100%)';
  }

  setTimeout(() => { tooltip.classList.remove('show'); }, 4000);
}

// СМЕНА ТЕМЫ
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');

const SUN_PATH = `<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>`;
const MOON_PATH = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

themeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    themeIcon.innerHTML = MOON_PATH;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#080808');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeIcon.innerHTML = SUN_PATH;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f4');
  }
});

// Старт
show(0);
</script>
