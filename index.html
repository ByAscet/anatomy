<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>Анатомия человека</title>
<style>
:root {
  --bg: #080808;
  --text: #f5f5f7;
  --text-muted: #86868b;
  --text-dim: #424245;
  --border: rgba(255, 255, 255, 0.12);
  --term-bg: rgba(255, 255, 255, 0.1);
  --tooltip-bg: #1c1c1e;
  --tooltip-border: #333;
  --progress-bg: rgba(255,255,255,0.1);
  --progress-fill: #86868b;
}
[data-theme="light"] {
  --bg: #f4f4f4;
  --text: #1d1d1f;
  --text-muted: #6e6e73;
  --text-dim: #a1a1a6;
  --border: rgba(0, 0, 0, 0.1);
  --term-bg: rgba(0, 0, 0, 0.05);
  --tooltip-bg: #ffffff;
  --tooltip-border: #e5e5ea;
  --progress-bg: rgba(0,0,0,0.1);
  --progress-fill: #1d1d1f;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  transition: background 0.5s ease, color 0.5s ease;
}

/* СТАТИЧНЫЙ ФОН С ЗЕРНИСТОСТЬЮ (КАК ПЛЁНКА) */
.film-grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
  opacity: 0.08;
}
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 110%);
}
[data-theme="light"] .vignette {
  background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.1) 110%);
}

/* СЛАЙДЫ С ПЛАВНЫМ ПЕРЕХОДОМ */
#deck { position: relative; width: 100%; height: 100dvh; z-index: 1; }
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(8vh + env(safe-area-inset-top)) calc(6vw + env(safe-area-inset-right)) calc(10vh + env(safe-area-inset-bottom)) calc(6vw + env(safe-area-inset-left));
  opacity: 0; pointer-events: none; z-index: 1;
  transition: opacity 1.6s cubic-bezier(0.25, 0.1, 0.25, 1);
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: auto; z-index: 10; }

/* ТИПОГРАФИКА */
.kicker {
  font-size: clamp(0.6rem, 2vw, 0.75rem); letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; margin-bottom: 0.5rem;
}
.title {
  font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; line-height: 1.1;
  letter-spacing: -0.02em; margin-bottom: 1.2rem; color: var(--text);
}
.points {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 2rem;
}
.point { display: flex; gap: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
.point .n { font-size: 0.75rem; color: var(--text-dim); min-width: 1rem; font-weight: 600; }
.point p { font-size: clamp(0.75rem, 2.8vw, 0.9rem); line-height: 1.4; color: var(--text); }

/* СНОСКИ */
.term { border-bottom: 1px dashed var(--text-muted); cursor: pointer; font-weight: 500; }
.note {
  margin-top: 1.5rem; font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: var(--text-muted); font-style: italic;
  line-height: 1.4; padding-left: 0.8rem; border-left: 2px solid var(--text-dim);
}

/* КНОПКА ТЕМЫ */
.theme-btn {
  position: fixed; top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer;
  transition: color 0.3s, transform 0.3s;
}
.theme-btn:hover { color: var(--text); transform: scale(1.1); }
.theme-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ВОДЯНОЙ ЗНАК */
.watermark {
  position: fixed; bottom: calc(15px + env(safe-area-inset-bottom)); left: calc(20px + env(safe-area-inset-left));
  font-size: 0.65rem; letter-spacing: 0.3em; color: var(--text-muted); opacity: 0.3;
  text-transform: uppercase; z-index: 50; pointer-events: none; font-weight: 600;
}

/* ПОЛОСА ПРОГРЕССА */
.progress-container {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--progress-bg);
  z-index: 100; pointer-events: none;
}
.progress-bar {
  height: 100%; background: var(--progress-fill); width: 0%;
  transition: width 0.3s ease;
}

/* TOOLTIP */
.tooltip {
  position: fixed; background: var(--tooltip-bg); border: 1px solid var(--tooltip-border);
  padding: 10px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--text);
  max-width: 250px; line-height: 1.4; z-index: 9999; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s, visibility 0.2s; pointer-events: none;
}
.tooltip.show { opacity: 1; visibility: visible; transform: translateY(0); }

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 600px) {
  .points { grid-template-columns: 1fr; gap: 0.5rem; }
  .point p { font-size: clamp(0.75rem, 3.5vw, 0.85rem); line-height: 1.35; }
  .title { font-size: clamp(1.3rem, 5.5vw, 1.6rem); margin-bottom: 1rem; }
  .note { font-size: 0.75rem; margin-top: 1rem; }
  .slide { padding-top: calc(12vh + env(safe-area-inset-top)); }
}
</style>
</head>
<body>

<div class="film-grain"></div>
<div class="vignette"></div>

<button class="theme-btn" id="themeBtn" aria-label="Сменить тему">
  <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<div class="watermark">ascet</div>
<div class="tooltip" id="tooltip"></div>

<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<main id="deck"></main>

Введение|Анатомия человека — это фундаментальная наука, изучающая строение тела, его органов и систем. Она рассматривает организм как единое целое, где каждый элемент выполняет строго определённую функцию.|Предмет анатомии неразрывно связан с физиологией: строение органа определяет его функцию, а функциональные потребности влияют на формирование структур.|В современной науке выделяют несколько разделов: систематическую анатомию (по системам), топографическую (по областям), возрастную и сравнительную.|Методология анатомии включает классические методы (препарирование, микроскопия) и современные способы визуализации: рентген, КТ, МРТ и УЗИ.|Анатомия — это фундамент, на котором строится здание медицинских знаний. Без неё невозможно представить ни диагностику, ни хирургию.

Клетка: Строение|Клетка является элементарной структурно-функциональной единицей живого организма, обладающей способностью к самообновлению, обмену веществ и размножению.|Плазматическая мембрана клетки представляет собой липидный бислой с белками, который обеспечивает избирательную проницаемость, рецепцию сигналов и транспорт веществ.|Ядро клетки содержит генетический материал в виде хроматина (ДНК и гистоны), а также ядрышко, отвечающее за синтез рибосомальной РНК.|Цитоплазма включает гиалоплазму и органеллы: митохондрии (энергия), эндоплазматическую сеть (транспорт и синтез), аппарат Гольджи (упаковка) и лизосомы (расщепление).|Клеточный цикл строго регулируется и включает интерфазу (рост и репликация ДНК) и митоз (деление), что лежит в основе роста и регенерации тканей.
Клетка: Органеллы|Митохондрии — это «энергетические станции» клетки, в которых происходит окислительное фосфорилирование и синтез АТФ. Они имеют собственную ДНК.|Эндоплазматическая сеть (ЭПС) бывает гранулярной (с рибосомами, синтез белка) и агранулярной (синтез липидов и детоксикация).|Аппарат Гольджи — это система цистерн, где происходит окончательная упаковка и сортировка белков и липидов, а также формирование лизосом.|Лизосомы содержат гидролитические ферменты, расщепляющие макромолекулы и повреждённые органеллы. Нарушение их работы ведёт к болезням накопления.|Рибосомы — немембранные органеллы, осуществляющие синтез белка по матрице мРНК. Они могут быть свободными или связанными с ЭПС.
Клетка: Деление|Митоз — это деление клетки, при котором образуются две генетически идентичные дочерние клетки. Он обеспечивает рост, регенерацию и обновление тканей.|Мейоз — это деление, приводящее к образованию половых клеток с половинным набором хромосом. Он лежит в основе генетического разнообразия.|Апоптоз — это запрограммированная гибель клетки, необходимая для развития и обновления тканей. Нарушение апоптоза ведёт к опухолям.|Дифференцировка — это процесс приобретения клеткой специализации. Все клетки имеют одинаковый геном, но разные гены активны.|Стволовые клетки — это неспециализированные клетки, способные к самообновлению и превращению в различные типы клеток, что используется в регенеративной медицине.
Ткани: Эпителий|Эпителиальная ткань выстилает поверхности тела и полости внутренних органов, выполняя барьерную, защитную, секреторную и всасывающую функции.|Клетки эпителия плотно прилегают друг к другу, а питание осуществляется диффузно через базальную мембрану. Эпителий не содержит кровеносных сосудов.|Различают однослойный эпителий (всасывание, секреция) и многослойный (защита от механических повреждений).|Железистый эпителий образует железы (потовые, сальные, слюнные), которые выделяют секреты.|Эпителий — это пограничная ткань, которая первой встречает внешние воздействия и защищает внутреннюю среду организма.
Ткани: Соединительная|Соединительная ткань характеризуется значительным развитием межклеточного вещества и выполняет опорную, трофическую, транспортную и защитную функции.|К ней относятся рыхлая и плотная волокнистая ткань (сухожилия, связки), хрящ, кость, а также кровь и лимфа.|Рыхлая соединительная ткань заполняет промежутки между органами, сопровождает сосуды и нервы. Плотная ткань образует сухожилия и связки.|Хрящевая ткань состоит из хондроцитов и плотного матрикса, обеспечивая амортизацию и опору. Костная ткань — это депо минералов и опора тела.|Кровь — это жидкая соединительная ткань, выполняющая транспортную, дыхательную и защитную функции.
Ткани: Мышечная|Мышечная ткань обладает уникальным свойством возбудимости и сократимости, обеспечивая двигательную функцию.|Гладкая мускулатура выстилает стенки внутренних органов (сосуды, кишечник) и сокращается непроизвольно, медленно и длительно.|Поперечно-полосатая скелетная мускулатура обеспечивает произвольные движения, сокращается быстро и сильно. Она управляется соматической нервной системой.|Сердечная мышечная ткань (миокард) состоит из кардиомиоцитов, соединённых вставочными дисками. Она обладает автоматией и сокращается ритмично.|Мышечная ткань — это двигатель тела, без которого невозможно ни движение, ни поддержание позы.
Ткани: Нервная|Нервная ткань состоит из нейронов, генерирующих и проводящих нервные импульсы, и нейроглии, выполняющей опорную, трофическую и защитную функции.|Нейрон имеет тело (сому), дендриты, воспринимающие сигналы, и аксон, передающий импульс. Передача сигнала через синапс осуществляется с помощью нейромедиаторов.|Нейроглия окружает нейроны, обеспечивая их питание, защиту и изоляцию. Олигодендроциты образуют миелиновую оболочку, ускоряющую проведение импульса.|Нервная ткань образует головной и спинной мозг, а также периферические нервы и ганглии.|Нервная ткань — это материя мысли, памяти и управления всеми процессами в организме.
Скелет: Кость|Скелет человека состоит из 206 костей, которые выполняют опорную, защитную, двигательную и метаболическую функции.|Кость как орган состоит из компактного вещества (прочность) и губчатого вещества (амортизация). Снаружи кость покрыта надкостницей, содержащей остеобласты.|Внутри кости находится костномозговая полость, где расположен красный костный мозг (кроветворение) или жёлтый (депо жира).|Кости содержат 99% кальция организма, участвуя в минеральном обмене. Они перестраиваются в течение всей жизни под влиянием нагрузок и гормонов.|Кость — это живой орган, а не просто «каркас». Она имеет сосуды, нервы и постоянно обновляется.
Скелет: Развитие|Кости развиваются из мезенхимы двумя путями: эндесмальным (на месте соединительной ткани) и эндохондральным (замещение хряща).|Рост костей в длину происходит за счёт эпифизарных пластинок (зон роста), а в толщину — за счёт надкостницы.|С возрастом соотношение органических и минеральных веществ меняется: у детей кости более гибкие, у пожилых — более хрупкие.|Остеопороз — это снижение плотности костей, ведущее к переломам. Профилактика включает движение, кальций и витамин D.|Знание развития костей важно для педиатрии и геронтологии, а также для понимания процессов регенерации при переломах.
Скелет: Соединения|Соединения костей делятся на непрерывные (синартрозы), полупрерывные (симфизы) и прерывные (диартрозы, или суставы).|Непрерывные соединения (швы черепа, синхондрозы) прочны, но малоподвижны. Симфизы (межпозвоночные диски, лобковый симфиз) имеют хрящевые прослойки и небольшую подвижность.|Суставы (диартрозы) — это прерывные соединения, обеспечивающие максимальную подвижность. Они состоят из суставных поверхностей, капсулы и полости с синовиальной жидкостью.|Суставные поверхности покрыты гиалиновым хрящом, который снижает трение. Стабильность сустава обеспечивается связками и мышечным тонусом.|Подвижность и прочность соединений находятся в обратной зависимости: чем больше подвижность, тем меньше стабильность.
Скелет: Осевой|Осевой скелет включает череп, позвоночник и грудную клетку. Он служит центральной опорой тела и защищает жизненно важные органы.|Череп делится на мозговой (защита мозга) и лицевой (формирование лица) отделы. Кости черепа соединены швами.|Позвоночник состоит из 33-34 позвонков и имеет физиологические изгибы (лордоз и кифоз), которые амортизируют нагрузки при ходьбе.|Грудная клетка образована грудиной, 12 парами рёбер и грудными позвонками. Она защищает сердце и лёгкие и участвует в дыхании.|Осевой скелет — это ось тела, вокруг которой организованы все остальные структуры.
Скелет: Добавочный|Добавочный скелет включает пояса верхних и нижних конечностей, а также свободные конечности.|Пояс верхней конечности состоит из ключицы и лопатки, обеспечивая подвижность руки. Свободная верхняя конечность включает плечевую кость, кости предплечья и кисти.|Пояс нижней конечности образован тазовыми костями, которые соединяются с крестцом. Свободная нижняя конечность включает бедренную кость, кости голени и стопы.|Таз у женщин шире и короче, чем у мужчин, что связано с детородной функцией. Стопа имеет своды для амортизации.|Добавочный скелет обеспечивает движение и взаимодействие с окружающей средой.
Мышцы: Строение|Скелетная мышца состоит из мышечных волокон, объединённых в пучки. Структурно-функциональной единицей сокращения является саркомер, содержащий актин и миозин.|Сокращение мышцы происходит под действием нервного импульса, который вызывает выброс ацетилхолина, деполяризацию мембраны и выход кальция.|Кальций запускает скольжение актиновых нитей вдоль миозиновых, что требует энергии АТФ. Мышца укорачивается и развивает силу.|Мышцы прикрепляются к костям через сухожилия, которые передают усилие. Иннервация и кровоснабжение обеспечивают их работу.|Мышцы составляют около 40% массы тела и выполняют не только двигательную, но и терморегуляторную функцию.
Мышцы: Работа|Мышцы работают по принципу рычага. Различают преодолевающую, уступающую и удерживающую работу.|Согласованная деятельность мышц-синергистов (выполняющих одно движение) и антагонистов (противоположное) обеспечивает плавность и точность движений.|При интенсивной работе в мышцах накапливаются продукты обмена (молочная кислота), что приводит к утомлению. Отдых восстанавливает работоспособность.|Тренировка вызывает гипертрофию мышц (увеличение объёма и силы), а гиподинамия — атрофию (уменьшение).|Мышцы — это активная часть опорно-двигательного аппарата, без которой невозможно ни движение, ни поддержание позы.
Мышцы: Голова и шея|Мимические мышцы прикрепляются к коже и обеспечивают выражение эмоций. Они иннервируются лицевым нервом.|Жевательные мышцы обеспечивают движение нижней челюсти. Они иннервируются тройничным нервом.|Мышцы шеи делятся на поверхностные и глубокие. Они обеспечивают движение головы, участвуют в глотании и речи.|Грудино-ключично-сосцевидная мышца наклоняет голову в сторону и запрокидывает назад.|Мышцы головы и шеи — это не только движение, но и общение через мимику.
Мышцы: Туловище|Мышцы спины включают поверхностные (трапециевидная, широчайшая) и глубокие (разгибатели позвоночника). Они обеспечивают движение и осанку.|Мышцы груди (большая и малая грудные, передняя зубчатая) обеспечивают движение плечевого пояса и дыхание.|Диафрагма — главная дыхательная мышца, разделяющая грудную и брюшную полости. Она иннервируется диафрагмальным нервом.|Мышцы живота (прямая, косые, поперечная) формируют брюшной пресс, поддерживают органы и участвуют в выдохе.|Мышцы туловища — это корсет тела, обеспечивающий осанку и защиту внутренних органов.
Мышцы: Верхняя конечность|Мышцы плеча делятся на переднюю (сгибатели) и заднюю (разгибатели) группы. Двуглавая мышца сгибает предплечье, трёхглавая — разгибает.|Мышцы предплечья обеспечивают движения кисти и пальцев. Они делятся на сгибатели и разгибатели.|Мышцы кисти включают мышцы возвышения большого пальца (тенар), возвышения мизинца (гипотенар) и среднюю группу (червеобразные, межкостные).|Тонкая моторика кисти обеспечивается согласованной работой многих мышц под контролем коры головного мозга.|Верхняя конечность — это орган труда и познания, и её мышцы отличаются высокой точностью движений.
Мышцы: Нижняя конечность|Мышцы таза включают ягодичные (большая, средняя, малая) и подвздошно-поясничную. Большая ягодичная разгибает бедро и удерживает тело вертикально.|Мышцы бедра делятся на переднюю (четырёхглавая), заднюю (двуглавая, полусухожильная, полуперепончатая) и медиальную (приводящие) группы.|Четырёхглавая мышца бедра — самая крупная мышца тела, разгибает голень. Трёхглавая мышца голени (икра) сгибает стопу.|Мышцы голени и стопы обеспечивают движение и амортизацию при ходьбе и беге. Ахиллово сухожилие — самое мощное в теле.|Нижняя конечность — это опора и движение, и её мышцы несут основную нагрузку при прямохождении.
ССС: Сердце|Сердце — это полый четырёхкамерный мышечный орган, расположенный в грудной полости. Оно выполняет функцию насоса, обеспечивая непрерывный ток крови.|Стенка сердца состоит из эндокарда, миокарда и эпикарда. Снаружи сердце окружено перикардом, содержащим жидкость для уменьшения трения.|Камеры сердца разделены перегородками и сообщаются через клапаны: трёхстворчатый, митральный, аортальный и лёгочный.|Проводящая система сердца включает синоатриальный узел, атриовентрикулярный узел, пучок Гиса и волокна Пуркинье. Она обеспечивает автоматию.|Сердечный цикл включает систолу (сокращение) и диастолу (расслабление). За минуту сердце перекачивает около 5 литров крови.
ССС: Сосуды|Сосудистая система состоит из артерий (несут кровь от сердца), вен (к сердцу) и микроциркуляторного русла (капилляры).|Стенка артерий имеет три оболочки: внутреннюю (эндотелий), среднюю (гладкие мышцы и эластин) и наружную (соединительная ткань).|Вены имеют более тонкую стенку и клапаны, препятствующие обратному току крови. Капилляры состоят из одного слоя клеток для обмена веществ.|Кровоснабжение органов регулируется за счёт изменения тонуса сосудов (вазоконстрикция и вазодилатация).|Лимфатическая система возвращает тканевую жидкость в кровь и участвует в иммунитете.
ССС: Круги кровообращения|Большой круг начинается в левом желудочке, проходит через все органы и заканчивается в правом предсердии. Он обеспечивает органы кислородом и питательными веществами.|Малый (лёгочный) круг начинается в правом желудочке, проходит через лёгкие и заканчивается в левом предсердии. В нём кровь обогащается кислородом.|Круги кровообращения связаны через сердце и функционируют одновременно. Нарушение в одном из них приводит к общим расстройствам.|Артериальная кровь в большом круге насыщена кислородом и имеет ярко-красный цвет, а венозная — тёмный цвет и содержит продукты обмена.|Открытие кругов кровообращения принадлежит Уильяму Гарвею (1628 г.), что стало поворотным моментом в медицине.
ССС: Кровь|Кровь — это жидкая соединительная ткань, состоящая из плазмы (55%) и форменных элементов (45%). Она выполняет транспортную, дыхательную, защитную и терморегуляторную функции.|Эритроциты содержат гемоглобин, который связывает кислород и переносит его к тканям. Они живут около 120 дней.|Лейкоциты обеспечивают иммунную защиту: гранулоциты участвуют в фагоцитозе, а агранулоциты — в специфическом иммунитете.|Тромбоциты играют ключевую роль в свёртывании крови, предотвращая кровопотерю.|Группы крови системы ABO и резус-фактор учитываются при переливании, так как несовместимость может быть смертельной.
ССС: Регуляция|Регуляция кровообращения осуществляется нервной системой (симпатическая и парасимпатическая) и гуморальными факторами (гормоны, ионы).|Симпатическая система учащает и усиливает сердечные сокращения, сужает сосуды и повышает давление. Парасимпатическая — замедляет.|Барорецепторы в сосудах реагируют на изменение давления и посылают сигналы в продолговатый мозг, который регулирует тонус сосудов.|Почечная регуляция (ренин-ангиотензиновая система) играет ключевую роль в поддержании артериального давления.|Нарушение регуляции ведёт к гипертонии или гипотонии, что требует медицинского вмешательства.
Дыхание: Пути|Дыхательная система обеспечивает газообмен между организмом и внешней средой. Она делится на воздухоносные пути и лёгкие.|Верхние дыхательные пути включают носовую полость (согревание и очищение воздуха), глотку и гортань (голосообразование).|Нижние дыхательные пути включают трахею (трубка из хрящевых полуколец) и бронхи, которые ветвятся на бронхиолы.|Бронхиолы заканчиваются альвеолами — микроскопическими пузырьками, где происходит газообмен.|Слизистая оболочка дыхательных путей выстлана ресничным эпителием, который удаляет пыль и микроорганизмы.
Дыхание: Лёгкие|Лёгкие — это парный орган, покрытый плеврой. Правое лёгкое имеет три доли, а левое — две, что связано с расположением сердца.|Альвеолы — это структурные единицы лёгких, где происходит газообмен. Их стенки оплетены капиллярами и покрыты сурфактантом.|Плевра состоит из двух листков: висцерального (покрывает лёгкое) и париетального (выстилает грудную полость). Между ними находится плевральная полость с жидкостью.|Общая площадь альвеол составляет около 70-80 квадратных метров, что обеспечивает эффективный газообмен.|Лёгкие — это не только орган дыхания, но и важный фильтр для крови.
Дыхание: Механизм|Дыхание осуществляется благодаря работе дыхательных мышц: диафрагмы и межрёберных мышц. При вдохе они увеличивают объём грудной клетки.|Давление в лёгких понижается, и воздух засасывается в альвеолы. При выдохе мышцы расслабляются, и воздух выталкивается наружу.|Различают дыхательный объём (500 мл), резервный объём вдоха и выдоха, остаточный объём и жизненную ёмкость лёгких.|Дыхательный центр в продолговатом мозге автоматически регулирует частоту и глубину дыхания, реагируя на уровень углекислого газа в крови.|Газообмен в лёгких происходит по градиенту концентрации: кислород переходит в кровь, а углекислый газ — в альвеолы.
Пищеварение: ЖКТ|Пищеварительная система обеспечивает механическую и химическую переработку пищи, всасывание питательных веществ и выведение остатков.|В полости рта пища измельчается зубами и обрабатывается слюной (амилаза). Затем она проходит через глотку и пищевод в желудок.|Желудок выделяет соляную кислоту и ферменты (пепсин), которые расщепляют белки. Пища превращается в химус и порциями поступает в тонкую кишку.|Тонкая кишка (5-6 метров) — это главный орган всасывания. Её слизистая имеет ворсинки, увеличивающие площадь всасывания.|Толстая кишка всасывает воду и электролиты, формирует кал и содержит микрофлору, синтезирующую витамины.
Пищеварение: Железы|Печень — это крупнейшая железа тела (1,5 кг). Она вырабатывает желчь, обезвреживает токсины, участвует в обмене веществ и запасает гликоген.|Желчь накапливается в желчном пузыре и выделяется в двенадцатиперстную кишку для эмульгирования жиров.|Поджелудочная железа выделяет панкреатический сок, содержащий ферменты для расщепления белков, жиров и углеводов.|В островках Лангерганса поджелудочной железы вырабатываются гормоны инсулин и глюкагон, регулирующие уровень сахара в крови.|Нарушение работы этих желёз приводит к серьёзным заболеваниям: гепатиту, панкреатиту, диабету.
Нервная: Основы|Нервная система регулирует и координирует деятельность всех органов, обеспечивая связь организма с внешней средой.|Центральная нервная система (ЦНС) включает головной и спинной мозг. Периферическая (ПНС) — нервы и ганглии.|Нейрон — это структурная единица нервной системы. Он состоит из тела, дендритов (принимают сигналы) и аксона (передаёт импульс).|Передача сигнала через синапс осуществляется с помощью нейромедиаторов (ацетилхолин, дофамин, серотонин).|Нервная система делится на соматическую (произвольные движения) и вегетативную (регуляция внутренних органов).
Нервная: Спинной мозг|Спинной мозг расположен в позвоночном канале и имеет вид тяжа длиной около 45 см. Он состоит из серого вещества (тела нейронов) и белого вещества (проводящие пути).|Серое вещество имеет форму бабочки и содержит передние рога (двигательные нейроны), задние рога (чувствительные) и боковые рога (вегетативные).|Спинной мозг выполняет рефлекторную функцию (осуществляет простые рефлексы) и проводниковую (передаёт сигналы от органов в мозг и обратно).|Повреждение спинного мозга приводит к параличам, потере чувствительности и нарушению работы внутренних органов.|Спинной мозг окружён тремя оболочками и омывается спинномозговой жидкостью.
Нервная: Головной мозг|Головной мозг — это высший отдел нервной системы. Он состоит из ствола, мозжечка и больших полушарий.|Продолговатый мозг содержит центры дыхания, кровообращения и пищеварения. Повреждение этого отдела смертельно опасно.|Мост связывает ствол с мозжечком. Средний мозг участвует в регуляции тонуса мышц и ориентировочных рефлексах.|Мозжечок обеспечивает координацию движений и равновесие. Промежуточный мозг (таламус и гипоталамус) регулирует обмен веществ, температуру тела и эндокринные функции.|Кора больших полушарий — это высший отдел мозга, обеспечивающий сознание, мышление, память и речь.
Нервная: Кора|Кора больших полушарий имеет толщину 2-4 мм и содержит около 14 миллиардов нейронов. Она имеет борозды и извилины, увеличивающие её площадь.|Выделяют четыре доли: лобную (движение, речь, планирование), теменную (чувствительность), височную (слух, память) и затылочную (зрение).|В коре расположены центры речи (Брока и Вернике), анализаторы, центры памяти и мышления.|Площадь коры больших полушарий составляет около 2200 квадратных сантиметров.|Кора обеспечивает высшую нервную деятельность и адаптацию к окружающей среде.
Нервная: Вегетативная|Вегетативная (автономная) нервная система регулирует деятельность внутренних органов, желез и гладких мышц. Она делится на симпатическую и парасимпатическую части.|Симпатическая система активизируется при стрессе (режим «бей или беги»): учащает пульс, расширяет зрачки, повышает давление.|Парасимпатическая система активизируется в покое: замедляет пульс, снижает давление, стимулирует пищеварение.|Центры вегетативной системы расположены в гипоталамусе, стволе мозга и спинном мозге.|Нарушение вегетативной регуляции приводит к дисфункциям внутренних органов.
Эндокринная: Гипофиз|Гипофиз — это главная железа внутренней секреции, расположенная у основания головного мозга. Он состоит из передней (аденогипофиз) и задней (нейрогипофиз) долей.|Передняя доля вырабатывает соматотропин (гормон роста), тиреотропин (ТТГ), адренокортикотропин (АКТГ), пролактин и гонадотропины.|Задняя доля выделяет окситоцин (стимулирует роды и лактацию) и вазопрессин (регулирует водный баланс).|Гипофиз связан с гипоталамусом, который контролирует его деятельность. Нарушение функций гипофиза приводит к гигантизму, карликовости или акромегалии.|Гипофиз называют «дирижёром эндокринного оркестра», так как он контролирует работу других желез.
Эндокринная: Щитовидная|Щитовидная железа расположена на передней поверхности шеи и состоит из двух долей и перешейка.|Она вырабатывает гормоны тироксин (Т4) и трийодтиронин (Т3), регулирующие обмен веществ, рост и развитие.|Недостаток этих гормонов приводит к гипотиреозу (микседема у взрослых, кретинизм у детей), избыток — к тиреотоксикозу.|Паращитовидные железы расположены на задней поверхности щитовидной железы и вырабатывают паратгормон, регулирующий уровень кальция и фосфора в крови.|Для синтеза гормонов щитовидной железы необходим йод, который поступает с пищей и водой.
Эндокринная: Надпочечники|Надпочечники — это парные железы, расположенные над почками. Они состоят из коркового и мозгового вещества.|Корковое вещество вырабатывает кортизол (регулирует обмен веществ и стресс), альдостерон (регулирует водно-солевой баланс) и андрогены.|Мозговое вещество вырабатывает адреналин и норадреналин, которые мобилизуют организм при стрессе.|Недостаток кортизола вызывает болезнь Аддисона, избыток — синдром Иценко-Кушинга.|Гормоны надпочечников участвуют в адаптации к стрессу, регуляции давления и иммунитета.
Иммунная: Органы|Центральные органы иммунной системы: красный костный мозг (где образуются все клетки крови) и тимус (где созревают Т-лимфоциты).|Периферические органы: селезёнка, лимфатические узлы, миндалины, аппендикс, лимфоидные фолликулы кишечника.|Селезёнка фильтрует кровь и участвует в иммунном ответе, разрушая старые эритроциты.|Лимфатические узлы фильтруют лимфу и являются местом размножения лимфоцитов.|Тимус наиболее активен в детском возрасте, с годами он замещается жировой тканью.
Иммунная: Механизмы|Врождённый иммунитет — это неспецифическая защита, действующая против любых чужеродных агентов. Он включает барьеры (кожа, слизистые), фагоцитоз и воспаление.|Приобретённый иммунитет — специфическая защита против конкретного антигена. Он делится на гуморальный (выработка антител В-лимфоцитами) и клеточный (уничтожение поражённых клеток Т-лимфоцитами).|Активный иммунитет возникает после перенесённой болезни или вакцинации. Пассивный передаётся от матери ребёнку через плаценту или с грудным молоком.|Вакцинация — самый эффективный способ создания активного приобретённого иммунитета.|Аллергия — это чрезмерная иммунная реакция на безвредные вещества, а аутоиммунные заболевания возникают, когда иммунная система атакует собственные ткани.
Кожа: Строение|Кожа — это наружный покров тела, состоящий из эпидермиса, дермы и гиподермы.|Эпидермис — это многослойный плоский эпителий, постоянно обновляющийся. Он содержит кератиноциты и меланоциты.|Дерма содержит коллагеновые и эластиновые волокна, сосуды, нервы, волосяные фолликулы, потовые и сальные железы.|Гиподерма — это подкожная жировая клетчатка, выполняющая защитную и терморегуляторную функции.|Кожа — самый крупный орган тела, её площадь у взрослого человека составляет 1,5-2 кв. метра.
Кожа: Функции|Кожа выполняет защитную функцию, предохраняя организм от механических повреждений, ультрафиолета и микроорганизмов.|Кожа участвует в терморегуляции: расширение сосудов и потоотделение охлаждают тело, а сужение сосудов сохраняет тепло.|Кожа — это орган осязания, содержащий рецепторы давления, температуры и боли.|В коже синтезируется витамин D под действием ультрафиолета.|Производные кожи: волосы, ногти, молочные, потовые и сальные железы.
Обмен веществ|Обмен веществ (метаболизм) — это совокупность химических реакций в организме, обеспечивающих его рост, развитие и жизнедеятельность.|Анаболизм — это синтез сложных веществ из простых (рост, накопление энергии). Катаболизм — расщепление сложных веществ на простые (выделение энергии).|Энергия запасается в молекулах АТФ. Основной обмен — это минимальное количество энергии для поддержания жизни в покое.|Белки, жиры и углеводы являются основными питательными веществами. Витамины и минералы — регуляторы обмена.|Нарушение обмена веществ ведёт к ожирению, диабету, атеросклерозу и другим заболеваниям.
Регионарная: Голова|Голова является центром управления и сенсорного восприятия. Она делится на мозговой отдел, защищающий головной мозг, и лицевой отдел, формирующий архитектуру лица.|Мозговой череп состоит из лобной, теменных, затылочной, височных, клиновидной и решётчатой костей. Кости соединены швами, которые с возрастом окостеневают.|Лицевой отдел включает верхнюю и нижнюю челюсти, скуловые, носовые, слёзные и нёбные кости. Нижняя челюсть — единственная подвижная кость черепа.|Мышцы головы делятся на мимические (прикрепляются к коже, обеспечивают эмоции) и жевательные (двигают нижнюю челюсть).|Кровоснабжение головы осуществляется ветвями наружной и внутренней сонных артерий, а иннервация — черепными нервами.
Регионарная: Шея|Шея соединяет голову с туловищем и является зоной прохождения жизненно важных сосудов, нервов и дыхательных путей.|В ней выделяют переднюю, заднюю и боковые области. В передней проходят гортань, трахея, щитовидная железа и сонные артерии.|Мышцы шеи делятся на поверхностные (подкожная, грудино-ключично-сосцевидная) и глубокие (лестничные, длинные). Они обеспечивают движение головы и участвуют в дыхании.|Треугольники шеи (поднижнечелюстной, сонный, лопаточно-трахеальный) служат хирургическими ориентирами для доступа к сосудам и органам.|Повреждение крупных сосудов или нервов шеи может быть смертельным, поэтому она считается зоной повышенной хирургической опасности.
Регионарная: Грудь|Грудь является вместилищем сердца и лёгких, защищённым грудной клеткой (грудина и 12 пар рёбер).|В грудной полости выделяют средостение, где расположены сердце, крупные сосуды, трахея, пищевод и тимус.|Плевра выстилает лёгкие и грудную полость изнутри, образуя плевральную полость с отрицательным давлением, необходимым для дыхания.|Молочные железы, расположенные на передней грудной стенке, являются видоизменёнными потовыми железами и функционируют под контролем гормонов.|Диафрагма, куполообразная мышца, отделяет грудную полость от брюшной и является главной дыхательной мышцей.
Регионарная: Живот|Живот — это область, в которой расположены органы пищеварения, мочевыделения и эндокринные железы.|Брюшная полость выстлана брюшиной, которая образует серозный покров для органов и формирует связки, брыжейки и сальники.|Живот условно делится на три отдела (эпигастрий, мезогастрий, гипогастрий) и боковые области, что важно для клинической диагностики.|В брюшной полости расположены печень (правое подреберье), желудок (левое подреберье), тонкая и толстая кишка, поджелудочная железа и почки (забрюшинно).|Слабость мышц живота может привести к грыжам, а повреждение органов брюшной полости требует немедленной хирургической помощи.
Регионарная: Таз|Таз соединяет туловище с нижними конечностями и служит костным кольцом для опоры и защиты внутренних органов.|Тазовые кости (подвздошная, седалищная, лобковая) срастаются, образуя вертлужную впадину для головки бедра.|В малом тазу расположены мочевой пузырь, прямая кишка и внутренние половые органы. У женщин таз шире и имеет более округлую форму для деторождения.|Дно таза образовано мышцами тазового дна (леватор ани и копчиковая мышца), которые поддерживают органы и контролируют мочеиспускание и дефекацию.|Промежность — это область между задним проходом и наружными половыми органами, богатая сосудами и нервами.
Нервная: Спинной мозг|Спинной мозг — это часть ЦНС, расположенная в позвоночном канале. Он имеет сегментарное строение (31 сегмент) и выполняет рефлекторную и проводниковую функции.|Серое вещество спинного мозга имеет форму бабочки и содержит двигательные (передние рога) и чувствительные (задние рога) нейроны.|Белое вещество образовано проводящими путями (трактами), которые связывают спинной мозг с головным и передают сигналы в обоих направлениях.|В спинном мозге замыкаются простые рефлексы (коленный, мочеиспускательный), а также проходят пути болевой и температурной чувствительности.|Повреждение спинного мозга выше шейного утолщения приводит к тетраплегии (параличу всех конечностей), а ниже — к параплегии (параличу ног).
Нервная: Ствол мозга|Ствол мозга включает продолговатый мозг, мост и средний мозг. Он соединяет спинной мозг с передним мозгом и содержит ядра черепных нервов.|Продолговатый мозг — это жизненно важный центр, регулирующий дыхание, сердечную деятельность и сосудистый тонус.|Мост содержит проводящие пути и ядра, участвующие в слуховой и вестибулярной функциях, а также в регуляции сна.|Средний мозг отвечает за ориентировочные рефлексы, тонус мышц и движения глаз. В нём расположены красное ядро и чёрная субстанция.|Ствол мозга также содержит ретикулярную формацию, которая регулирует уровень бодрствования и сознания.
Нервная: Мозжечок|Мозжечок расположен позади ствола мозга и состоит из двух полушарий и червя, соединённых с другими отделами ножками.|Его кора имеет складчатое строение, что увеличивает площадь поверхности и количество нейронов.|Мозжечок обеспечивает координацию произвольных движений, поддержание равновесия и мышечного тонуса.|Он также участвует в обучении двигательным навыкам (например, езда на велосипеде или игра на музыкальном инструменте).|Повреждение мозжечка приводит к атаксии (нарушению координации), шаткости походки и нистагму (непроизвольным движениям глаз).
Нервная: Кора|Кора больших полушарий — это высший отдел ЦНС, отвечающий за сознание, мышление, память, речь и сложные формы поведения.|Она состоит из шести слоёв клеток и имеет борозды (углубления) и извилины (складки), которые значительно увеличивают её площадь (около 2200 кв. см).|В коре выделяют проекционные зоны (моторная, соматосенсорная, зрительная, слуховая) и ассоциативные зоны, отвечающие за интеграцию информации.|Речевые центры (Брока — моторный, Вернике — сенсорный) обычно расположены в левом полушарии, которое доминирует у правшей.|Кора обладает пластичностью: при повреждении одних участков другие могут брать на себя их функции, особенно у детей.
Нервная: Черепные нервы|От ствола головного мозга отходят 12 пар черепных нервов, которые иннервируют голову, шею и внутренние органы.|Обонятельный (I), зрительный (II) и слуховой (VIII) нервы являются сенсорными; глазодвигательный (III), блоковый (IV), отводящий (VI), лицевой (VII), языкоглоточный (IX), добавочный (XI) и подъязычный (XII) — двигательными; а тройничный (V), промежуточный (VII) и блуждающий (X) — смешанными.|Блуждающий нерв (X) — самый длинный, он иннервирует сердце, лёгкие и органы брюшной полости, обеспечивая парасимпатическую регуляцию.|Тройничный нерв (V) отвечает за чувствительность лица и работу жевательных мышц; его воспаление вызывает сильную боль (тригеминальная невралгия).|Повреждение лицевого нерва (VII) приводит к параличу мимических мышц (асимметрия лица), а подъязычного (XII) — к нарушению речи и глотания.
Сердце: Анатомия|Сердце расположено в грудной полости позади грудины, в средостении, и окружено перикардом.|Оно имеет четыре камеры: правое предсердие, правый желудочек, левое предсердие и левый желудочек.|Стенка сердца состоит из трёх слоёв: эндокарда (внутренний), миокарда (мышечный) и эпикарда (наружный).|Миокард левого желудочка толще, так как он выбрасывает кровь в большой круг кровообращения с большим сопротивлением.|Клапанный аппарат сердца (трёхстворчатый, митральный, аортальный, лёгочный) обеспечивает односторонний ток крови.
Сердце: Проводящая|Проводящая система сердца состоит из атипичных мышечных волокон, которые генерируют и проводят электрические импульсы.|Синоатриальный узел (водитель ритма) расположен в правом предсердии и задаёт нормальный ритм (60-80 уд/мин).|Атриовентрикулярный узел задерживает импульс, чтобы предсердия успели сократиться до желудочков.|Пучок Гиса и его ножки проводят импульс к желудочкам, а волокна Пуркинье распределяют его по миокарду.|Нарушение проводимости приводит к аритмиям, блокадам сердца и требует установки искусственного водителя ритма.
Сердце: Цикл|Сердечный цикл состоит из систолы (сокращения) и диастолы (расслабления). В покое он длится около 0,8 секунды.|Во время систолы предсердий кровь поступает в желудочки; во время систолы желудочков кровь выбрасывается в аорту и лёгочную артерию.|Диастола — это период расслабления, когда камеры наполняются кровью и коронарные сосуды снабжают миокард кислородом.|Тоны сердца (I и II) возникают при захлопывании клапанов и являются важным диагностическим признаком.|Регуляция сердечного цикла осуществляется вегетативной нервной системой: симпатическая учащает ритм, парасимпатическая — замедляет.
Сосуды: Типы|Артерии несут кровь от сердца; их стенка состоит из эндотелия, гладких мышц и эластических волокон, что позволяет выдерживать высокое давление.|Вены несут кровь к сердцу; они имеют клапаны и более тонкую стенку, а их тонус зависит от скелетных мышц.|Капилляры — это микроскопические сосуды, состоящие из одного слоя эндотелиальных клеток, через которые происходит обмен веществ между кровью и тканями.|Артериолы и венулы регулируют кровоснабжение органов путём сужения и расширения просвета.|Лимфатические сосуды собирают избыток тканевой жидкости и возвращают её в кровеносное русло, а также транспортируют лимфоциты.
Кровь: Форменные|Эритроциты (красные кровяные клетки) содержат гемоглобин, который переносит кислород от лёгких к тканям и углекислый газ обратно.|Лейкоциты (белые кровяные клетки) обеспечивают иммунную защиту: нейтрофилы фагоцитируют бактерии, лимфоциты вырабатывают антитела, эозинофилы борются с паразитами.|Тромбоциты (кровяные пластинки) участвуют в гемостазе: они прилипают к повреждённой стенке сосуда и запускают каскад свёртывания крови.|Плазма крови содержит воду (90%), белки (альбумины, глобулины, фибриноген), соли и глюкозу.|Группы крови (ABO и Rh) учитываются при переливании, чтобы избежать иммунной реакции и гемолиза.
Дыхание: Газообмен|Газообмен в лёгких происходит в альвеолах, где кислород из воздуха переходит в кровь, а углекислый газ из крови — в альвеолы.|Этот процесс основан на разнице парциальных давлений (градиенте концентрации) и происходит путём простой диффузии.|Гемоглобин эритроцитов связывает кислород в лёгких, образуя оксигемоглобин, и отдаёт его тканям, где концентрация кислорода ниже.|Углекислый газ транспортируется в основном в виде бикарбоната (70%), а также в соединении с гемоглобином (23%) и в растворённом виде (7%).|Эффективность газообмена зависит от площади альвеол (70-80 м²), толщины мембраны и градиента концентрации.
Дыхание: Регуляция|Дыхательный центр расположен в продолговатом мозге и регулирует частоту и глубину дыхания.|Он получает сигналы от хеморецепторов, которые реагируют на уровень углекислого газа (CO2) и pH крови.|Повышение CO2 в крови стимулирует дыхательный центр, что приводит к учащению дыхания и выведению избытка CO2.|Кора головного мозга может произвольно изменять дыхание (например, при задержке дыхания или пении).|Дыхательные рефлексы (кашель, чихание) защищают дыхательные пути от раздражителей.
Пищеварение: Полость рта|Пищеварение начинается в ротовой полости, где пища измельчается зубами (механическая обработка) и смачивается слюной.|Слюна выделяется тремя парами крупных слюнных желез (околоушные, поднижнечелюстные, подъязычные) и содержит фермент амилазу, расщепляющий углеводы.|Язык перемешивает пищу, формирует пищевой комок и содержит вкусовые рецепторы.|Глотание — это сложный рефлекторный акт, при котором надгортанник закрывает вход в гортань, чтобы пища не попала в дыхательные пути.|Пищевод — это мышечная трубка, по которой пища продвигается в желудок благодаря перистальтике.
Пищеварение: Желудок|Желудок — это расширенная часть пищеварительного тракта, вмещающая до 2-3 литров пищи. Его стенка имеет три слоя мышц.|Слизистая оболочка желудка содержит железы, выделяющие соляную кислоту и ферменты (пепсин, липаза).|Соляная кислота активирует пепсин, убивает бактерии и денатурирует белки. Для защиты слизистой от кислоты выделяется слизь.|Пища в желудке превращается в химус (полужидкую кашицу) и порциями поступает в двенадцатиперстную кишку.|Регуляция секреции желудочного сока осуществляется нервными импульсами (вагус) и гормонами (гастрин).
Пищеварение: Кишечник|Тонкая кишка (5-6 метров) — это главный орган всасывания питательных веществ. Её слизистая имеет ворсинки, увеличивающие площадь поверхности.|В двенадцатиперстную кишку выделяются желчь (для эмульгирования жиров) и панкреатический сок (для расщепления белков, жиров и углеводов).|Толстая кишка (1,5 метра) всасывает воду и электролиты, формирует кал и содержит микрофлору, синтезирующую витамины (K, B).|Микрофлора кишечника играет важную роль в иммунитете, обмене веществ и защите от патогенов.|Нарушение состава микрофлоры (дисбактериоз) может привести к воспалительным заболеваниям кишечника.
Печень: Функции|Печень — это крупнейшая железа тела (1,5 кг), расположенная в правом подреберье.|Она выполняет более 500 функций: обезвреживание токсинов, синтез белков плазмы, выработка желчи, запасание гликогена и витаминов.|Желчь накапливается в желчном пузыре и выделяется в двенадцатиперстную кишку для эмульгирования жиров.|Печень участвует в обмене холестерина и разрушает старые эритроциты.|Печень обладает уникальной способностью к регенерации — она может восстанавливаться даже после потери 70% ткани.
Почки: Анатомия|Почки — это парные органы бобовидной формы, расположенные забрюшинно в поясничной области.|Они состоят из коркового и мозгового вещества и содержат около миллиона нефронов.|Нефрон — это структурно-функциональная единица почки, состоящая из капсулы Шумлянского-Боумена и канальцев.|В клубочке нефрона происходит фильтрация крови, образуется первичная моча (до 180 литров в сутки).|В канальцах происходит реабсорбция (обратное всасывание) воды, глюкозы, аминокислот и солей, а также секреция некоторых веществ.
Почки: Регуляция|Почки регулируют водно-солевой баланс и кислотно-щелочное равновесие, поддерживая гомеостаз.|Гормон альдостерон (кора надпочечников) задерживает натрий и выводит калий, а вазопрессин (гипофиз) задерживает воду.|Почки вырабатывают ренин (регулирует давление) и эритропоэтин (стимулирует кроветворение).|Моча по мочеточникам поступает в мочевой пузырь, где накапливается до 500 мл, а затем выводится через уретру.|Заболевания почек (пиелонефрит, гломерулонефрит, камни) требуют медицинского вмешательства, так как нарушают гомеостаз.
Эндокринная: Щитовидная|Щитовидная железа расположена на передней поверхности шеи и состоит из двух долей и перешейка.|Она вырабатывает тироксин (Т4) и трийодтиронин (Т3), которые регулируют обмен веществ, рост и развитие.|Недостаток гормонов щитовидной железы вызывает гипотиреоз (у взрослых — микседема, у детей — кретинизм).|Избыток гормонов приводит к тиреотоксикозу (повышенная возбудимость, учащённое сердцебиение, похудение).|Для синтеза гормонов необходим йод, который поступает с пищей и водой.
Эндокринная: Надпочечники|Надпочечники — парные железы, расположенные над почками. Они состоят из коркового и мозгового вещества.|Корковое вещество вырабатывает кортизол (регулирует стресс и обмен веществ), альдостерон (водно-солевой баланс) и андрогены.|Мозговое вещество выделяет адреналин и норадреналин, которые мобилизуют организм при стрессе (учащают пульс, повышают давление).|Недостаток кортизола вызывает болезнь Аддисона (слабость, гипотония, пигментация кожи).|Избыток кортизола приводит к синдрому Иценко-Кушинга (ожирение, гипертония, мышечная слабость).
Иммунная: Вакцинация|Вакцинация — это создание активного приобретённого иммунитета путём введения ослабленного или убитого возбудителя.|В ответ на вакцину организм вырабатывает антитела и формирует иммунную память, которая защищает от болезни при повторном заражении.|Вакцины бывают живыми (ослабленными), инактивированными (убитыми), анатоксинами (обезвреженными токсинами) и др.|Вакцинация — самый эффективный способ профилактики инфекционных заболеваний и снижения смертности.|Массовая вакцинация привела к ликвидации оспы и значительному снижению заболеваемости полиомиелитом, корью и другими инфекциями.
Кожа: Производные|Производные кожи включают волосы, ногти, молочные, потовые и сальные железы.|Волосы состоят из кератина и выполняют защитную и терморегуляторную функции.|Ногти защищают кончики пальцев от механических повреждений.|Потовые железы выделяют пот, который испаряется и охлаждает тело, участвуя в терморегуляции.|Сальные железы выделяют кожное сало, которое смазывает кожу и волосы, защищая их от высыхания и микроорганизмов.
Кожа: Терморегуляция|Кожа играет ключевую роль в терморегуляции, поддерживая постоянную температуру тела (около 37°C).|При перегреве сосуды кожи расширяются, увеличивая теплоотдачу, а потовые железы выделяют пот, испарение которого охлаждает тело.|При переохлаждении сосуды сужаются, уменьшая теплоотдачу, а мышцы сокращаются (дрожь), вырабатывая тепло.|Подкожная жировая клетчатка (гиподерма) является теплоизолятором.|Центр терморегуляции находится в гипоталамусе, который получает сигналы от терморецепторов кожи.
Сенсорные: Зрение|Глаз — это парный орган зрения, расположенный в глазнице. Он состоит из глазного яблока и вспомогательного аппарата (веки, слёзные железы, мышцы).|Стенка глазного яблока имеет три оболочки: фиброзную (склера и роговица), сосудистую (радужка, цилиарное тело, хориоидея) и сетчатку.|Сетчатка содержит фоторецепторы: палочки (воспринимают свет) и колбочки (воспринимают цвет).|Свет проходит через роговицу, зрачок и хрусталик, фокусируясь на сетчатке, где преобразуется в нервный импульс.|Сигнал по зрительному нерву передаётся в зрительную кору затылочной доли, где формируется зрительный образ.
Сенсорные: Слух|Ухо — это орган слуха и равновесия, состоящий из наружного, среднего и внутреннего уха.|Наружное ухо (ушная раковина, слуховой проход) улавливает звуковые волны.|Среднее ухо содержит барабанную перепонку и три слуховые косточки (молоточек, наковальня, стремечко), которые усиливают звук.|Внутреннее ухо включает улитку (орган слуха) и вестибулярный аппарат (орган равновесия).|В улитке волосковые клетки преобразуют звуковые колебания в нервные импульсы, которые передаются в слуховую кору височной доли.
Сенсорные: Обоняние|Обоняние — это восприятие запахов, осуществляемое обонятельными рецепторами, расположенными в верхней части носовой полости.|Рецепторы связывают молекулы пахучих веществ и генерируют нервный импульс.|Сигнал по обонятельному нерву (I пара) передаётся в обонятельную луковицу и далее в кору головного мозга.|Обоняние тесно связано с вкусом и памятью, так как обонятельные пути проходят через лимбическую систему.|Потеря обоняния (аносмия) может быть симптомом инфекции, травмы или neurological diseases.
Сенсорные: Вкус|Вкус — это восприятие химических веществ, растворённых в слюне, вкусовыми почками, расположенными на языке.|Вкусовые почки различают пять основных вкусов: сладкий, солёный, кислый, горький и умами (вкус белка).|Сигнал от вкусовых рецепторов передаётся по черепным нервам (VII, IX, X) в продолговатый мозг и далее в кору.|Вкус тесно связан с обонянием: при насморке вкус пищи кажется менее ярким.|Количество вкусовых почек уменьшается с возрастом, что может снижать аппетит у пожилых людей.
Сенсорные: Осязание|Осязание — это восприятие прикосновения, давления, вибрации, температуры и боли рецепторами кожи.|Кожа содержит различные рецепторы: тельца Мейснера (прикосновение), тельца Пачини (давление), свободные нервные окончания (боль, температура).|Плотность рецепторов неодинакова: на кончиках пальцев и губах она максимальна.|Сигналы от рецепторов кожи передаются по спинномозговым нервам в спинной мозг, затем в таламус и соматосенсорную кору теменной доли.|Осязание играет важную роль в познании мира и социальном взаимодействии.
Лимфатическая: Сосуды|Лимфатическая система — это часть сосудистой системы, которая обеспечивает возврат тканевой жидкости в кровеносное русло и участвует в иммунной защите.|Лимфатические капилляры начинаются слепо в тканях и собираются в более крупные сосуды, которые проходят через лимфатические узлы.|Лимфатические сосуды имеют клапаны, а движение лимфы обеспечивается сокращением скелетных мышц и пульсацией артерий.|Лимфа — это прозрачная жидкость, содержащая лимфоциты и продукты обмена, которая фильтруется в узлах и очищается от чужеродных агентов.|Нарушение лимфооттока приводит к лимфостазу (отекам), а удаление узлов при онкологии может вызвать лимфедему.
Лимфатическая: Узлы|Лимфатические узлы — это периферические органы иммунной системы, расположенные по ходу лимфатических сосудов.|Они имеют бобовидную форму и содержат фолликулы с В-лимфоцитами, а также Т-лимфоциты в паракортикальной зоне.|В узлах происходит фильтрация лимфы, фагоцитоз бактерий и вирусов, а также размножение лимфоцитов при иммунном ответе.|При инфекции узлы увеличиваются (лимфаденопатия) и становятся болезненными при пальпации.|Воспаление узлов (лимфаденит) может быть гнойным и требовать хирургического вмешательства.
Лимфатическая: Селезёнка|Селезёнка — это орган, расположенный в левом подреберье, который выполняет иммунную и кроветворную функции.|В белой пульпе селезёнки созревают лимфоциты и происходит иммунный ответ на антигены, циркулирующие в крови.|В красной пульпе разрушаются старые эритроциты, а также депонируется кровь и железо.|Селезёнка синтезирует антитела и факторы, стимулирующие фагоцитоз.|При травмах селезёнки может возникнуть сильное кровотечение, требующее спленэктомии (удаления органа).
Лимфатическая: Тимус|Тимус (вилочковая железа) — это центральный орган иммунной системы, расположенный за грудиной в верхнем средостении.|В тимусе происходит созревание, дифференцировка и селекция Т-лимфоцитов, которые затем мигрируют в периферические органы.|Тимус наиболее активен в детском возрасте, а с годами он подвергается инволюции и замещается жировой тканью.|Гормоны тимуса (тимозин, тимопоэтин) регулируют пролиферацию и дифференцировку Т-клеток.|Повышенная функция тимуса может вызывать аутоиммунные реакции, а сниженная — иммунодефицит.
Лимфатическая: Миндалины|Миндалины (глоточные, нёбные, язычные, трубные) образуют лимфоидное кольцо Пирогова-Вальдейера вокруг входа в глотку.|Они выполняют защитную функцию, задерживая и обезвреживая микроорганизмы, поступающие с воздухом и пищей.|Воспаление миндалин (тонзиллит) может быть острым (ангина) или хроническим, часто requiring хирургического удаления (тонзиллэктомия).|Гипертрофия глоточной миндалины (аденоиды) у детей может затруднять носовое дыхание и вызывать отиты.|Миндалины являются важным барьером для инфекций верхних дыхательных путей.
Эндокринная: Поджелудочная|Поджелудочная железа — это железа смешанной секреции, расположенная позади желудка.|Её экзокринная часть выделяет пищеварительные ферменты, а эндокринная (островки Лангерганса) вырабатывает гормоны.|Бета-клетки островков вырабатывают инсулин, который снижает уровень глюкозы в крови, способствуя её поглощению тканями.|Альфа-клетки вырабатывают глюкагон, который повышает уровень глюкозы за счёт расщепления гликогена в печени.|Дефицит инсулина приводит к сахарному диабету 1 типа, а его избыток — к гипогликемии.
Эндокринная: Половые железы|Гонады (яички у мужчин и яичники у женщин) выполняют двойную функцию: производство гамет и выработку половых гормонов.|В яичках клетки Лейдига вырабатывают тестостерон, который регулирует сперматогенез и развитие вторичных половых признаков.|В яичниках вырабатываются эстрогены (фолликулярная фаза) и прогестерон (лютеиновая фаза), регулирующие менструальный цикл.|Гормоны гонад также влияют на костную ткань, обмен веществ и психоэмоциональное состояние.|Нарушение выработки половых гормонов приводит к бесплодию и эндокринным расстройствам.
Эндокринная: Эпифиз|Эпифиз (шишковидная железа) — это небольшой орган, расположенный в промежуточном мозге.|Он вырабатывает гормон мелатонин, который регулирует циркадные ритмы (сон-бодрствование).|Свет стимулирует сетчатку, которая через супрахиазматическое ядро и симпатическую нервную систему подавляет синтез мелатонина днём.|Мелатонин также участвует в регуляции репродуктивной функции, иммунитета и антиоксидантной защиты.|Нарушение выработки мелатонина связано с бессонницей и сезонными аффективными расстройствами.
Эндокринная: Тимус|Тимус является одновременно органом иммунной системы и эндокринной железой, вырабатывающей гормоны (тимозин, тимопоэтин).|Эти гормоны регулируют созревание Т-лимфоцитов и их дифференцировку в различные субпопуляции (хелперы, киллеры).|Тимус также влияет на обмен веществ и рост организма.|Инволюция тимуса с возрастом связана со снижением иммунной защиты и повышением риска аутоиммунных заболеваний.|Тимус играет ключевую роль в формировании центральной толерантности к собственным антигенам.
Мужская: Яички|Яички — это парные половые железы, расположенные в мошонке, где температура на 2-3 градуса ниже температуры тела.|В извитых семенных канальцах происходит сперматогенез — образование сперматозоидов из сперматогониев путём мейоза.|В интерстициальной ткани (клетки Лейдига) вырабатывается тестостерон, который стимулирует сперматогенез и развитие вторичных половых признаков.|Яички также вырабатывают ингибин, который угнетает секрецию ФСГ в гипофизе по принципу обратной связи.|Нарушение сперматогенеза (например, при перегреве или инфекции) может привести к бесплодию.
Мужская: Протоки|Сперматозоиды из яичка проходят через придаток яичка, где они созревают и приобретают подвижность.|Затем они поступают в семявыносящий проток, который соединяется с протоком семенного пузырька, образуя семявыбрасывающий проток.|Семенные пузырьки выделяют секрет, богатый фруктозой, который является источником энергии для сперматозоидов.|Предстательная железа (простата) выделяет щелочной секрет, который нейтрализует кислую среду влагалища и поддерживает подвижность спермы.|Совокупность сперматозоидов и секретов желёз называется спермой (семенной жидкостью).
Мужская: Простата|Предстательная железа — это непарный железисто-мышечный орган, расположенный под мочевым пузырём.|Она окружает начальную часть мочеиспускательного канала и выделяет секрет, который является частью спермы.|Простата регулируется тестостероном и его производными, а её гиперплазия (аденома) часто возникает у пожилых мужчин.|Аденома простаты сдавливает мочеиспускательный канал и нарушает мочеиспускание.|Рак простаты — одно из самых распространённых онкологических заболеваний у мужчин, требующее ранней диагностики.
Мужская: Мошонка|Мошонка — это кожно-мышечное образование, в котором располагаются яички и их придатки.|Она выполняет терморегуляторную функцию: при повышении температуры мышцы расслабляются и яички опускаются, а при понижении — поднимаются.|Мошонка также защищает яички от механических повреждений.|Иннервация мошонки осуществляется из поясничного и крестцового сплетений, а кровоснабжение — из ветвей бедренной артерии.|Заболевания мошонки (варикоцеле, гидроцеле) могут влиять на фертильность.
Мужская: Сперматогенез|Сперматогенез — это процесс образования сперматозоидов, который происходит в извитых семенных канальцах яичка.|Он включает три стадии: митоз (размножение сперматогониев), мейоз (образование сперматоцитов) и спермиогенез (формирование зрелых сперматозоидов).|Процесс занимает около 74 дней и регулируется гормонами гипофиза (ФСГ, ЛГ) и тестостероном.|Сперматозоид состоит из головки (с ядром и акросомой), шейки (с митохондриями) и хвоста (для движения).|Подвижность и морфология сперматозоидов являются важными показателями мужской фертильности.
Женская: Яичники|Яичники — это парные половые железы, расположенные в малом тазу, которые вырабатывают яйцеклетки и гормоны.|В корковом веществе яичника находятся фолликулы на разных стадиях развития.|Овуляция — это выход зрелой яйцеклетки из фолликула в брюшную полость, откуда она попадает в маточную трубу.|Жёлтое тело, образующееся после овуляции, вырабатывает прогестерон, который готовит матку к беременности.|Нарушение овуляции (ановуляция) является одной из частых причин бесплодия у женщин.
Женская: Матка|Матка — это полый мышечный орган, расположенный в малом тазу между мочевым пузырём и прямой кишкой.|Она состоит из тела, шейки и дна, а её стенка имеет три слоя: эндометрий, миометрий и периметрий.|Эндометрий циклически обновляется и является местом имплантации оплодотворённой яйцеклетки.|Миометрий обеспечивает сокращения при родах и менструации.|Шейка матки содержит железы, вырабатывающие слизь, которая защищает от инфекций и регулирует проникновение спермы.
Женская: Маточные трубы|Маточные трубы (фаллопиевы трубы) соединяют яичники с маткой и являются местом оплодотворения.|Оплодотворение происходит в ампулярной части трубы, где сперматозоид сливается с яйцеклеткой.|Мерцательный эпителий и мышечные сокращения продвигают оплодотворённую яйцеклетку (зиготу) к матке.|Воспаление труб (сальпингит) может привести к их непроходимости и бесплодию или внематочной беременности.|Перевязка маточных труб (тубэктомия) используется как метод контрацепции.
Женская: Влагалище|Влагалище — это мышечная трубка, соединяющая матку с наружными половыми органами.|Оно имеет складчатую слизистую оболочку, которая растягивается во время родов.|Во влагалище обитает микрофлора (лактобактерии), которая поддерживает кислую среду и защищает от патогенов.|Влагалище является органом для полового акта, родов и выведения менструальной крови.|Нарушение микрофлоры (бактериальный вагиноз, кандидоз) требует лечения.
Женская: Менструальный цикл|Менструальный цикл — это периодические изменения в организме женщины, направленные на подготовку к беременности.|Цикл делится на фазы: менструальную (отторжение эндометрия), фолликулярную (созревание фолликула), овуляцию (выход яйцеклетки) и лютеиновую (образование жёлтого тела).|Регуляция цикла осуществляется гормонами гипоталамуса, гипофиза (ФСГ, ЛГ) и яичников (эстрогены, прогестерон).|Средняя длительность цикла составляет 28 дней, но может варьировать от 21 до 35 дней.|Нарушения цикла (аменорея, дисменорея) могут быть признаком эндокринных или гинекологических заболеваний.
Беременность|Беременность — это физиологический процесс развития плода в матке, который длится около 40 недель (280 дней).|Оплодотворение происходит в маточной трубе, затем зигота дробится и через 6-7 дней имплантируется в эндометрий.|Плацента — это орган, который обеспечивает питание, дыхание и выделение продуктов обмена плода, а также синтезирует гормоны (ХГЧ, прогестерон).|Плод развивается в амниотической жидкости, которая защищает его от механических повреждений и инфекций.|Роды — это сложный рефлекторный акт, который запускается окситоцином и механическим растяжением шейки матки.
Суставы: Плечевой|Плечевой сустав — это шаровидный сустав, образованный головкой плечевой кости и суставной впадиной лопатки.|Он является самым подвижным суставом в теле человека, обеспечивая движения вокруг трёх осей (сгибание, разгибание, отведение, приведение, вращение).|Стабильность сустава обеспечивается суставной губой, капсулой, связками и мышцами вращательной манжеты.|Из-за большого объёма движений плечевой сустав часто подвержен вывихам.|Воспаление сухожилий (тендинит) или капсулы (адгезивный капсулит) ограничивают подвижность.
Суставы: Локтевой|Локтевой сустав — это сложный сустав, состоящий из трёх сочленений: плечелоктевого, плечелучевого и лучелоктевого.|Он обеспечивает сгибание и разгибание предплечья, а также вращение (пронацию и супинацию).|Сустав укреплён мощными коллатеральными связками, которые предотвращают боковые смещения.|В локтевом суставе часто возникают бурситы (воспаление слизистых сумок) и эпикондилиты (воспаление мест прикрепления мышц).|Переломы в области локтя требуют точной репозиции для сохранения функции руки.
Суставы: Тазобедренный|Тазобедренный сустав — это чашеобразный сустав, образованный головкой бедренной кости и вертлужной впадиной таза.|Он является одним из самых прочных и стабильных суставов, выдерживающих вес тела и обеспечивающих движение во всех плоскостях.|Стабильность обеспечивается мощной капсулой, связками (подвздошно-бедренная, лобково-бедренная) и глубокой впадиной.|С возрастом или при дисплазии может развиться коксартроз (артроз тазобедренного сустава), требующий эндопротезирования.|Перелом шейки бедра у пожилых людей часто приводит к обездвиженности и требует хирургического лечения.
Суставы: Коленный|Коленный сустав — это самый крупный и сложный сустав, образованный бедренной, большеберцовой костями и надколенником.|Он работает как блоковидный сустав с элементами вращения и содержит мениски (хрящевые прокладки) для амортизации.|Сустав укреплён крестообразными и коллатеральными связками, которые предотвращают смещение костей.|Повреждение менисков или связок — частая спортивная травма, требующая артроскопии.|Коленный сустав также часто поражается артрозом (гонартроз) и ревматоидным артритом.
Суставы: Голеностопный|Голеностопный сустав — это блоковидный сустав, образованный костями голени (большеберцовой и малоберцовой) и таранной костью стопы.|Он обеспечивает сгибание (подошвенное) и разгибание (тыльное) стопы, а также небольшие боковые движения.|Стабильность сустава обеспечивается связками (дельтовидная, латеральные) и капсулой.|Частая травма — растяжение связок при подвороте стопы (инверсионная травма).|При переломах лодыжек требуется точное восстановление анатомии сустава для предотвращения артроза.
Периферические: Шейное|Шейное сплетение образовано передними ветвями шейных спинномозговых нервов (C1-C4).|Оно иннервирует кожу шеи, затылка, ушной раковины, а также мышцы шеи и диафрагму (диафрагмальный нерв C3-C5).|Диафрагмальный нерв является жизненно важным, так как обеспечивает сокращение диафрагмы при дыхании.|Повреждение шейного сплетения или диафрагмального нерва может привести к параличу диафрагмы и дыхательной недостаточности.|Блокада шейного сплетения используется для анестезии при операциях на шее.
Периферические: Плечевое|Плечевое сплетение образовано передними ветвями спинномозговых нервов C5-C8 и Th1.|Оно иннервирует мышцы и кожу верхней конечности, разделяясь на короткие ветви (плечевой пояс) и длинные (свободная конечность).|Основные нервы: подмышечный, мышечно-кожный, лучевой, срединный, локтевой.|Повреждение плечевого сплетения (акушерский паралич, травма) приводит к парезу или параличу руки.|Неврит лучевого нерва вызывает «свисающую кисть», а локтевого — «когтистую лапу».
Периферические: Поясничное|Поясничное сплетение образовано передними ветвями поясничных спинномозговых нервов (L1-L4).|Оно иннервирует кожу и мышцы нижней части живота, передней поверхности бедра и частично голени.|Основные нервы: бедренный, запирательный, латеральный кожный нерв бедра.|Бедренный нерв иннервирует переднюю группу мышц бедра (четырёхглавую) и кожу передней поверхности бедра.|Повреждение запирательного нерва нарушает приведение бедра, а бедренного — разгибание голени.
Периферические: Крестцовое|Крестцовое сплетение образовано передними ветвями крестцовых и копчикового нервов (L4-S4).|Оно иннервирует мышцы и кожу таза, задней поверхности бедра, голени и стопы.|Основные нервы: седалищный (самый крупный нерв тела), большеберцовый, малоберцовый, ягодичные нервы.|Седалищный нерв выходит через подгрушевидное отверстие и иннервирует заднюю группу мышц бедра.|Воспаление седалищного нерва (ишиас) вызывает сильную боль по задней поверхности ноги.
Периферические: Межрёберные|Межрёберные нервы (Th1-Th11) проходят в межрёберных промежутках и иннервируют межрёберные мышцы, плевру и кожу груди.|Двенадцатый подрёберный нерв (Th12) иннервирует кожу живота.|Межрёберные нервы участвуют в дыхательных движениях и передают чувствительность от грудной стенки.|Повреждение межрёберных нервов (например, при переломе ребра) вызывает сильную боль при дыхании.|Межрёберная невралгия может имитировать боли в сердце (стенокардию).
Эмбриология: Оплодотворение|Оплодотворение — это слияние сперматозоида и яйцеклетки, которое происходит в маточной трубе.|Сперматозоид проникает через блестящую оболочку яйцеклетки, после чего выделяется кортикальная гранула, блокирующая проникновение других сперматозоидов.|Образуется зигота с диплоидным набором хромосом (46).|Зигота начинает дробиться (митоз) и через 3-4 дня превращается в бластоцисту.|На 6-7 день бластоциста имплантируется в эндометрий матки.
Эмбриология: Бластула|Бластула — это стадия зародыша, которая образуется после нескольких циклов дробления зиготы.|Клетки (бластомеры) становятся мельче, между ними появляется полость (бластоцель).|У млекопитающих бластула называется бластоцистой и состоит из трофобласта (наружный слой) и эмбриобласта (внутренняя клеточная масса).|Трофобласт участвует в имплантации и образовании плаценты, а эмбриобласт даёт начало всем тканям зародыша.|На стадии бластоцисты можно провести преимплантационную генетическую диагностику (ПГД).
Эмбриология: Гаструляция|Гаструляция — это процесс образования трёх зародышевых листков: эктодермы, мезодермы и энтодермы.|Эктодерма даёт начало нервной системе, коже и её производным (волосы, ногти, потовые железы).|Мезодерма образует скелет, мышцы, кровеносную систему, почки и половые железы.|Энтодерма формирует пищеварительный тракт, печень, поджелудочную железу и лёгкие.|Нарушение гаструляции приводит к тяжёлым порокам развития.
Эмбриология: Нейруляция|Нейруляция — это процесс формирования нервной трубки из эктодермы, который начинается на 3-й неделе развития.|Края нервной пластинки поднимаются и смыкаются, образуя трубку, которая затем дифференцируется на головной и спинной мозг.|Незамкнувшаяся нервная трубка приводит к тяжёлым порокам: анэнцефалии (отсутствие мозга) или спина бифида (незаращение позвоночника).|Для профилактики этих пороков беременным рекомендуют принимать фолиевую кислоту (витамин B9).|Нейруляция — критический период эмбриогенеза, когда зародыш особенно уязвим.
Эмбриология: Органогенез|Органогенез — это период закладки и развития органов, который начинается с 4-й недели и продолжается до рождения.|Сердце начинает биться на 3-й неделе (22-23 день), а конечности формируются на 4-5 неделе.|В первом триместре (до 12 недель) закладываются все основные органы, поэтому этот период наиболее опасен для тератогенных воздействий (инфекции, лекарства, алкоголь).|Во втором и третьем триместрах происходит рост и созревание органов и тканей.|Плод считается жизнеспособным с 22-24 недель, но требует интенсивной терапии.
Генетика: ДНК|ДНК (дезоксирибонуклеиновая кислота) — это макромолекула, которая хранит генетическую информацию.|Она состоит из двух комплементарных цепей, закрученных в двойную спираль (модель Уотсона и Крика, 1953).|Нуклеотиды ДНК включают азотистые основания: аденин (А), тимин (Т), гуанин (Г) и цитозин (Ц).|А соединяется с Т (две водородные связи), а Г с Ц (три водородные связи).|Последовательность нуклеотидов кодирует аминокислотную последовательность белков.
Генетика: Гены|Ген — это участок ДНК, который содержит информацию о структуре одного белка или функциональной РНК.|Гены расположены в хромосомах в линейном порядке.|Экспрессия гена включает транскрипцию (синтез мРНК) и трансляцию (синтез белка на рибосомах).|Гены могут быть доминантными (проявляются в гетерозиготе) и рецессивными (только в гомозиготе).|Мутации в генах могут приводить к наследственным заболеваниям.
Генетика: Хромосомы|Хромосомы — это структуры, состоящие из ДНК и белков (гистонов), которые обеспечивают компактную упаковку генетического материала.|У человека 46 хромосом (23 пары): 22 пары аутосом и 1 пара половых хромосом (XX у женщин, XY у мужчин).|Кариотип — это полный набор хромосом клетки, который можно исследовать под микроскопом.|Изменения числа хромосом (анеуплоидии) вызывают тяжёлые синдромы: трисомия 21 (синдром Дауна), трисомия 18 (Эдвардса), трисомия 13 (Патау).|Изменения структуры хромосом (делеции, транслокации) также приводят к патологии.
Генетика: Мутации|Мутация — это стойкое изменение последовательности ДНК.|Мутации могут быть спонтанными (ошибки репликации) или индуцированными (радиация, химические мутагены).|Точечные мутации (замена одного нуклеотида) могут быть миссенс (замена аминокислоты), нонсенс (прекращение синтеза) или сайлент (без эффекта).|Хромосомные мутации включают делеции, дупликации, инверсии и транслокации.|Наследственные мутации передаются из поколения в поколение, а соматические — только в пределах организма (например, при раке).
Генетика: Наследование|Наследование признаков изучает генетика. Выделяют аутосомно-доминантный, аутосомно-рецессивный, Х-сцепленный и митохондриальный типы наследования.|При аутосомно-доминантном типе достаточно одного мутантного аллеля для проявления болезни (например, болезнь Гентингтона).|При аутосомно-рецессивном типе болезнь проявляется только у гомозигот, а родители являются носителями (например, муковисцидоз).|Х-сцепленные болезни чаще встречаются у мужчин (гемофилия, дальтонизм), так как у них только одна Х-хромосома.|Медико-генетическое консультирование помогает оценить риск рождения ребёнка с наследственным заболеванием.
Гистология: Эпителий|Эпителиальная ткань покрывает поверхности тела и выстилает полости внутренних органов, выполняя барьерную, защитную и секреторную функции.|Однослойный плоский эпителий (мезотелий) выстилает брюшину, плевру и перикард, обеспечивая гладкую поверхность для скольжения органов.|Однослойный кубический эпителий образует канальцы почек и протоки желёз, участвуя в фильтрации и секреции.|Многослойный плоский ороговевающий эпителий образует epidermis кожи, защищая от механических повреждений и потери воды.|Мерцательный (реснитчатый) эпителий выстилает дыхательные пути и маточные трубы, обеспечивая движение слизи и яйцеклетки.
Гистология: Соединительная|Соединительная ткань состоит из клеток (фибробласты, макрофаги, тучные клетки) и межклеточного вещества (волокна и аморфный компонент).|Рыхлая волокнистая ткань сопровождает сосуды и нервы, заполняя промежутки между органами.|Плотная оформленная ткань образует сухожилия и связки, обеспечивая высокую прочность на растяжение.|Хрящевая ткань (гиалиновая, эластическая, волокнистая) обеспечивает опору и амортизацию, но не имеет кровеносных сосудов.|Костная ткань состоит из остеонов, содержащих остеоциты, и минерализованного матрикса, обеспечивая прочность скелета.
Гистология: Мышечная|Гладкая мышечная ткань состоит из веретенообразных клеток с одним ядром, сокращается непроизвольно и медленно.|Скелетная мышечная ткань образована многоядерными волокнами с поперечной исчерченностью, сокращается произвольно и быстро.|Сердечная мышечная ткань состоит из кардиомиоцитов, соединённых вставочными дисками, и обладает автоматией.|Мышечные волокна содержат миофибриллы, состоящие из саркомеров (актин и миозин).|Сокращение мышц происходит за счёт энергии АТФ и ионов кальция, запускающих скольжение нитей.
Гистология: Нервная|Нервная ткань состоит из нейронов (генерируют и проводят импульсы) и нейроглии (опорная, трофическая, защитная функции).|Нейрон имеет тело (сома), дендриты (приём сигналов) и аксон (передача импульса).|Миелиновая оболочка, образованная олигодендроцитами, ускоряет проведение импульса по аксону.|Синапсы обеспечивают передачу сигнала между нейронами с помощью нейромедиаторов (ацетилхолин, дофамин).|Нейроглия включает астроциты (питание), олигодендроциты (миелин) и микроглию (иммунитет).
Череп: Мозговой|Мозговой отдел черепа защищает головной мозг и состоит из 8 костей: лобной, парных теменных, затылочной, парных височных, клиновидной и решётчатой.|Лобная кость образует свод черепа и содержит лобные пазухи, которые сообщаются с полостью носа.|Затылочная кость имеет большое затылочное отверстие для соединения головного мозга со спинным.|Височная кость содержит органы слуха и равновесия, а также сосцевидный отросток.|Клиновидная кость (os sphenoidale) имеет сложную форму и участвует в образовании основания черепа и глазницы.
Череп: Лицевой|Лицевой отдел черепа образует костную основу лица и включает 15 костей, среди которых парные и непарные.|Верхняя челюсть (maxilla) участвует в образовании твёрдого нёба, глазницы и полости носа, содержа гайморову пазуху.|Нижняя челюсть (mandibula) — единственная подвижная кость черепа, соединяющаяся с височной костью височно-нижнечелюстным суставом.|Скуловые кости формируют боковую стенку глазницы и скуловую дугу, служащую ориентиром для хирургов.|Носовые кости образуют спинку носа, а сошник (vomer) — заднюю часть носовой перегородки.
Позвоночник: Шейный|Шейный отдел состоит из 7 позвонков (C1–C7) и обеспечивает наибольшую подвижность позвоночника.|Первый шейный позвонок (атлант) не имеет тела и сочленяется с затылочной костью, обеспечивая кивательные движения.|Второй шейный позвонок (осевой) имеет зуб (dens), вокруг которого вращается атлант (повороты головы).|Шейные позвонки имеют небольшие размеры и отверстия в поперечных отростках для позвоночной артерии.|Седьмой шейный позвонок (C7) имеет длинный остистый отросток (выступающая точка), используемый как ориентир.
Позвоночник: Грудной|Грудной отдел состоит из 12 позвонков (Th1–Th12), которые крупнее шейных.|На боковых поверхностях тел и поперечных отростках грудных позвонков имеются рёберные ямки для соединения с рёбрами.|Остистые отростки грудных позвонков направлены вниз и черепицеобразно накладываются друг на друга.|Грудной отдел менее подвижен, чем шейный и поясничный, так как соединён с грудной клеткой.|Двенадцатый грудной позвонок (Th12) не имеет нижних рёберных ямок и служит границей между грудным и поясничным отделами.
Позвоночник: Поясничный|Поясничный отдел состоит из 5 позвонков (L1–L5), которые являются самыми массивными в позвоночнике.|Поясничные позвонки несут основную нагрузку при прямохождении и подъёме тяжестей.|Их тела крупные, а остистые отростки направлены прямо назад, что позволяет выполнять пункцию спинного мозга.|Между позвонками расположены мощные межпозвоночные диски, обеспечивающие амортизацию.|Пятый поясничный позвонок (L5) соединяется с крестцом под углом, создавая пояснично-крестцовый изгиб (лордоз).
Позвоночник: Крестец|Крестец (os sacrum) состоит из 5 сросшихся крестцовых позвонков и имеет треугольную форму.|Он соединяет позвоночник с тазовыми костями через крестцово-подвздошные суставы.|На задней поверхности крестца расположены крестцовые отверстия для выхода нервов.|Крестец передаёт вес тела от позвоночника к нижним конечностям через таз.|Копчик (os coccygis) — это рудимент хвостового отдела, состоящий из 1-3 сросшихся позвонков.
Верхняя конечность: Пояс|Пояс верхней конечности состоит из ключицы и лопатки.|Ключица (clavicula) — S-образная кость, соединяющая грудину с лопаткой и удерживающая плечо на расстоянии от грудной клетки.|Лопатка (scapula) — плоская кость, расположенная на задней поверхности грудной клетки.|На лопатке имеются ость, акромион и клювовидный отросток, служащие для прикрепления мышц и связок.|Сочленение ключицы с грудиной (грудино-ключичный сустав) и с лопаткой (акромиально-ключичный сустав) обеспечивают подвижность пояса.
Верхняя конечность: Плечо и предплечье|Плечевая кость (humerus) — длинная трубчатая кость, образующая плечо.|Она соединяется с лопаткой (плечевой сустав) и с костями предплечья (локтевой сустав).|Предплечье состоит из двух костей: локтевой (ulna, медиальная) и лучевой (radius, латеральная).|Лучевая кость обеспечивает вращение предплечья (пронацию и супинацию), а локтевая — стабильность.|Между костями предплечья натянута межкостная мембрана, которая служит местом прикрепления мышц.
