Верхняя конечность: Кисть|Кисть состоит из запястья (8 костей), пясти (5 костей) и фаланг пальцев (14 костей).|Кости запястья расположены в два ряда и обеспечивают гибкость лучезапястного сустава.|Пястные кости соединяются с фалангами пальцев, образуя пястно-фаланговые суставы.|Большой палец имеет две фаланги, а остальные — по три.|Противопоставление большого пальца остальным обеспечивает хватательную функцию кисти.
Нижняя конечность: Пояс|Пояс нижней конечности образован двумя тазовыми костями (os coxae).|Каждая тазовая кость состоит из сросшихся подвздошной, седалищной и лобковой костей.|Подвздошная кость имеет крыло с гребнем, который служит ориентиром для определения границ живота.|Седалищная кость имеет седалищный бугор, на который человек опирается при сидении.|Лобковые кости соединяются лобковым симфизом, образуя переднюю стенку таза.
Нижняя конечность: Бедро и голень|Бедренная кость (femur) — самая длинная и прочная кость тела.|Она соединяется с тазом (тазобедренный сустав) и с голенью (коленный сустав).|На дистальном конце бедренной кости расположены мыщелки, которые сочленяются с большеберцовой костью.|Голень состоит из большеберцовой (tibia, опорная) и малоберцовой (fibula, вспомогательная) костей.|Надколенник (patella) — сесамовидная кость, расположенная в толще сухожилия четырёхглавой мышцы бедра.
Нижняя конечность: Стопа|Стопа состоит из предплюсны (7 костей), плюсны (5 костей) и фаланг пальцев (14 костей).|Таранная кость (talus) образует голеностопный сустав с костями голени.|Пяточная кость (calcaneus) — самая крупная кость стопы, выдерживающая вес тела.|Стопа имеет продольный и поперечный своды, которые амортизируют нагрузки при ходьбе.|Плоскостопие (уплощение сводов) приводит к быстрой утомляемости и болям в ногах.
Мышцы: Головы|Мимические мышцы лица (круговая мышца рта, глаза, мышца, сморщивающая бровь) прикрепляются к коже и обеспечивают выражение эмоций.|Жевательные мышцы (собственно жевательная, височная, крыловидные) обеспечивают движение нижней челюсти при жевании.|Мышцы головы иннервируются черепными нервами: лицевым (VII) для мимических и тройничным (V) для жевательных.|Мышца, поднимающая верхнюю губу, и большая скуловая мышца участвуют в улыбке.|Круговая мышца глаза закрывает глазную щель и участвует в мигании.
Мышцы: Шеи|Мышцы шеи делятся на поверхностные, надподъязычные, подподъязычные и глубокие.|Грудино-ключично-сосцевидная мышца при одностороннем сокращении наклоняет голову, а при двустороннем — запрокидывает её назад.|Надподъязычные мышцы (двубрюшная, шилоподъязычная) участвуют в опускании нижней челюсти и глотании.|Подподъязычные мышцы (щитоподъязычная, грудино-подъязычная) фиксируют подъязычную кость.|Лестничные мышцы (передняя, средняя, задняя) наклоняют шею и поднимают первые два ребра при вдохе.
Мышцы: Спины|Поверхностные мышцы спины (трапециевидная, широчайшая) обеспечивают движение лопатки и плеча.|Трапециевидная мышца поднимает и опускает лопатку, а также разгибает шею.|Широчайшая мышца спины приводит плечо к туловищу и вращает его внутрь.|Глубокие мышцы спины (мышца, выпрямляющая позвоночник) удерживают тело в вертикальном положении.|Подзатылочные мышцы обеспечивают точные движения головы и шеи.
Мышцы: Груди|Большая грудная мышца приводит и вращает плечо внутрь, а также участвует в подъёме рёбер при вдохе.|Малая грудная мышца тянет лопатку вниз и вперёд.|Передняя зубчатая мышца прижимает лопатку к грудной клетке и вращает её.|Межрёберные мышцы (наружные и внутренние) участвуют в акте дыхания, поднимая и опуская рёбра.|Диафрагма — главная дыхательная мышца, разделяющая грудную и брюшную полости.
Мышцы: Живота|Прямая мышца живота (пресс) сгибает туловище вперёд и поднимает таз.|Наружная и внутренняя косые мышцы живота обеспечивают наклоны и повороты туловища.|Поперечная мышца живота — самая глубокая, сжимает внутренние органы и участвует в выдохе.|Квадратная мышца поясницы наклоняет туловище в сторону и фиксирует XII ребро.|Мышцы живота образуют брюшной пресс, который поддерживает внутренние органы и участвует в мочеиспускании и родах.
Мышцы: Плеча|Двуглавая мышца плеча (biceps) сгибает предплечье и супинирует его.|Трёхглавая мышца плеча (triceps) разгибает предплечье в локтевом суставе.|Клювовидно-плечевая мышца сгибает и приводит плечо.|Плечевая мышца (brachialis) — основной сгибатель предплечья.|Мышцы плеча иннервируются мышечно-кожным (двуглавая) и лучевым (трёхглавая) нервами.
Мышцы: Предплечья|Передняя группа мышц предплечья (сгибатели) обеспечивает сгибание кисти и пальцев.|Задняя группа (разгибатели) обеспечивает разгибание кисти и пальцев.|Плечелучевая мышца сгибает предплечье в локтевом суставе и устанавливает кисть в среднее положение.|Круглый и квадратный пронаторы вращают предплечье внутрь (пронация).|Мышцы предплечья разделены на поверхностный и глубокий слои, их сухожилия проходят через запястный канал.
Мышцы: Кисти|Мышцы возвышения большого пальца (тенар) обеспечивают противопоставление и отведение большого пальца.|Мышцы возвышения мизинца (гипотенар) обеспечивают движение мизинца.|Червеобразные мышцы сгибают основные фаланги и разгибают средние и ногтевые.|Межкостные мышцы (ладонные и тыльные) разводят и сводят пальцы.|Кисть имеет сложный связочный аппарат и богатую иннервацию, обеспечивающую тонкую моторику.
Мышцы: Таза|Большая ягодичная мышца разгибает бедро и удерживает тело в вертикальном положении.|Средняя и малая ягодичные мышцы отводят бедро и стабилизируют таз при ходьбе.|Подвздошно-поясничная мышца сгибает бедро в тазобедренном суставе.|Грушевидная мышца вращает бедро кнаружи.|Мышцы таза участвуют в поддержании равновесия и ходьбе.
Мышцы: Бедра|Четырёхглавая мышца бедра (квадрицепс) разгибает голень и сгибает бедро.|Двуглавая мышца бедра сгибает голень и разгибает бедро.|Полусухожильная и полуперепончатая мышцы сгибают голень и вращают её внутрь.|Приводящие мышцы (длинная, короткая, большая) приводят бедро к срединной линии.|Мышцы бедра разделены на переднюю, заднюю и медиальную группы.
Мышцы: Голени|Трёхглавая мышца голени (икроножная и камбаловидная) сгибает стопу и голень.|Передняя большеберцовая мышца разгибает стопу и поднимает её внутренний край.|Малоберцовые мышцы (длинная и короткая) отводят стопу кнаружи.|Задняя большеберцовая мышца сгибает стопу и приводит её.|Мышцы голени участвуют в ходьбе, беге и прыжках.
Мышцы: Стопы|Мышцы стопы делятся на тыльные и подошвенные.|Тыльные мышцы разгибают пальцы стопы.|Подошвенные мышцы сгибают пальцы и поддерживают своды стопы.|Короткий сгибатель пальцев и мышца, отводящая большой палец, играют важную роль в амортизации.|Мышцы стопы вместе с связками формируют её своды.
Сердце: Клапаны|Трёхстворчатый клапан (valva tricuspidalis) отделяет правое предсердие от правого желудочка.|Митральный клапан (valva mitralis) отделяет левое предсердие от левого желудочка.|Аортальный клапан (valva aortae) находится на выходе из левого желудочка в аорту.|Лёгочный клапан (valva trunci pulmonalis) находится на выходе из правого желудочка в лёгочную артерию.|Клапаны открываются пассивно под давлением крови и закрываются, предотвращая обратный ток.
Сердце: Коронарные|Кровоснабжение сердца осуществляется коронарными артериями, отходящими от аорты.|Левая коронарная артерия делится на переднюю межжелудочковую и огибающую ветви.|Правая коронарная артерия снабжает кровью правый желудочек, правое предсердие и заднюю часть левого желудочка.|Венозный отток происходит через вены сердца (большая, средняя, малая) в коронарный синус.|Нарушение коронарного кровотока (атеросклероз) приводит к ишемической болезни сердца и инфаркту миокарда.
Сосуды: Аорта|Аорта — крупнейшая артерия тела, выходящая из левого желудочка.|Она делится на восходящую часть, дугу и нисходящую часть (грудную и брюшную).|От дуги аорты отходят плечеголовной ствол, левая общая сонная и левая подключичная артерии.|Брюшная аорта кровоснабжает органы брюшной полости и делится на две общие подвздошные артерии.|Стенка аорты содержит много эластических волокон, что позволяет ей растягиваться при систоле.
Сосуды: Полые вены|Верхняя полая вена собирает кровь от головы, шеи, верхних конечностей и грудной клетки.|Она образуется слиянием правой и левой плечеголовных вен и впадает в правое предсердие.|Нижняя полая вена собирает кровь от нижних конечностей, таза и органов брюшной полости.|Она проходит через диафрагму и впадает в правое предсердие.|В систему полых вен впадают также вены сердца (через коронарный синус).
Дыхательная: Гортань|Гортань (larynx) — это орган голосообразования и часть дыхательных путей.|Она состоит из хрящей: щитовидного, перстневидного, черпаловидных и надгортанника.|Щитовидный хрящ образует выступ на шее (адамово яблоко).|Голосовые связки натянуты между щитовидным и черпаловидным хрящами.|При прохождении воздуха через голосовую щель возникает звук, который модулируется полостями рта и носа.
Дыхательная: Трахея|Трахея (trachea) — это трубка длиной около 10-12 см, соединяющая гортань с бронхами.|Её стенка образована 16-20 хрящевыми полукольцами, которые поддерживают просвет.|Слизистая оболочка трахеи выстлана мерцательным эпителием, удаляющим пыль.|Трахея делится на два главных бронха на уровне IV-V грудных позвонков (бифуркация).|Слизистая также содержит железы, выделяющие слизь для увлажнения воздуха.
Дыхательная: Бронхи|Главные бронхи (правый и левый) входят в ворота лёгких.|Правый бронх шире и короче, поэтому аспирационные пневмонии чаще возникают справа.|Бронхи ветвятся на долевые, сегментарные и субсегментарные бронхи.|Мелкие бронхи (бронхиолы) не имеют хрящей и заканчиваются альвеолами.|Стенка бронхов содержит гладкие мышцы, которые могут спазмироваться при астме.
Дыхательная: Лёгкие|Лёгкие — парный орган, расположенный в грудной полости.|Правое лёгкое имеет три доли (верхнюю, среднюю, нижнюю), а левое — две (верхнюю и нижнюю).|Каждая доля делится на сегменты (10 в правом, 8-9 в левом), которые являются структурными единицами лёгких.|Ворота лёгких расположены на медиальной поверхности, где входят бронхи и сосуды.|Лёгкие покрыты плеврой, которая обеспечивает герметичность и снижает трение при дыхании.
Пищеварительная: Рот|Полость рта — это начальный отдел пищеварительной системы.|Зубы (32 у взрослого) обеспечивают механическое измельчение пищи.|Язык — мышечный орган, участвующий в перемешивании пищи, глотании и вкусовом восприятии.|Слюнные железы (околоушные, поднижнечелюстные, подъязычные) выделяют слюну с амилазой.|Слюна увлажняет пищу и начинает расщепление углеводов.
Пищеварительная: Пищевод|Пищевод — это мышечная трубка длиной около 25 см, соединяющая глотку с желудком.|Он имеет три части: шейную, грудную и брюшную.|Стенка пищевода состоит из слизистой, подслизистой, мышечной и адвентициальной оболочек.|Продвижение пищи происходит за счёт перистальтических сокращений мышц.|В нижней части пищевода находится сфинктер, предотвращающий заброс желудочного сока (рефлюкс).
Пищеварительная: Желудок|Желудок — это расширенная часть пищеварительного тракта, вмещающая до 2-3 литров.|Он делится на кардиальную часть, дно, тело и пилорическую часть (привратник).|Слизистая оболочка желудка содержит железы, выделяющие соляную кислоту и пепсин.|Соляная кислота активирует пепсин и убивает бактерии, а также денатурирует белки.|Слизь защищает стенку желудка от самопереваривания.
Пищеварительная: Тонкая кишка|Тонкая кишка — самый длинный отдел ЖКТ (5-6 метров).|Она делится на двенадцатиперстную, тощую и подвздошную кишки.|В двенадцатиперстную кишку выделяются желчь и панкреатический сок.|Слизистая оболочка имеет ворсинки и микроворсинки, увеличивающие площадь всасывания.|В тонкой кишке происходит окончательное расщепление и всасывание питательных веществ.
Пищеварительная: Толстая кишка|Толстая кишка имеет длину около 1,5 метров и включает слепую кишку с аппендиксом, ободочную и прямую кишку.|В толстой кишке всасывается вода и электролиты, формируется кал.|Слизистая оболочка толстой кишки не имеет ворсинок, но содержит много бокаловидных клеток, выделяющих слизь.|Микрофлора толстой кишки синтезирует витамины (K, B) и участвует в ферментации клетчатки.|Аппендикс (червеобразный отросток) является органом иммунной системы, но может воспаляться (аппендицит).
Пищеварительная: Печень|Печень — крупнейшая железа тела массой 1,5 кг, расположенная в правом подреберье.|Она вырабатывает желчь, которая эмульгирует жиры, облегчая их переваривание.|Печень обезвреживает токсины, участвует в обмене белков, жиров и углеводов, а также запасает гликоген и витамины.|В печени разрушаются старые эритроциты и синтезируются белки плазмы крови (альбумины, фибриноген).|Печень обладает высокой способностью к регенерации.
Пищеварительная: Поджелудочная|Поджелудочная железа — это железа смешанной секреции, расположенная позади желудка.|Экзокринная часть выделяет панкреатический сок с ферментами (трипсин, липаза, амилаза).|Эндокринная часть (островки Лангерганса) вырабатывает инсулин и глюкагон.|Протоки поджелудочной железы впадают в двенадцатиперстную кишку.|Воспаление поджелудочной железы (панкреатит) может быть вызвано желчнокаменной болезнью или алкоголем.
Мочевыделительная: Почки|Почки — парные органы, расположенные забрюшинно в поясничной области.|Они фильтруют кровь, образуя мочу, и регулируют водно-солевой баланс.|Нефрон — структурная единица почки, состоящая из капсулы и канальцев.|В клубочке происходит фильтрация плазмы, а в канальцах — реабсорбция полезных веществ.|Почки также вырабатывают ренин (регуляция давления) и эритропоэтин (стимуляция кроветворения).
Мочевыделительная: Мочеточники|Мочеточники — это трубки длиной около 30 см, соединяющие почки с мочевым пузырём.|Стенка мочеточника имеет мышечный слой, обеспечивающий перистальтику.|Моча продвигается по мочеточнику за счёт сокращений мышц и разницы давления.|Мочеточники впадают в мочевой пузырь в области мочепузырного треугольника.|Нарушение оттока мочи приводит к гидронефрозу (расширению почки).
Органы чувств: Глаз|Глаз состоит из глазного яблока и вспомогательного аппарата (веки, слёзные железы, мышцы).|Стенка глазного яблока имеет три оболочки: фиброзную (склера, роговица), сосудистую (радужка, цилиарное тело, хориоидея) и сетчатку.|Сетчатка содержит палочки (свет) и колбочки (цвет).|Свет проходит через роговицу, зрачок и хрусталик, фокусируясь на сетчатке.|Аккомодация — способность хрусталика изменять кривизну для фокусировки на разных расстояниях.
Органы чувств: Ухо|Ухо делится на наружное, среднее и внутреннее.|Наружное ухо (ушная раковина, слуховой проход) улавливает звук.|Среднее ухо содержит барабанную перепонку и три слуховые косточки (молоточек, наковальня, стремечко).|Внутреннее ухо включает улитку (слух) и вестибулярный аппарат (равновесие).|Звуковые волны преобразуются в нервные импульсы в кортиевом органе улитки.
Кожа: Эпидермис|Эпидермис — наружный слой кожи, образованный многослойным плоским ороговевающим эпителием.|Он состоит из пяти слоёв: базального, шиповатого, зернистого, блестящего и рогового.|В базальном слое находятся стволовые клетки, обеспечивающие обновление эпидермиса.|Меланоциты (пигментные клетки) защищают кожу от ультрафиолета.|Роговой слой (самый поверхностный) состоит из ороговевших клеток (чешуек), которые постоянно слущиваются.
Кожа: Дерма|Дерма — это средний слой кожи, состоящий из соединительной ткани (коллагеновые и эластиновые волокна).|В дерме расположены кровеносные сосуды, нервные окончания, волосяные фолликулы, потовые и сальные железы.|Сосочковый слой дермы (верхний) образует сосочки, вдающиеся в эпидермис и содержащие капилляры.|Сетчатый слой (глубокий) обеспечивает прочность кожи благодаря плотной упаковке коллагеновых волокон.|С возрастом количество коллагена и эластина уменьшается, что приводит к образованию морщин и потере упругости.
Кожа: Гиподерма|Гиподерма (подкожная жировая клетчатка) — это самый глубокий слой кожи, образованный жировой тканью.|Она выполняет амортизационную, теплоизоляционную и энергетическую функции.|Жировая ткань также является депо жирорастворимых витаминов (A, D, E, K).|Гиподерма участвует в эндокринной функции, выделяя гормоны (лептин, адипонектин).|У женщин жировая ткань распределяется преимущественно в области бёдер и ягодиц, а у мужчин — в области живота.
Кожа: Волосы|Волосы — это производные эпидермиса, состоящие из кератина.|Волос имеет стержень (видимая часть) и корень (в толще кожи).|Корень волоса окружён волосяным фолликулом, в который впадает сальная железа и прикрепляется мышца, поднимающая волос.|Пигмент волоса (меланин) синтезируется меланоцитами фолликула и определяет его цвет.|С возрастом выработка меланина снижается, что приводит к появлению седины.
Кожа: Ногти|Ногти — это роговые пластинки, защищающие концевые фаланги пальцев.|Ноготь состоит из корня (скрытого в ногтевом валике), тела и свободного края.|Ногтевая пластинка лежит на ногтевом ложе, которое богато кровеносными сосудами и нервами.|Рост ногтя происходит за счёт деления клеток в матриксе (корне).|Изменения ногтей (ломкость, пятна, борозды) могут указывать на системные заболевания или дефицит витаминов.
Кожа: Потовые|Потовые железы — это простые трубчатые железы, расположенные в дерме и гиподерме.|Эккринные (мерокринные) потовые железы выделяют водянистый пот, участвующий в терморегуляции и выделении продуктов обмена.|Апокринные потовые железы (расположены в подмышечных впадинах и паховой области) выделяют секрет, содержащий белки и липиды, который разлагается бактериями и вызывает запах.|Потовые железы иннервируются симпатической нервной системой.|При интенсивном потоотделении организм теряет воду и электролиты, что требует их восполнения.
Кожа: Сальные|Сальные железы — это альвеолярные железы, связанные с волосяными фолликулами.|Они выделяют кожное сало (себум), которое смазывает кожу и волосы, защищая их от высыхания и микроорганизмов.|Сальные железы наиболее активны в период полового созревания под влиянием андрогенов.|Закупорка сальных желёз и воспаление приводит к акне (угревой болезни).|При себорее наблюдается избыточное салоотделение, что может приводить к себорейному дерматиту.
Кожа: Терморегуляция|Кожа играет ключевую роль в поддержании постоянной температуры тела (около 37°C).|При повышении температуры окружающей среды сосуды кожи расширяются (вазодилатация), увеличивая теплоотдачу.|Потоотделение также способствует охлаждению за счёт испарения влаги с поверхности кожи.|При понижении температуры сосуды сужаются (вазоконстрикция), уменьшая теплоотдачу.|Мышечная дрожь (сокращение скелетных мышц) вырабатывает дополнительное тепло.
Кожа: Ожоги|Ожоги — это повреждение тканей, вызванное высокой температурой, химическими веществами или излучением.|Ожоги делятся на четыре степени: I (покраснение), II (пузыри), III (некроз кожи), IV (обугливание тканей).|При обширных ожогах развивается ожоговая болезнь (потеря плазмы, интоксикация, инфекция).|Первая помощь при ожогах: охлаждение, асептическая повязка, обезболивание.|Тяжёлые ожоги требуют инфузионной терапии и хирургического лечения.
Кожа: Раны|Рана — это нарушение целостности кожи и слизистых оболочек.|Заживление раны проходит в три фазы: воспаление, пролиферация (образование грануляций) и ремоделирование (формирование рубца).|В воспалительной фазе происходит очищение раны от некротических тканей и микроорганизмов.|В фазе пролиферации образуется грануляционная ткань и происходит эпителизация краёв раны.|При заживлении по вторичному натяжению (при нагноении или больших дефектах) образуется грубый рубец.
Регионарная: Голова|Голова делится на мозговой и лицевой отделы.|Мозговой отдел (череп) защищает головной мозг.|Лицевой отдел содержит органы зрения, слуха, обоняния и вкуса, а также начальные отделы пищеварительной и дыхательной систем.|Мышцы головы делятся на мимические и жевательные.|Кровоснабжение головы осуществляется ветвями наружной и внутренней сонных артерий.
Регионарная: Шея|Шея соединяет голову с туловищем и является зоной прохождения крупных сосудов, нервов, гортани и трахеи.|В ней выделяют переднюю, заднюю и боковые области.|Треугольники шеи (сонный, поднижнечелюстной, лопаточно-трахеальный) служат ориентирами для хирургов.|Мышцы шеи делятся на поверхностные и глубокие, они участвуют в движении головы и дыхании.|Повреждение крупных сосудов шеи может быть смертельным.
Регионарная: Грудь|Грудь — это область, в которой расположены сердце, лёгкие и крупные сосуды.|Грудная клетка образована грудиной, 12 парами рёбер и грудным отделом позвоночника.|В грудной полости выделяют средостение (центральная часть) и плевральные полости (боковые).|Молочные железы расположены на передней грудной стенке и функционируют под контролем гормонов.|Диафрагма отделяет грудную полость от брюшной.
Регионарная: Живот|Живот — это область, в которой расположены органы пищеварения, мочевыделения и эндокринные железы.|Брюшная полость выстлана брюшиной, которая образует связки и брыжейки для фиксации органов.|Живот делится на три отдела: эпигастрий, мезогастрий и гипогастрий.|В брюшной полости расположены печень, желудок, кишечник, поджелудочная железа и почки.|Слабость мышц живота приводит к грыжам.
Регионарная: Таз|Таз соединяет туловище с нижними конечностями и защищает органы малого таза.|Тазовые кости (подвздошная, седалищная, лобковая) срастаются, образуя вертлужную впадину.|В малом тазу расположены мочевой пузырь, прямая кишка и внутренние половые органы.|Дно таза образовано мышцами, поддерживающими органы и контролирующими мочеиспускание и дефекацию.|У женщин таз шире и имеет более округлую форму для деторождения.
Регионарная: Спина|Спина — это задняя поверхность туловища, включающая позвоночник и окружающие его мышцы.|Позвоночник состоит из 33-34 позвонков и имеет физиологические изгибы (лордоз, кифоз).|Мышцы спины делятся на поверхностные (трапециевидная, широчайшая) и глубокие (разгибатели позвоночника).|Спинной мозг проходит внутри позвоночного канала.|Спина является опорой тела и участвует в движении.
Регионарная: Верхняя|Верхняя конечность делится на пояс (ключица, лопатка), плечо, предплечье и кисть.|Плечевой сустав — самый подвижный сустав тела.|Предплечье состоит из локтевой и лучевой костей, которые обеспечивают вращение.|Кисть — орган труда и тонкой моторики.|Мышцы верхней конечности обеспечивают сгибание, разгибание, приведение и отведение.
Регионарная: Нижняя|Нижняя конечность делится на пояс (тазовые кости), бедро, голень и стопу.|Тазобедренный сустав — чашеобразный, выдерживает вес тела.|Коленный сустав — самый крупный и сложный сустав с менисками и связками.|Голень состоит из большеберцовой и малоберцовой костей.|Стопа имеет своды, которые амортизируют нагрузку при ходьбе.
Клетка: Митохондрии|Митохондрии — это двумембранные органеллы, обеспечивающие клетку энергией (АТФ) путём окислительного фосфорилирования.|Внутренняя мембрана митохондрий образует кристы, увеличивающие площадь для синтеза АТФ.|Митохондрии имеют собственную ДНК (мтДНК), которая наследуется по материнской линии.|Число митохондрий зависит от энергетических потребностей клетки (больше всего их в мышцах и печени).|Повреждение митохондрий приводит к энергетическому дефициту и апоптозу.
Клетка: ЭПС|Эндоплазматическая сеть (ЭПС) — это система мембранных каналов и цистерн в цитоплазме.|Гранулярная ЭПС покрыта рибосомами и участвует в синтезе белков.|Агранулярная (гладкая) ЭПС отвечает за синтез липидов и стероидов, а также за детоксикацию.|ЭПС обеспечивает транспорт веществ внутри клетки и связывает ядро с цитоплазмой.|При стрессе ЭПС может накапливать повреждённые белки, запуская апоптоз.
Клетка: Гольджи|Аппарат Гольджи — это стопка уплощённых мембранных цистерн, участвующих в модификации, сортировке и упаковке белков и липидов.|В Гольджи происходит гликозилирование белков и образование лизосом и секреторных пузырьков.|Аппарат Гольджи расположен около ядра.|Он участвует в транспорте веществ к плазматической мембране или в лизосомы.|Нарушение функции Гольджи ведёт к болезням накопления.
Клетка: Лизосомы|Лизосомы — это одномембранные органеллы, содержащие гидролитические ферменты.|Они расщепляют макромолекулы, повреждённые органеллы и чужеродные вещества (фагоцитоз).|Лизосомы участвуют в аутофагии (переваривании собственных структур клетки).|При разрыве лизосомной мембраны ферменты выходят в цитоплазму и вызывают некроз.|Лизосомные болезни (например, болезнь Тея-Сакса) связаны с дефицитом ферментов.
Клетка: Цитоскелет|Цитоскелет — это система белковых нитей, обеспечивающая форму клетки, её движение и внутриклеточный транспорт.|Он состоит из микрофиламентов (актин), микротрубочек (тубулин) и промежуточных филаментов (кератин).|Микротрубочки образуют веретено деления и реснички.|Актиновые микрофиламенты участвуют в сокращении мышц и движении клетки.|Нарушение цитоскелета может приводить к наследственным заболеваниям (например, мышечная дистрофия).
Клетка: Деление|Клеточный цикл включает интерфазу (G1, S, G2) и митоз (M).|В S-фазе происходит репликация ДНК.|Митоз состоит из профазы, метафазы, анафазы и телофазы.|Мейоз (при образовании половых клеток) включает два деления и приводит к образованию гаплоидных клеток.|Нарушение регуляции клеточного цикла ведёт к неконтролируемому делению и опухолям.
Клетка: Апоптоз|Апоптоз — это запрограммированная гибель клетки, необходимая для развития и обновления тканей.|В отличие от некроза, апоптоз не вызывает воспаления.|Апоптоз запускается внутренними (митохондриальными) или внешними (рецепторными) сигналами.|Каспазы — это ферменты, расщепляющие белки при апоптозе.|Нарушение апоптоза (например, мутация гена p53) способствует выживанию опухолевых клеток.
Клетка: Стволовые|Стволовые клетки — это недифференцированные клетки, способные к самообновлению и дифференцировке в различные типы клеток.|Эмбриональные стволовые клетки (ЭСК) плюрипотентны, то есть могут превращаться в любые клетки организма.|Взрослые стволовые клетки (гемопоэтические, мезенхимальные) находятся в тканях и участвуют в регенерации.|Индуцированные плюрипотентные стволовые клетки (iPSC) получают из обычных клеток путём перепрограммирования.|Стволовые клетки используются в регенеративной медицине для лечения болезней крови, ожогов и повреждений тканей.
Обмен: Белки|Белки — это основные строительные материалы организма, состоящие из аминокислот.|Незаменимые аминокислоты не синтезируются в организме и должны поступать с пищей.|Белки выполняют ферментативную, структурную, транспортную, защитную и регуляторную функции.|При недостатке белков развивается белково-энергетическая недостаточность (кахексия, квашиоркор).|Избыток белка увеличивает нагрузку на почки и печень.
Обмен: Жиры|Жиры (липиды) — это основной источник энергии и структурный компонент клеточных мембран.|Жиры делятся на насыщенные (животные) и ненасыщенные (растительные).|Холестерин — важный липид, участвующий в синтезе гормонов и витамина D, но его избыток ведёт к атеросклерозу.|Жиры запасаются в адипоцитах (жировой ткани) и используются при голодании.|Омега-3 и омега-6 жирные кислоты являются незаменимыми и должны поступать с пищей.
Обмен: Углеводы|Углеводы — это главный источник энергии для клеток.|Простые углеводы (глюкоза, фруктоза) быстро всасываются и повышают уровень сахара в крови.|Сложные углеводы (крахмал, клетчатка) расщепляются медленно и обеспечивают длительное чувство сытости.|Глюкоза запасается в печени и мышцах в виде гликогена.|Избыток углеводов превращается в жиры и откладывается в жировой ткани.
Обмен: Витамины|Витамины — это биологически активные вещества, необходимые для нормального обмена веществ.|Жирорастворимые витамины (A, D, E, K) накапливаются в печени и жировой ткани.|Водорастворимые витамины (C, группа B) не запасаются и должны поступать ежедневно.|Недостаток витаминов вызывает гиповитаминоз (цинга, рахит, бери-бери).|Избыток витаминов (гипервитаминоз) также опасен (например, витамин A токсичен в больших дозах).
Обмен: Минералы|Минералы (макро- и микроэлементы) участвуют в построении тканей и регуляции процессов.|Кальций и фосфор необходимы для костей и зубов.|Калий и натрий регулируют водно-солевой баланс и работу сердца.|Железо входит в состав гемоглобина и участвует в транспорте кислорода.|Йод необходим для синтеза гормонов щитовидной железы.
Обмен: Вода|Вода составляет около 60% массы тела и является средой для всех химических реакций.|Вода участвует в терморегуляции (потоотделение), транспорте веществ и выведении продуктов обмена.|Суточная потребность в воде — около 2-2,5 литров.|Обезвоживание (дегидратация) приводит к нарушению работы сердца, почек и мозга.|Избыток воды также опасен (гипонатриемия, отёк мозга).
Обмен: Энергия|Энергетический обмен включает расщепление питательных веществ и синтез АТФ.|Основной обмен — это минимальное количество энергии, необходимое для поддержания жизни в покое.|Энергозатраты зависят от физической активности, возраста, пола и состояния здоровья.|Единица измерения энергии — калория (или джоуль).|Баланс между потреблением и расходом энергии определяет массу тела.
Патология: Воспаление|Воспаление — это защитная реакция организма на повреждение или инфекцию.|Клинические признаки воспаления: покраснение, отёк, жар, боль и нарушение функции.|Воспаление включает три стадии: альтерацию (повреждение), экссудацию (выход жидкости и клеток) и пролиферацию (восстановление).|Медиаторы воспаления: гистамин, простагландины, лейкотриены, цитокины.|Хроническое воспаление может приводить к фиброзу и аутоиммунным заболеваниям.
Патология: Опухоли|Опухоль (неоплазма) — это патологическое разрастание ткани, не контролируемое организмом.|Доброкачественные опухоли растут медленно, не метастазируют и обычно имеют капсулу.|Злокачественные опухоли (рак) инфильтрируют окружающие ткани, метастазируют и опасны для жизни.|Основные методы лечения: хирургия, химиотерапия, лучевая терапия, иммунотерапия.|Ранняя диагностика значительно улучшает прогноз.
Патология: Инфаркт|Инфаркт — это омертвение (некроз) участка органа из-за острого нарушения кровоснабжения.|Наиболее частые причины: тромбоз, эмболия, спазм или атеросклероз артерии.|Инфаркт миокарда проявляется сильной болью за грудиной, страхом, холодным потом.|Инфаркт лёгкого — это омертвение участка лёгкого из-за закупорки лёгочной артерии.|Инфаркт почки сопровождается болью в пояснице и гематурией.
Патология: Инсульт|Инсульт — это острое нарушение мозгового кровообращения, приводящее к повреждению мозга.|Ишемический инсульт возникает из-за закупорки сосуда (тромб или эмболия).|Геморрагический инсульт возникает при разрыве сосуда (кровоизлияние).|Симптомы: внезапная слабость в конечностях, асимметрия лица, нарушение речи, потеря зрения.|Инсульт требует немедленной госпитализации (правило «золотого часа»).
Патология: Атеросклероз|Атеросклероз — это хроническое заболевание, при котором в стенке артерий откладываются холестериновые бляшки.|Бляшки сужают просвет сосуда и нарушают кровоток, а также могут разрываться, вызывая тромбоз.|Атеросклероз поражает аорту, коронарные, мозговые и периферические артерии.|Факторы риска: гиперлипидемия, гипертония, курение, диабет, ожирение.|Профилактика включает здоровое питание, физическую активность и отказ от курения.
Патология: Гипертония|Гипертоническая болезнь — это стойкое повышение артериального давления (выше 140/90 мм рт. ст.).|Причина — нарушение регуляции тонуса сосудов и работы сердца.|Гипертония увеличивает риск инфаркта, инсульта, почечной недостаточности.|Лечение включает диету (ограничение соли), физическую активность и лекарства (гипотензивные).|Регулярный контроль давления позволяет предотвратить осложнения.
Патология: Диабет|Сахарный диабет — это группа эндокринных заболеваний, связанных с нарушением усвоения глюкозы.|Диабет 1 типа — аутоиммунное разрушение бета-клеток поджелудочной железы (инсулинозависимый).|Диабет 2 типа — инсулинорезистентность и относительная недостаточность инсулина.|Симптомы: полиурия, полидипсия, полифагия, потеря веса, гипергликемия.|Осложнения: ретинопатия, нефропатия, нейропатия, инфаркт, инсульт.
Патология: Язва|Язвенная болезнь — это образование дефекта (язвы) в стенке желудка или двенадцатиперстной кишки.|Основные причины: инфекция Helicobacter pylori и приём нестероидных противовоспалительных средств (НПВС).|Язва проявляется болью в эпигастрии, связанной с приёмом пищи, тошнотой, изжогой.|Осложнения: кровотечение, перфорация, пенетрация, стеноз привратника.|Лечение включает эрадикацию H. pylori, антисекреторные препараты (ингибиторы протонной помпы) и диету.
Патология: Пневмония|Пневмония — это острое инфекционное воспаление лёгких с вовлечением альвеол.|Основные возбудители: пневмококк, стафилококк, вирусы, грибки.|Симптомы: лихорадка, кашель с мокротой, одышка, боль в груди.|Диагностика: рентгенография грудной клетки, анализ мокроты, общий анализ крови.|Лечение: антибиотики (при бактериальной пневмонии), симптоматическая терапия.
Патология: Бронхит|Бронхит — это воспаление бронхов, которое может быть острым или хроническим.|Острый бронхит чаще всего вызывается вирусами и проявляется кашлем, который длится несколько недель.|Хронический бронхит — это длительное воспаление с гиперсекрецией слизи и кашлем (особенно у курильщиков).|Симптомы: кашель, мокрота, одышка, хрипы.|Профилактика включает отказ от курения и укрепление иммунитета.
Патология: Астма|Бронхиальная астма — это хроническое воспалительное заболевание дыхательных путей с приступами удушья.|В основе — гиперреактивность бронхов и их спазм в ответ на аллергены или раздражители.|Симптомы: приступы экспираторной одышки, свистящее дыхание, кашель.|Лечение: ингаляционные глюкокортикоиды (базисная терапия) и бронхолитики (для снятия приступа).|Астма требует контроля и избегания триггеров.
Патология: Гастрит|Гастрит — это воспаление слизистой оболочки желудка.|Может быть острым (после приёма раздражающих веществ) или хроническим (инфекция H. pylori, аутоиммунный).|Симптомы: боль в эпигастрии, тошнота, рвота, потеря аппетита.|Хронический гастрит может привести к атрофии слизистой и раку желудка.|Лечение включает диету, антисекреторные препараты и эрадикацию H. pylori.
Патология: Гепатит|Гепатит — это воспаление печени, которое может быть вызвано вирусами, алкоголем, лекарствами или аутоиммунными процессами.|Вирусные гепатиты (A, B, C, D, E) имеют разные пути передачи и течение.|Симптомы: желтуха, тёмная моча, светлый кал, боль в правом подреберье, слабость.|Хронический гепатит B и C может привести к циррозу и раку печени.|Вакцинация против гепатита B является эффективной мерой профилактики.
Патология: Цирроз|Цирроз печени — это замещение нормальной ткани печени фиброзной (рубцовой) тканью.|Причины: алкоголизм, хронические вирусные гепатиты, аутоиммунные заболевания, болезни обмена.|Симптомы: слабость, желтуха, асцит, расширение вен пищевода, печёночная энцефалопатия.|Цирроз необратим, но прогрессирование можно замедлить, устранив причину.|Тяжёлый цирроз требует трансплантации печени.
Патология: Панкреатит|Панкреатит — это воспаление поджелудочной железы, которое может быть острым или хроническим.|Основные причины: желчнокаменная болезнь и злоупотребление алкоголем.|Острый панкреатит проявляется сильной болью в эпигастрии (опоясывающего характера), рвотой, повышением ферментов (амилаза, липаза).|Хронический панкреатит приводит к недостаточности внешней и внутренней секреции (диабет, нарушение пищеварения).|Лечение: голод, инфузионная терапия, обезболивание, ферментные препараты.
Патология: Аппендицит|Острый аппендицит — это воспаление червеобразного отростка слепой кишки.|Симптомы: боль в правой подвздошной области, тошнота, рвота, повышение температуры.|Боль часто начинается в эпигастрии и «спускается» в правый нижний квадрант (симптом Кохера).|При подозрении на аппендицит требуется срочная хирургическая операция (аппендэктомия).|Промедление может привести к перитониту.
Патология: Перитонит|Перитонит — это воспаление брюшины, обычно вызванное инфекцией из органов брюшной полости.|Причины: перфорация язвы, аппендицит, травмы, послеоперационные осложнения.|Симптомы: сильная боль в животе, напряжение мышц передней брюшной стенки («доскообразный живот»), тошнота, лихорадка.|Перитонит опасен для жизни и требует немедленной операции и антибиотиков.|Профилактика включает своевременное лечение острых хирургических заболеваний.
Патология: Пиелонефрит|Пиелонефрит — это инфекционно-воспалительное заболевание почек с поражением чашечно-лоханочной системы и паренхимы.|Основные возбудители: кишечная палочка, стафилококк, протей.|Симптомы: боль в пояснице, повышение температуры, озноб, дизурия, изменения в моче (лейкоцитурия, бактериурия).|Хронический пиелонефрит приводит к сморщиванию почки и почечной недостаточности.|Лечение включает антибиотики и восстановление оттока мочи.
Патология: Цистит|Цистит — это воспаление слизистой оболочки мочевого пузыря.|Чаще встречается у женщин из-за короткой уретры.|Симптомы: частое и болезненное мочеиспускание, боль внизу живота, мутная моча.|Основные возбудители: кишечная палочка, стафилококк, хламидии.|Лечение включает антибиотики и обильное питьё.
Патология: Анемия|Анемия — это снижение уровня гемоглобина и/или эритроцитов в крови.|Различают железодефицитную, B12-дефицитную, гемолитическую и апластическую анемии.|Симптомы: слабость, бледность, головокружение, одышка, тахикардия.|Диагностика включает общий анализ крови, определение уровня железа, витамина B12, фолиевой кислоты.|Лечение зависит от причины: препараты железа, витамин B12, трансфузии.
Патология: Лейкоз|Лейкоз — это злокачественное заболевание кроветворной системы, при котором происходит неконтролируемое размножение лейкоцитов.|Острый лейкоз развивается быстро, хронический — медленно.|Симптомы: слабость, лихорадка, кровоточивость, увеличение лимфоузлов и селезёнки.|Диагностика: анализ крови (бласты), миелограмма.|Лечение: химиотерапия, трансплантация костного мозга.
Патология: Аллергия|Аллергия — это повышенная чувствительность иммунной системы к безвредным веществам (аллергенам).|Аллергены могут быть пищевыми, бытовыми, пыльцевыми, лекарственными.|В основе — выработка IgE-антител и выброс гистамина из тучных клеток.|Проявления: крапивница, насморк, отёк Квинке, анафилактический шок.|Лечение: антигистаминные препараты, избегание аллергенов, адреналин при анафилаксии.
Патология: Аутоиммунные|Аутоиммунные заболевания возникают, когда иммунная система атакует собственные ткани организма.|Примеры: ревматоидный артрит, системная красная волчанка, рассеянный склероз, сахарный диабет 1 типа.|Причины: генетическая предрасположенность, инфекции, стресс, гормональные нарушения.|Симптомы зависят от поражённого органа (суставы, кожа, нервная система).|Лечение: иммуносупрессоры, глюкокортикоиды, биологические препараты.
Кроветворение: Гемопоэз|Гемопоэз — это процесс образования клеток крови, который происходит в красном костном мозге.|Все клетки крови происходят из единой полипотентной стволовой клетки (гемоцитобласта).|Гемопоэз регулируется факторами роста (колониестимулирующие факторы), гормонами (эритропоэтин) и микроокружением.|Различают эритропоэз, лейкопоэз и тромбоцитопоэз.|Нарушение гемопоэза приводит к анемиям, лейкозам и иммунодефицитам.
Кроветворение: Эритропоэз|Эритропоэз — это образование эритроцитов, которое происходит в красном костном мозге под влиянием эритропоэтина.|Эритропоэтин вырабатывается почками в ответ на гипоксию (недостаток кислорода).|В процессе эритропоэза клетки проходят стадии от проэритробласта до зрелого эритроцита.|Зрелый эритроцит теряет ядро и органеллы, заполняясь гемоглобином.|Продолжительность жизни эритроцита — около 120 дней, затем он разрушается в селезёнке.
Кроветворение: Лейкопоэз|Лейкопоэз — это образование лейкоцитов, которое происходит в костном мозге и лимфоидных органах.|Гранулоциты (нейтрофилы, эозинофилы, базофилы) образуются в костном мозге под влиянием гранулоцитарного колониестимулирующего фактора (Г-КСФ).|Лимфоциты образуются из лимфоидных стволовых клеток: Т-лимфоциты созревают в тимусе, а В-лимфоциты — в костном мозге.|Моноциты образуются в костном мозге и затем мигрируют в ткани, превращаясь в макрофаги.|Лейкопоэз стимулируется при инфекциях и воспалении.
Кроветворение: Тромбоцитопоэз|Тромбоцитопоэз — это образование тромбоцитов (кровяных пластинок) из мегакариоцитов костного мозга.|Мегакариоциты — это крупные клетки, которые под влиянием тромбопоэтина образуют тромбоциты путём отшнуровывания цитоплазмы.|Тромбоциты живут около 8-10 дней и участвуют в гемостазе (свёртывании крови).|Тромбопоэтин вырабатывается печенью и почками.|Снижение числа тромбоцитов (тромбоцитопения) приводит к кровоточивости.
Иммунология: Антигены|Антигены — это чужеродные вещества, которые вызывают иммунный ответ.|Антигенами могут быть белки, полисахариды, липиды и нуклеиновые кислоты.|Антигены имеют эпитопы (антигенные детерминанты), которые распознаются иммунной системой.|Собственные ткани организма обычно не вызывают иммунного ответа благодаря толерантности.|Нарушение толерантности приводит к аутоиммунным заболеваниям.
Иммунология: Антитела|Антитела (иммуноглобулины) — это белки, вырабатываемые В-лимфоцитами (плазматическими клетками) в ответ на антиген.|Молекула антитела имеет Y-образную форму и состоит из двух тяжёлых и двух лёгких цепей.|Различают пять классов антител: IgA, IgD, IgE, IgG, IgM.|IgG — основной класс антител в крови, обеспечивающий долговременный иммунитет.|IgE участвует в аллергических реакциях, IgA — в защите слизистых.
Иммунология: Т-лимфоциты|Т-лимфоциты — это клетки иммунной системы, которые созревают в тимусе и обеспечивают клеточный иммунитет.|Т-хелперы (CD4+) активируют В-лимфоциты и другие иммунные клетки, выделяя цитокины.|Т-киллеры (CD8+) уничтожают инфицированные и опухолевые клетки.|Т-регуляторные клетки (Treg) подавляют иммунный ответ и поддерживают толерантность.|ВИЧ поражает Т-хелперы, что приводит к иммунодефициту.
Иммунология: В-лимфоциты|В-лимфоциты — это клетки иммунной системы, которые созревают в костном мозге и обеспечивают гуморальный иммунитет.|При активации антигеном В-лимфоциты дифференцируются в плазматические клетки, вырабатывающие антитела.|Часть В-лимфоцитов становится клетками памяти, обеспечивающими быстрый ответ при повторной инфекции.|В-лимфоциты также могут презентовать антигены Т-хелперам.|Нарушение функции В-лимфоцитов приводит к иммунодефицитам.
Иммунология: Макрофаги|Макрофаги — это крупные клетки иммунной системы, которые образуются из моноцитов.|Они выполняют фагоцитоз (поглощение и переваривание чужеродных частиц).|Макрофаги презентируют антигены Т-хелперам, запуская специфический иммунный ответ.|Они также выделяют цитокины, регулирующие воспаление.|Макрофаги участвуют в репарации тканей и удалении апоптотических клеток.
Иммунология: Цитокины|Цитокины — это сигнальные молекулы, которые регулируют иммунный ответ и воспаление.|К ним относятся интерлейкины, интерфероны, факторы некроза опухоли (ФНО) и колониестимулирующие факторы.|Интерлейкины передают сигналы между лейкоцитами.|Интерфероны обладают противовирусной активностью.|ФНО-альфа участвует в воспалении и может вызывать септический шок.
Гормоны: Гипоталамус|Гипоталамус — это отдел промежуточного мозга, который регулирует эндокринную систему и гомеостаз.|Он вырабатывает рилизинг-гормоны (либерины и статины), которые контролируют гипофиз.|Гипоталамус также синтезирует вазопрессин и окситоцин, которые транспортируются в заднюю долю гипофиза.|Он регулирует температуру тела, голод, жажду, сон и эмоции.|Гипоталамус связан с корой головного мозга и лимбической системой.
Гормоны: Гипофиз|Гипофиз — это главная эндокринная железа, расположенная у основания мозга.|Передняя доля (аденогипофиз) вырабатывает соматотропин (СТГ), тиреотропин (ТТГ), адренокортикотропин (АКТГ), фолликулостимулирующий (ФСГ), лютеинизирующий (ЛГ) гормоны и пролактин.|Задняя доля (нейрогипофиз) выделяет окситоцин и вазопрессин (антидиуретический гормон).|Гипофиз регулируется гипоталамусом по принципу обратной связи.|Нарушения функции гипофиза приводят к гигантизму, карликовости, акромегалии, несахарному диабету.
Гормоны: Щитовидная|Щитовидная железа расположена на шее и вырабатывает тироксин (Т4) и трийодтиронин (Т3).|Эти гормоны регулируют обмен веществ, рост и развитие, а также теплопродукцию.|Кальцитонин, вырабатываемый С-клетками щитовидной железы, снижает уровень кальция в крови.|Недостаток гормонов (гипотиреоз) проявляется слабостью, отёками, брадикардией.|Избыток гормонов (тиреотоксикоз) вызывает тахикардию, похудание, повышенную возбудимость.
Гормоны: Паращитовидные|Паращитовидные железы (обычно четыре) расположены на задней поверхности щитовидной железы.|Они вырабатывают паратгормон (ПТГ), который повышает уровень кальция в крови.|ПТГ стимулирует выход кальция из костей, всасывание в кишечнике и реабсорбцию в почках.|Недостаток ПТГ вызывает гипокальциемию и судороги (тетанию).|Избыток ПТГ приводит к гиперкальциемии и остеопорозу.
Гормоны: Надпочечники|Надпочечники — парные железы, расположенные над почками.|Корковое вещество вырабатывает глюкокортикоиды (кортизол), минералокортикоиды (альдостерон) и андрогены.|Кортизол регулирует обмен веществ и участвует в реакции на стресс.|Альдостерон регулирует водно-солевой баланс, задерживая натрий и выводя калий.|Мозговое вещество вырабатывает адреналин и норадреналин, которые мобилизуют организм при стрессе.
Гормоны: Поджелудочная|Поджелудочная железа — это железа смешанной секреции, расположенная позади желудка.|Эндокринная часть (островки Лангерганса) вырабатывает инсулин (бета-клетки) и глюкагон (альфа-клетки).|Инсулин снижает уровень глюкозы в крови, способствуя её поглощению клетками.|Глюкагон повышает уровень глюкозы, стимулируя расщепление гликогена в печени.|Нарушение выработки инсулина приводит к сахарному диабету.
Гормоны: Половые|Половые железы (гонады) вырабатывают половые гормоны: тестостерон у мужчин, эстрогены и прогестерон у женщин.|Тестостерон регулирует сперматогенез и развитие вторичных половых признаков.|Эстрогены регулируют менструальный цикл, развитие молочных желёз и распределение жировой ткани.|Прогестерон готовит матку к беременности и поддерживает её.|Половые гормоны также влияют на костную ткань, обмен веществ и психоэмоциональное состояние.
Гормоны: Эпифиз|Эпифиз (шишковидная железа) — это небольшой орган в промежуточном мозге.|Он вырабатывает мелатонин, который регулирует циркадные ритмы (сон-бодрствование).|Синтез мелатонина подавляется светом и стимулируется темнотой.|Мелатонин также участвует в регуляции репродуктивной функции и иммунитета.|Нарушение выработки мелатонина связано с бессонницей и сезонными расстройствами.
Гормоны: Тимус|Тимус — это орган иммунной системы, который также выполняет эндокринную функцию.|Он вырабатывает гормоны тимозин, тимопоэтин и тимулин, регулирующие созревание Т-лимфоцитов.|Тимус наиболее активен в детском возрасте, затем подвергается инволюции.|Тимус участвует в формировании иммунной толерантности.|Нарушение функции тимуса связано с аутоиммунными заболеваниями и иммунодефицитами.
Гормоны: Регуляция|Эндокринная система регулируется по принципу обратной связи: повышение уровня гормона тормозит его дальнейшую выработку.|Гипоталамус контролирует гипофиз, который, в свою очередь, регулирует периферические железы.|Нервная система также влияет на эндокринную (например, симпатическая стимулирует выброс адреналина).|Гормоны действуют на органы-мишени через рецепторы.|Нарушение регуляции приводит к эндокринным заболеваниям.
Репродукция: Мужская|Мужская репродуктивная система включает яички, придатки, семявыносящие протоки, семенные пузырьки, предстательную железу и половой член.|Яички вырабатывают сперматозоиды и тестостерон.|Сперматогенез происходит в извитых семенных канальцах и занимает около 74 дней.|Сперматозоиды созревают в придатке яичка и приобретают подвижность.|Регуляция сперматогенеза осуществляется ФСГ, ЛГ и тестостероном.
Репродукция: Женская|Женская репродуктивная система включает яичники, маточные трубы, матку, влагалище и наружные половые органы.|Яичники вырабатывают яйцеклетки, эстрогены и прогестерон.|Менструальный цикл включает фолликулярную фазу, овуляцию и лютеиновую фазу.|Оплодотворение происходит в маточной трубе.|Беременность длится около 40 недель и завершается родами.
Репродукция: Оплодотворение|Оплодотворение — это слияние сперматозоида и яйцеклетки, происходящее в ампулярной части маточной трубы.|Сперматозоид проникает через блестящую оболочку, после чего происходит кортикальная реакция, блокирующая другие сперматозоиды.|Образуется зигота с диплоидным набором хромосом.|Зигота начинает дробиться, образуя бластомеры.|Через несколько дней зародыш попадает в матку и имплантируется.
Репродукция: Беременность|Беременность — это физиологический процесс развития плода в матке, который длится около 40 недель.|Плацента обеспечивает питание, дыхание и выделение продуктов обмена плода, а также синтезирует гормоны (ХГЧ, прогестерон).|Плод развивается в амниотической жидкости, защищающей его от механических повреждений.|В первом триместре закладываются все органы, поэтому он наиболее уязвим для тератогенов.|Беременность завершается родами.
Репродукция: Роды|Роды — это сложный физиологический процесс изгнания плода и плаценты из матки.|Роды делятся на три периода: раскрытие шейки матки, изгнание плода и последовый период.|Схватки — это ритмичные сокращения мышц матки, которые способствуют раскрытию шейки.|Потуги — это сокращения мышц брюшного пресса и диафрагмы, помогающие изгнанию плода.|Регуляция родов осуществляется окситоцином и механическим растяжением шейки матки.
Эмбриология: Зигота|Зигота — это оплодотворённая яйцеклетка, которая содержит диплоидный набор хромосом.|Первое деление зиготы происходит через 24-30 часов после оплодотворения.|Дробление зиготы приводит к образованию бластомеров, размеры которых уменьшаются.|На стадии 8-16 бластомеров зародыш называется морулой.|Затем образуется бластоциста, которая имплантируется в матку.
Эмбриология: Бластула|Бластула — это стадия зародыша, которая образуется в результате дробления зиготы.|У млекопитающих бластула называется бластоцистой и состоит из трофобласта и эмбриобласта.|Трофобласт участвует в имплантации и образовании плаценты.|Эмбриобласт даёт начало всем тканям и органам зародыша.|На стадии бластоцисты возможна преимплантационная генетическая диагностика.
Эмбриология: Гаструла|Гаструла — это стадия зародыша, на которой образуются три зародышевых листка: эктодерма, мезодерма и энтодерма.|Эктодерма образует нервную систему, кожу и её производные.|Мезодерма даёт начало скелету, мышцам, кровеносной системе и почкам.|Энтодерма формирует пищеварительный тракт, печень, поджелудочную железу и лёгкие.|Гаструляция сопровождается перемещением клеток (морфогенетические движения).
Эмбриология: Нейруляция|Нейруляция — это процесс формирования нервной трубки из эктодермы, который происходит на 3-й неделе развития.|Края нервной пластинки поднимаются и смыкаются, образуя трубку.|Незамкнувшаяся нервная трубка приводит к тяжёлым порокам (анэнцефалия, спина бифида).|Для профилактики этих пороков беременным назначают фолиевую кислоту.|Нейруляция — критический период эмбриогенеза.
Эмбриология: Органогенез|Органогенез — это период закладки и развития органов, который начинается с 4-й недели.|Сердце начинает биться на 3-й неделе, конечности формируются на 4-5 неделе.|В первом триместре закладываются все основные органы.|Тератогены (алкоголь, лекарства, инфекции) особенно опасны в первом триместре.|Плод становится жизнеспособным с 22-24 недель.
Генетика: ДНК|ДНК — это макромолекула, которая хранит генетическую информацию.|Она состоит из двух комплементарных цепей, закрученных в двойную спираль.|Нуклеотиды ДНК включают аденин (А), тимин (Т), гуанин (Г) и цитозин (Ц).|А соединяется с Т, а Г с Ц.|Последовательность нуклеотидов кодирует аминокислотную последовательность белков.
Генетика: Гены|Ген — это участок ДНК, который кодирует один белок или функциональную РНК.|Гены расположены в хромосомах в линейном порядке.|Экспрессия гена включает транскрипцию и трансляцию.|Гены могут быть доминантными и рецессивными.|Мутации в генах приводят к наследственным заболеваниям.
Генетика: Хромосомы|Хромосомы — это структуры из ДНК и белков, обеспечивающие упаковку генетического материала.|У человека 46 хромосом (23 пары): 22 пары аутосом и 1 пара половых хромосом.|Кариотип — это полный набор хромосом клетки.|Анеуплоидии (изменение числа хромосом) вызывают синдромы Дауна, Эдвардса, Патау.|Структурные перестройки хромосом также приводят к патологии.
Генетика: Мутации|Мутация — это стойкое изменение последовательности ДНК.|Мутации могут быть спонтанными или индуцированными (радиация, химические мутагены).|Точечные мутации бывают миссенс, нонсенс и сайлент.|Хромосомные мутации включают делеции, дупликации, инверсии и транслокации.|Наследственные мутации передаются из поколения в поколение.
Генетика: Наследование|Наследование признаков изучает генетика.|Выделяют аутосомно-доминантный, аутосомно-рецессивный, Х-сцепленный и митохондриальный типы наследования.|При аутосомно-доминантном типе достаточно одного мутантного аллеля (болезнь Гентингтона).|При аутосомно-рецессивном типе болезнь проявляется у гомозигот (муковисцидоз).|Х-сцепленные болезни чаще встречаются у мужчин (гемофилия).
Генетика: Сцепленное|Сцепленное наследование — это наследование генов, расположенных в одной хромосоме.|Гены, расположенные близко друг к другу, наследуются вместе.|Кроссинговер (обмен участками гомологичных хромосом) может нарушать сцепление.|Частота кроссинговера используется для картирования генов.|Сцепленное наследование объясняет некоторые наследственные синдромы.
Генетика: Полигенное|Полигенное наследование — это наследование признаков, контролируемых множеством генов.|Каждый ген вносит небольшой вклад в признак.|Полигенными являются рост, масса тела, цвет кожи, артериальное давление.|Полигенные признаки также зависят от факторов среды.|Полигенное наследование затрудняет прогнозирование.
Генетика: Эпигенетика|Эпигенетика — это изменения экспрессии генов, не связанные с изменением последовательности ДНК.|К эпигенетическим механизмам относятся метилирование ДНК, модификация гистонов и некодирующие РНК.|Эпигенетические изменения могут передаваться по наследству.|Эпигенетика играет роль в развитии, старении и канцерогенезе.|Факторы среды (питание, стресс) влияют на эпигенетические процессы.
Генетика: Диагностика|Генетическая диагностика включает кариотипирование, FISH, ПЦР, секвенирование.|Пренатальная диагностика (амниоцентез, хорионбиопсия) позволяет выявить хромосомные аномалии плода.|Неонатальный скрининг выявляет наследственные болезни обмена (фенилкетонурию, гипотиреоз).|ДНК-диагностика используется для выявления мутаций и определения носительства.|Генетическое консультирование помогает оценить риск наследственных заболеваний.
Генетика: Терапия|Генная терапия — это введение генов в клетки для лечения заболеваний.|Векторы (вирусы, липосомы) доставляют ген в клетку.|Генная терапия применяется при наследственных болезнях (SCID, гемофилия).|CRISPR/Cas9 — это технология редактирования генома.|Этические вопросы генной терапии требуют обсуждения.
Физиология: Пищеварение|Пищеварение — это процесс механической и химической переработки пищи.|Оно начинается в ротовой полости и продолжается в желудке и кишечнике.|Ферменты расщепляют белки, жиры и углеводы.|Всасывание питательных веществ происходит в тонкой кишке.|Регуляция пищеварения осуществляется нервной системой и гормонами.
Физиология: Дыхание|Дыхание — это процесс газообмена между организмом и окружающей средой.|Оно включает внешнее дыхание (лёгкие) и внутреннее (тканевое).|Вдох осуществляется за счёт диафрагмы и межрёберных мышц.|Газообмен в альвеолах происходит путём диффузии.|Регуляция дыхания осуществляется дыхательным центром продолговатого мозга.
Физиология: Кровообращение|Кровообращение обеспечивает транспорт крови по организму.|Сердце работает как насос, нагнетая кровь в артерии.|Кровь переносит кислород, питательные вещества и гормоны.|Регуляция кровообращения осуществляется нервной и эндокринной системами.|Нарушение кровообращения приводит к ишемии и инфаркту.
Физиология: Выделение|Выделение — это процесс удаления продуктов обмена из организма.|Основные органы выделения: почки, лёгкие, кожа, кишечник.|Почки фильтруют кровь и образуют мочу.|Почки регулируют водно-солевой баланс и кислотно-щелочное равновесие.|Нарушение выделения приводит к интоксикации.
Физиология: Терморегуляция|Терморегуляция — это поддержание постоянной температуры тела.|Химическая терморегуляция обеспечивается за счёт обмена веществ.|Физическая терморегуляция включает теплоотдачу (излучение, испарение, теплопроведение).|Центр терморегуляции находится в гипоталамусе.|Нарушение терморегуляции приводит к гипертермии или гипотермии.
Физиология: Обмен|Обмен веществ (метаболизм) — это совокупность химических реакций в организме.|Он включает анаболизм (синтез) и катаболизм (расщепление).|Энергия запасается в АТФ.|Основной обмен — это минимальные энергозатраты в покое.|Нарушение обмена веществ приводит к ожирению, диабету, атеросклерозу.
Физиология: Сон|Сон — это физиологическое состояние, необходимое для восстановления организма.|Сон состоит из медленноволновой и быстроволновой (REM) фаз.|Во время сна происходит обработка информации и консолидация памяти.|Гормон мелатонин регулирует циркадные ритмы.|Хроническое недосыпание приводит к нарушению обмена веществ и иммунитета.
Физиология: Стресс|Стресс — это неспецифическая реакция организма на любое требование среды.|Стресс может быть острым и хроническим.|В ответ на стресс активируется симпатическая система и выброс адреналина и кортизола.|Кратковременный стресс мобилизует ресурсы, хронический — истощает.|Управление стрессом важно для здоровья.
Физиология: Старение|Старение — это биологический процесс, сопровождающийся снижением функций организма.|Старение связано с накоплением повреждений ДНК, укорочением теломер, снижением активности стволовых клеток.|С возрастом уменьшается мышечная масса, плотность костей, эластичность кожи.|Риск хронических заболеваний (сердечно-сосудистых, диабета, рака) увеличивается.|Здоровый образ жизни замедляет старение.
Физиология: Адаптация|Адаптация — это приспособление организма к изменяющимся условиям среды.|Адаптация может быть кратковременной и долговременной.|Физическая тренировка — пример долговременной адаптации.|Адаптация к холоду, жаре, гипоксии происходит за счёт перестройки обмена веществ.|Нарушение адаптации приводит к дезадаптации и болезни.
Регионы: Голова сосуды|Кровоснабжение головы осуществляется из двух систем: внутренней сонной артерии (питает мозг и глазницу) и наружной сонной артерии (питает лицо, шею и твёрдую мозговую оболочку).|Внутренняя сонная артерия входит в полость черепа через сонный канал и делится на глазничную, переднюю и среднюю мозговые артерии.|Наружная сонная артерия отдаёт верхнюю щитовидную, язычную, лицевую, затылочную и поверхностную височную артерии.|Венозный отток от головы происходит через поверхностные и глубокие вены лица, которые впадают в яремные вены.|Лимфатические узлы головы делятся на затылочные, сосцевидные, околоушные, поднижнечелюстные и подбородочные.
Регионы: Голова нервы|Иннервация головы осуществляется черепными нервами (12 пар) и ветвями шейного сплетения.|Тройничный нерв (V) обеспечивает чувствительность лица и иннервирует жевательные мышцы.|Лицевой нерв (VII) иннервирует мимические мышцы и участвует во вкусовой чувствительности передних 2/3 языка.|Языкоглоточный (IX) и блуждающий (X) нервы иннервируют глотку, гортань и заднюю треть языка.|Подъязычный нерв (XII) иннервирует мышцы языка, а добавочный (XI) — грудино-ключично-сосцевидную и трапециевидную мышцы.
Регионы: Шея сосуды|Основные сосуды шеи: общая сонная артерия, внутренняя яремная вена и подключичные сосуды.|Общая сонная артерия делится на внутреннюю и наружную на уровне верхнего края щитовидного хряща (бифуркация).|Внутренняя яремная вена собирает кровь от головы и шеи и впадает в плечеголовную вену.|Подключичная артерия проходит между передней и средней лестничными мышцами и отдаёт позвоночную артерию (кровоснабжение мозга).|Лимфатические узлы шеи делятся на поверхностные и глубокие (вдоль внутренней яремной вены).
Регионы: Шея нервы|Шейное сплетение образовано передними ветвями C1-C4 и иннервирует кожу шеи, затылка и диафрагму (диафрагмальный нерв C3-C5).|Диафрагмальный нерв — жизненно важный, так как иннервирует диафрагму.|Плечевое сплетение (C5-Th1) проходит между передней и средней лестничными мышцами и иннервирует верхнюю конечность.|Блуждающий нерв (X) проходит в сосудисто-нервном пучке шеи и иннервирует органы грудной и брюшной полостей.|Симпатический ствол проходит вдоль позвоночника и участвует в регуляции тонуса сосудов и органов.
Регионы: Верхняя сосуды|Кровоснабжение верхней конечности осуществляется из подключичной артерии, которая переходит в подмышечную, а затем в плечевую.|Плечевая артерия проходит по медиальной поверхности плеча и делится на лучевую и локтевую артерии в локтевой ямке.|Лучевая артерия проходит по латеральной стороне предплечья (место прощупывания пульса) и образует поверхностную ладонную дугу.|Локтевая артерия проходит по медиальной стороне предплечья и образует глубокую ладонную дугу.|Венозный отток происходит через поверхностные (подкожные) и глубокие вены, которые впадают в подключичную вену.
Регионы: Верхняя нервы|Плечевое сплетение (C5-Th1) формирует основные нервы верхней конечности: подмышечный, мышечно-кожный, лучевой, срединный и локтевой.|Подмышечный нерв иннервирует дельтовидную мышцу и кожу плеча.|Лучевой нерв иннервирует разгибатели предплечья и кисти; его повреждение вызывает «свисающую кисть».|Срединный нерв иннервирует сгибатели предплечья и мышцы возвышения большого пальца; его сдавление в запястном канале вызывает туннельный синдром.|Локтевой нерв иннервирует мышцы возвышения мизинца и большинство межкостных мышц.
Регионы: Нижняя сосуды|Кровоснабжение нижней конечности осуществляется из наружной подвздошной артерии, которая переходит в бедренную.|Бедренная артерия проходит по передней поверхности бедра и переходит в подколенную артерию в подколенной ямке.|Подколенная артерия делится на переднюю и заднюю большеберцовые артерии.|Передняя большеберцовая артерия переходит в тыльную артерию стопы, а задняя — в подошвенные артерии.|Венозный отток происходит через поверхностные (большая и малая подкожные вены) и глубокие вены, которые впадают в подвздошную вену.
Регионы: Нижняя нервы|Крестцовое сплетение (L4-S4) формирует седалищный нерв — самый крупный нерв тела.|Седалищный нерв выходит через подгрушевидное отверстие и иннервирует заднюю группу мышц бедра, а затем делится на большеберцовый и общий малоберцовый нервы.|Большеберцовый нерв иннервирует заднюю группу мышц голени и подошву.|Общий малоберцовый нерв иннервирует переднюю и латеральную группы мышц голени и тыл стопы; его повреждение вызывает «свисающую стопу».|Бедренный нерв (из поясничного сплетения) иннервирует переднюю группу мышц бедра и кожу передней поверхности бедра.
Регионы: Грудь топография|Грудная стенка образована рёбрами, грудиной, межрёберными мышцами и покрыта кожей и фасциями.|В грудной полости выделяют средостение (центральная часть) и плевральные полости (боковые).|Средостение содержит сердце, крупные сосуды, трахею, пищевод, тимус и нервы.|Плевральные полости содержат лёгкие и плевральную жидкость.|Диафрагма отделяет грудную полость от брюшной.
Регионы: Грудь сосуды|Кровоснабжение грудной стенки осуществляется межрёберными артериями (из аорты) и внутренними грудными артериями (из подключичной).|Венозный отток происходит через межрёберные вены в непарную и полунепарную вены.|Лимфатический отток от молочной железы идёт в подмышечные, подключичные и парастернальные лимфоузлы.|Молочная железа имеет радиальное строение и состоит из 15-20 долек.|Иннервация молочной железы осуществляется межрёберными нервами.
Регионы: Живот топография|Живот делится на три отдела (эпигастрий, мезогастрий, гипогастрий) и боковые области.|Брюшная стенка имеет слои: кожа, подкожная жировая клетчатка, мышцы (прямая, косые, поперечная), поперечная фасция, брюшина.|Брюшина выстилает брюшную полость и покрывает органы (висцеральный и париетальный листки).|Между листками брюшины находится брюшинная полость с серозной жидкостью.|Слабые места брюшной стенки (пупочное кольцо, паховый канал, белая линия) — места образования грыж.
Регионы: Живот сосуды|Кровоснабжение органов брюшной полости осуществляется из брюшной аорты (чревный ствол, верхняя и нижняя брыжеечные артерии).|Чревный ствол кровоснабжает желудок, печень, селезёнку и поджелудочную железу.|Верхняя брыжеечная артерия кровоснабжает тонкую кишку и правую половину толстой кишки.|Нижняя брыжеечная артерия кровоснабжает левую половину толстой кишки.|Венозный отток происходит через воротную вену в печень (из органов ЖКТ) и нижнюю полую вену (из почек и нижних конечностей).
Регионы: Таз топография|Таз делится на большой и малый. Большой таз — часть брюшной полости, малый таз — полость, содержащая органы.|Стенки малого таза образованы костями таза, мышцами и связками.|Дно таза (тазовая диафрагма) образовано мышцей, поднимающей задний проход, и копчиковой мышцей.|Мочеполовая диафрагма образована глубокой поперечной мышцей промежности и сфинктером мочеиспускательного канала.|В малом тазу расположены мочевой пузырь, прямая кишка и внутренние половые органы.
Регионы: Таз сосуды|Кровоснабжение таза осуществляется из внутренней подвздошной артерии (ветви: верхняя и нижняя ягодичные, внутренняя половая, мочепузырные и маточные артерии).|Венозный отток происходит через внутренние подвздошные вены в общую подвздошную вену.|Лимфатические узлы таза делятся на наружные, внутренние и общие подвздошные, а также крестцовые.|Иннервация таза осуществляется крестцовым сплетением и вегетативными нервами (тазовые внутренностные нервы).|Повреждение тазовых органов может сопровождаться массивным кровотечением.
Спина: Топография|Спина делится на позвоночную, лопаточную, подлопаточную, поясничную и крестцовую области.|Позвоночник состоит из 33-34 позвонков, между которыми находятся межпозвоночные диски.|Спинной мозг расположен в позвоночном канале и окружён оболочками и ликвором.|Мышцы спины делятся на поверхностные (трапециевидная, широчайшая) и глубокие (разгибатели позвоночника).|Спина является опорой тела и участвует в движении.
Спина: Сосуды|Кровоснабжение спины осуществляется из задних межрёберных и поясничных артерий, а также из ветвей подключичной и подвздошных артерий.|Венозный отток происходит через межрёберные и поясничные вены в непарную и полунепарную вены.|Лимфатический отток идёт в подмышечные, межрёберные и поясничные лимфоузлы.|Иннервация спины осуществляется задними ветвями спинномозговых нервов.|При травмах спины возможно повреждение спинного мозга и его корешков.
Спина: Спинной мозг|Спинной мозг — это часть ЦНС, расположенная в позвоночном канале.|Он имеет сегментарное строение (31 сегмент) и выполняет рефлекторную и проводниковую функции.|Серое вещество спинного мозга содержит двигательные (передние рога) и чувствительные (задние рога) нейроны.|Белое вещество образовано проводящими путями (трактами), связывающими спинной мозг с головным.|Повреждение спинного мозга выше шейного утолщения приводит к тетраплегии.
Топография: Череп|Череп делится на свод и основание.|На основании черепа выделяют переднюю, среднюю и заднюю черепные ямки.|Передняя черепная ямка содержит лобные доли мозга.|Средняя черепная ямка содержит гипофиз, зрительные нервы и внутренние сонные артерии.|Задняя черепная ямка содержит мозжечок, мост и продолговатый мозг.
Топография: Глазница|Глазница (orbita) — это костная полость, содержащая глазное яблоко, мышцы, нервы и сосуды.|Стенки глазницы образованы лобной, скуловой, верхнечелюстной, решётчатой, клиновидной и слёзной костями.|В глазнице проходят зрительный нерв (II), глазодвигательный (III), блоковый (IV), отводящий (VI) и тройничный (V) нервы.|Кровоснабжение глазницы осуществляется глазной артерией (из внутренней сонной).|Венозный отток происходит через верхнюю и нижнюю глазные вены в пещеристый синус.
Топография: Нос|Полость носа делится на преддверие и собственно полость, разделённую перегородкой.|Стенки полости носа образованы носовыми костями, сошником, решётчатой и клиновидной костями.|В полости носа расположены три носовые раковины (верхняя, средняя, нижняя), под которыми находятся носовые ходы.|Слизистая оболочка носа содержит обонятельные рецепторы и железы.|Кровоснабжение носа осуществляется из верхнечелюстной и глазной артерий.
Топография: Рот|Полость рта делится на преддверие и собственно полость.|Стенки полости рта образованы верхней и нижней челюстями, твёрдым и мягким нёбом, языком и мышцами дна полости рта.|Зубы расположены в альвеолах челюстей (32 постоянных зуба).|Язык — мышечный орган, покрытый слизистой с вкусовыми сосочками.|Слюнные железы (околоушные, поднижнечелюстные, подъязычные) выделяют слюну в полость рта.
Топография: Шея|Шея делится на переднюю, заднюю и боковые области.|Передняя область содержит гортань, трахею, щитовидную железу и сосудисто-нервный пучок (сонная артерия, яремная вена, блуждающий нерв).|Боковая область содержит подключичные сосуды и плечевое сплетение.|Треугольники шеи (сонный, поднижнечелюстной, лопаточно-трахеальный) служат хирургическими ориентирами.|Задняя область шеи содержит мышцы и шейный отдел позвоночника.
Топография: Средостение|Средостение — это часть грудной полости, расположенная между плевральными полостями.|Оно делится на верхнее и нижнее, а нижнее — на переднее, среднее и заднее.|Переднее средостение содержит тимус, лимфоузлы и внутренние грудные сосуды.|Среднее средостение содержит сердце, перикард, крупные сосуды, трахею и бронхи.|Заднее средостение содержит пищевод, аорту, непарную вену и грудной проток.
Топография: Паховый|Паховый канал — это щель между мышцами и связками паховой области.|Он имеет четыре стенки: переднюю (апоневроз наружной косой мышцы), заднюю (поперечная фасция), верхнюю (нижние края внутренней косой и поперечной мышц) и нижнюю (паховая связка).|В паховом канале у мужчин проходит семенной канатик, а у женщин — круглая связка матки.|Паховый канал является местом выхода паховых грыж.|Грыжи бывают косыми (через глубокое кольцо) и прямыми (через медиальную ямку).
Топография: Бедренный|Бедренный канал формируется при развитии бедренной грыжи.|Его стенки: передняя (паховая связка), задняя (гребенчатая связка), латеральная (бедренная вена), медиальная (лакунарная связка).|Бедренное кольцо ограничено: спереди — паховой связкой, сзади — гребенчатой связкой, латерально — бедренной веной, медиально — лакунарной связкой.|Через бедренный канал могут выходить бедренные грыжи (чаще у женщин).|Бедренные грыжи опасны ущемлением.
Топография: Подмышечная|Подмышечная ямка (fossa axillaris) — это углубление между грудной стенкой и плечом.|Её содержимое: подмышечная артерия, вена, плечевое сплетение, лимфоузлы и жировая клетчатка.|Подмышечная артерия отдаёт грудоакромиальную, грудную, подлопаточную, переднюю и заднюю артерии, огибающие плечо.|Плечевое сплетение формирует нервы верхней конечности.|В подмышечной ямке расположены лимфоузлы, принимающие лимфу от молочной железы и верхней конечности.
Топография: Локтевая|Локтевая ямка (fossa cubitalis) — это углубление в области локтя.|Её границы: сверху — двуглавая мышца плеча, снизу — плечевая мышца, с боков — медиальный и латеральный надмыщелки плеча.|В локтевой ямке проходят плечевая артерия (делится на лучевую и локтевую), срединный нерв и сухожилие двуглавой мышцы.|Плечевая артерия доступна для измерения давления и пункции.|Локтевая ямка — место пальпации пульса и венепункции.
Топография: Подколенная|Подколенная ямка (fossa poplitea) — это ромбовидное углубление на задней поверхности колена.|Её границы: сверху — двуглавая мышца бедра и полуперепончатая мышца, снизу — головки икроножной мышцы.|В подколенной ямке проходят подколенная артерия, вена, большеберцовый нерв и общий малоберцовый нерв.|Подколенная артерия доступна для пальпации и пункции.|Повреждение подколенных сосудов и нервов опасно для конечности.
Топография: Голеностоп|Область голеностопного сустава включает переднюю, заднюю, латеральную и медиальную области.|Через голеностопный сустав проходят сухожилия, сосуды и нервы.|Передняя большеберцовая артерия переходит в тыльную артерию стопы (место пальпации пульса).|Задняя большеберцовая артерия проходит позади медиальной лодыжки (место пальпации пульса).|Малоберцовый нерв проходит позади латеральной лодыжки; его повреждение вызывает потерю чувствительности и «свисающую стопу».
Топография: Кожа|Кожа — это наружный покров тела, состоящий из эпидермиса, дермы и гиподермы.|Эпидермис — многослойный плоский ороговевающий эпителий.|Дерма содержит коллаген, эластин, сосуды, нервы, волосяные фолликулы и железы.|Гиподерма — подкожная жировая клетчатка, выполняющая термоизоляционную и амортизационную функции.|Кожа — самый крупный орган тела.
Топография: Молочная|Молочная железа — это парный орган, расположенный на передней грудной стенке.|Она состоит из 15-20 долек, каждая из которых имеет выводной проток, открывающийся на соске.|Кровоснабжение железы осуществляется из внутренней грудной, латеральной грудной и межрёберных артерий.|Лимфоотток идёт в подмышечные, подключичные и парастернальные лимфоузлы.|Молочная железа регулируется гормонами гипофиза (пролактин) и яичников (эстрогены).
Топография: Щитовидная|Щитовидная железа расположена на передней поверхности шеи, состоит из двух долей и перешейка.|Она прилежит к гортани и трахее, сзади к ней прилежат паращитовидные железы и возвратные гортанные нервы.|Кровоснабжение железы осуществляется из верхней и нижней щитовидных артерий.|Венозный отток — через щитовидные вены в яремную вену.|При операциях на щитовидной железе важно сохранить возвратные гортанные нервы (иначе — паралич голосовых связок).
Топография: Тимус|Тимус (вилочковая железа) расположен в верхнем средостении за грудиной.|Он состоит из двух долей, разделённых перемычкой.|Тимус — центральный орган иммунной системы, где созревают Т-лимфоциты.|С возрастом тимус подвергается инволюции и замещается жировой тканью.|У детей тимус может быть увеличен (тимомегалия) и вызывать нарушения дыхания.
Топография: Сердце|Сердце расположено в среднем средостении, в перикарде.|Оно имеет четыре камеры: правое и левое предсердия, правый и левый желудочки.|Клапаны сердца (трёхстворчатый, митральный, аортальный, лёгочный) обеспечивают односторонний ток крови.|Кровоснабжение сердца осуществляется коронарными артериями (из аорты).|Иннервация сердца — вегетативная (симпатическая и парасимпатическая).
Топография: Пищевод|Пищевод — это мышечная трубка, соединяющая глотку с желудком.|Он проходит через шею, грудную полость и диафрагму.|В грудной полости пищевод расположен позади трахеи и сердца.|В брюшной полости пищевод переходит в желудок.|Пищевод имеет физиологические сужения (глоточное, аортальное, диафрагмальное), где чаще застревают инородные тела.
Топография: Желудок|Желудок расположен в левом подреберье и эпигастрии.|Он делится на кардиальную часть, дно, тело и пилорическую часть.|Стенка желудка состоит из слизистой, подслизистой, мышечной и серозной оболочек.|Кровоснабжение желудка осуществляется из чревного ствола (левая желудочная, правая желудочная, желудочно-сальниковые артерии).|Венозный отток — в воротную вену (через левую и правую желудочные вены).
Топография: Печень|Печень расположена в правом подреберье.|Она имеет две доли (правую и левую) и два края (верхний и нижний).|Печень покрыта брюшиной (кроме задней поверхности).|Кровоснабжение печени осуществляется из печёночной артерии (20%) и воротной вены (80%).|Желчь оттекает по желчным протокам в желчный пузырь и двенадцатиперстную кишку.
Топография: Почки|Почки расположены забрюшинно в поясничной области.|Правая почка лежит ниже левой (из-за печени).|Почки имеют корковое и мозговое вещество, содержат нефроны.|Кровоснабжение почек — почечные артерии (из брюшной аорты).|Венозный отток — почечные вены (в нижнюю полую вену).
Топография: Мочеточники|Мочеточники — это трубки длиной около 30 см, соединяющие почки с мочевым пузырём.|Они имеют три части: брюшную, тазовую и внутристеночную.|Стенка мочеточника имеет мышечный слой, обеспечивающий перистальтику.|Мочеточники имеют физиологические сужения (лоханочно-мочеточниковый сегмент, место перехода в таз, внутристеночная часть).|В этих местах чаще застревают камни.
Топография: Мочевой|Мочевой пузырь — это полый мышечный орган, расположенный в малом тазу.|Он имеет верхушку, тело, дно и шейку.|Стенка пузыря состоит из слизистой, подслизистой, мышечной и серозной оболочек.|Кровоснабжение пузыря — из верхних и нижних мочепузырных артерий (из внутренней подвздошной артерии).|Иннервация пузыря — парасимпатическая (сокращение детрузора) и симпатическая (расслабление).
Топография: Матка|Матка — это полый мышечный орган, расположенный в малом тазу между мочевым пузырём и прямой кишкой.|Она имеет тело, шейку и дно.|Стенка матки состоит из эндометрия, миометрия и периметрия.|Кровоснабжение матки — из маточных артерий (из внутренней подвздошной артерии).|Иннервация матки — из маточно-влагалищного сплетения.
Топография: Прямая|Прямая кишка — это конечный отдел толстой кишки, расположенный в малом тазу.|Она имеет три части: надампулярную, ампулярную и анальный канал.|Стенка прямой кишки состоит из слизистой, подслизистой и мышечной оболочек.|Кровоснабжение прямой кишки — из верхней, средней и нижней прямокишечных артерий.|Венозный отток — в воротную вену (верхняя часть) и в нижнюю полую вену (нижняя часть) — место порто-кавальных анастомозов.
Топография: Сосуды|Сосудистая система организма делится на кровеносную и лимфатическую.|Кровеносная система состоит из сердца и сосудов (артерии, вены, капилляры).|Артерии несут кровь от сердца, вены — к сердцу.|Капилляры обеспечивают обмен веществ между кровью и тканями.|Лимфатическая система возвращает тканевую жидкость в кровь и участвует в иммунитете.
Топография: Нервы|Нервная система делится на центральную (головной и спинной мозг) и периферическую (нервы и ганглии).|Периферические нервы делятся на соматические (иннервируют кожу и мышцы) и вегетативные (иннервируют внутренние органы).|Соматические нервы содержат двигательные, чувствительные и вегетативные волокна.|Вегетативные нервы делятся на симпатические и парасимпатические.|Повреждение нервов приводит к парезам, параличам и нарушению чувствительности.
Топография: Артерии|Артерии — это сосуды, несущие кровь от сердца.|Их стенка состоит из трёх оболочек: внутренней (эндотелий), средней (гладкие мышцы и эластин) и наружной (соединительная ткань).|Артерии делятся на эластические, мышечные и смешанные.|Крупнейшая артерия — аорта.|Артерии обеспечивают постоянный приток крови к органам.
Топография: Вены|Вены — это сосуды, несущие кровь к сердцу.|Их стенка тоньше, чем у артерий, и содержит клапаны.|Вены делятся на поверхностные и глубокие.|Крупнейшие вены — верхняя и нижняя полые вены.|Вены обеспечивают возврат крови к сердцу и депонируют кровь.
Топография: Капилляры|Капилляры — это микроскопические сосуды, соединяющие артериолы и венулы.|Их стенка состоит из одного слоя эндотелиальных клеток.|Капилляры обеспечивают обмен веществ между кровью и тканями.|Общая длина капилляров в теле человека достигает 100 000 км.|Повышенная проницаемость капилляров приводит к отёкам.
Клиническая: Топография|Клиническая анатомия изучает строение тела применительно к диагностике и лечению, опираясь на данные визуализации и хирургический опыт.|Топографическая анатомия описывает послойное строение областей (кожа, подкожная клетчатка, фасции, мышцы, сосуды, нервы, органы).|Знание топографии позволяет хирургу выбрать оптимальный доступ к органу с минимальным повреждением окружающих тканей.|Фасции и клетчаточные пространства определяют пути распространения гнойных процессов и гематом.|Проекции органов на поверхность тела служат ориентирами для пальпации, перкуссии и аускультации.
