<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Анатомия">
<meta name="theme-color" content="#08090c">
<meta name="format-detection" content="telephone=no">
<title>Анатомия человека — полный курс · 500 слайдов · ascet</title>
<style>
:root{
  --bg:#08090c;
  --line:#1a1f27;
  --line-soft:#141920;
  --text:#f2f0ec;
  --soft:#c8ccd3;
  --muted:#7f8791;
  --muted2:#5f6771;
  --accent:#c8ccd3; /* Строгий серый вместо золота */
  --accent-soft:rgba(200, 204, 211, 0.45);
  --accent-faint:rgba(200, 204, 211, 0.08);
  --ease-out:cubic-bezier(.19,1,.22,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
[data-theme="light"] {
  --bg:#fbfbfd;
  --line:#e5e5ea;
  --line-soft:#f2f2f7;
  --text:#1d1d1f;
  --soft:#424245;
  --muted:#86868b;
  --muted2:#d2d2d7;
  --accent:#424245;
  --accent-soft:rgba(66, 66, 69, 0.45);
  --accent-faint:rgba(66, 66, 69, 0.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{
  height:100%;
  overflow:hidden;
  background:var(--bg);
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Inter","Segoe UI",Roboto,sans-serif;
  font-weight:400;
  font-size:16px;
  letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
  height:100vh;
  height:100dvh;
  transition: background 0.5s ease, color 0.5s ease;
}

/* ---------- BACKGROUND ---------- */
.bg{
  position:fixed;inset:-8%;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 800px at 15% 5%, rgba(200,204,211,.075), transparent 65%),
    radial-gradient(900px 700px at 95% 100%, rgba(150,160,180,.06), transparent 65%),
    radial-gradient(700px 500px at 50% 50%, rgba(255,255,255,.012), transparent 70%),
    linear-gradient(180deg, #08090c 0%, #0a0c10 100%);
  transition:transform 1.6s var(--ease-out), background 0.5s ease;
  will-change:transform;
}
[data-theme="light"] .bg {
  background:
    radial-gradient(1100px 800px at 15% 5%, rgba(0,0,0,.03), transparent 65%),
    radial-gradient(900px 700px at 95% 100%, rgba(0,0,0,.02), transparent 65%),
    radial-gradient(700px 500px at 50% 50%, rgba(0,0,0,.01), transparent 70%),
    linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 100%);
}
.grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background-image:
    linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
  background-size:88px 88px;
  mask-image:radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,.35) 70%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,.35) 70%, transparent 100%);
}
[data-theme="light"] .grid {
  background-image:
    linear-gradient(rgba(0,0,0,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.016) 1px, transparent 1px);
}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.62) 100%);
}
[data-theme="light"] .vignette {
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.05) 100%);
}

/* ---------- SLIDE ---------- */
.slide{
  position:fixed;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:7.5vh 8.5vw 12vh 8.5vw;
  padding-top:calc(7.5vh + var(--safe-t));
  padding-bottom:calc(12vh + var(--safe-b));
  padding-left:calc(8.5vw + var(--safe-l));
  padding-right:calc(8.5vw + var(--safe-r));
  opacity:0;visibility:hidden;
  transform:translate3d(0,32px,0) scale(.985);
  filter:blur(8px);
  transition:
    opacity 1.05s var(--ease-out),
    transform 1.05s var(--ease-out),
    filter 1.05s var(--ease-out),
    visibility 1.05s;
  z-index:2;
  overflow-y:auto;
  overflow-x:hidden;
  will-change:opacity,transform,filter;
  -webkit-overflow-scrolling:touch;
}
.slide.active{
  opacity:1;visibility:visible;
  transform:translate3d(0,0,0) scale(1);
  filter:blur(0);
  z-index:3;
}
.slide.prev-out{
  transform:translate3d(0,-24px,0) scale(.99);
  filter:blur(6px);
}
.slide::-webkit-scrollbar{width:0;height:0}

/* ---------- KICKER ---------- */
.kicker{
  font-size:.72rem;letter-spacing:.36em;text-transform:uppercase;
  color:var(--accent);font-weight:500;margin-bottom:1.5rem;
  display:flex;align-items:center;gap:.95rem;opacity:.95;
}
.kicker::before{
  content:"";width:24px;height:1px;background:var(--accent);
  opacity:.75;transform-origin:left center;
}
.slide.active .kicker::before{animation:lineGrow 1.1s var(--ease-out) .15s both}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- TITLE ---------- */
.title{
  font-weight:500;
  font-size:clamp(1.65rem,3vw,2.55rem);
  line-height:1.14;letter-spacing:-.028em;
  color:var(--text);margin-bottom:1.5rem;max-width:26ch;
  text-wrap:balance;
}
.rule{
  width:52px;height:1px;
  background:linear-gradient(90deg,var(--accent) 0%,rgba(200, 204, 211,.15) 60%,transparent 100%);
  margin-bottom:2.1rem;transform-origin:left center;
}
[data-theme="light"] .rule {
  background:linear-gradient(90deg,var(--accent) 0%,rgba(66, 66, 69,.15) 60%,transparent 100%);
}
.slide.active .rule{animation:lineGrow 1.2s var(--ease-out) .25s both}

/* ---------- POINTS ---------- */
.points{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.15rem 2.8rem;
  max-width:1200px;
}
.point{
  display:flex;gap:1.05rem;
  padding:.85rem 0;
  border-top:1px solid var(--line-soft);
  opacity:0;transform:translate3d(0,18px,0);
  will-change:opacity,transform;
}
.slide.active .point{animation:rise 1.05s var(--ease-out) both}
.slide.active .point:nth-child(1){animation-delay:.32s}
.slide.active .point:nth-child(2){animation-delay:.40s}
.slide.active .point:nth-child(3){animation-delay:.48s}
.slide.active .point:nth-child(4){animation-delay:.56s}
.slide.active .point:nth-child(5){animation-delay:.64s}
.slide.active .point:nth-child(6){animation-delay:.72s}
@keyframes rise{
  from{opacity:0;transform:translate3d(0,18px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
.point .n{
  font-size:.82rem;color:var(--accent);
  min-width:1.9rem;padding-top:.28rem;
  letter-spacing:.04em;font-weight:500;
  font-variant-numeric:tabular-nums;opacity:.85;
}
.point p{
  font-size:clamp(.84rem,1.02vw,1.02rem);
  line-height:1.66;color:var(--soft);font-weight:400;
  letter-spacing:-.008em;
}

/* ---------- NOTE ---------- */
.note{
  margin-top:2.2rem;font-size:1.02rem;color:var(--muted);
  font-style:italic;max-width:78ch;padding-left:1.15rem;
  border-left:1px solid var(--accent-soft);
  line-height:1.62;letter-spacing:-.005em;
  opacity:0;transform:translate3d(0,12px,0);
}
.slide.active .note{animation:rise 1.1s var(--ease-out) .85s both}

/* ---------- SLIDE NUMBER ---------- */
.slide-num{
  position:absolute;
  bottom:calc(2.5rem + var(--safe-b));left:calc(8.5vw + var(--safe-l));
  font-size:.66rem;letter-spacing:.32em;
  color:var(--muted2);opacity:.6;font-weight:500;
  font-variant-numeric:tabular-nums;
}

/* ---------- CORNER ACCENT ---------- */
.slide::before{
  content:"";position:absolute;
  top:calc(5.5vh + var(--safe-t));right:calc(8.5vw + var(--safe-r));
  width:38px;height:1px;background:var(--accent-soft);
}
.slide::after{
  content:"";position:absolute;
  top:calc(5.5vh + var(--safe-t));right:calc(8.5vw + var(--safe-r));
  width:1px;height:38px;background:var(--accent-soft);
}

/* ---------- COVER ---------- */
.cover .cover-wrap{
  display:flex;flex-direction:column;justify-content:center;
  height:100%;max-width:1120px;
}
.cover-kicker{
  font-size:.74rem;letter-spacing:.55em;text-transform:uppercase;
  color:var(--accent);margin-bottom:2.4rem;opacity:.9;font-weight:500;
}
.cover-title{
  font-weight:600;
  font-size:clamp(2.6rem,7.5vw,6.6rem);
  line-height:.98;letter-spacing:-.045em;
  color:var(--text);margin-bottom:2.2rem;
}
.cover-rule{
  width:96px;height:1px;
  background:linear-gradient(90deg,var(--accent),transparent);
  margin-bottom:2.2rem;
}
.cover-sub{
  font-size:clamp(.96rem,1.18vw,1.15rem);
  color:var(--muted);max-width:62ch;line-height:1.72;
  font-weight:400;letter-spacing:-.008em;
}
.cover::before,.cover::after{display:none}

/* ---------- SECTION ---------- */
.section .section-wrap{
  display:flex;flex-direction:column;justify-content:center;height:100%;
}
.section .num{
  font-weight:200;
  font-size:clamp(5.5rem,14vw,12rem);
  line-height:.82;color:transparent;
  -webkit-text-stroke:1px var(--accent-soft);
  margin-bottom:1.4rem;letter-spacing:-.04em;
  opacity:0;transform:translate3d(0,20px,0);
}
.slide.active .num{animation:rise 1.2s var(--ease-out) .1s both}
.section-title{
  font-weight:500;
  font-size:clamp(2rem,4.6vw,3.7rem);
  line-height:1.04;letter-spacing:-.035em;
  color:var(--text);margin-bottom:1.5rem;max-width:18ch;
  text-wrap:balance;
}
.section-sub{
  font-size:clamp(.96rem,1.12vw,1.1rem);
  color:var(--muted);max-width:62ch;line-height:1.72;
  letter-spacing:-.008em;
}
.section .rule{margin-bottom:2.3rem}
.section::before,.section::after{display:none}

/* ---------- SETTINGS (ШЕСТЕРЕНКА) ---------- */
.settings-btn {
  position: fixed; top: calc(24px + env(safe-area-inset-top)); right: calc(24px + env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%;
  background: transparent; border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; cursor: pointer; transition: color 0.3s ease, transform 0.4s ease;
}
.settings-btn:hover { color: var(--text); transform: rotate(90deg); }
.settings-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.settings-menu {
  position: fixed; top: calc(75px + env(safe-area-inset-top)); right: calc(24px + env(safe-area-inset-right));
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px; z-index: 100; opacity: 0; visibility: hidden; transform: translateY(-10px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.settings-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }
.theme-toggle {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border: none; background: transparent; color: var(--text);
  font-size: 0.9rem; font-family: inherit; cursor: pointer; border-radius: 8px; width: 100%; text-align: left;
  transition: background 0.2s;
}
.theme-toggle:hover { background: var(--accent-faint); }
.theme-toggle svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; }

/* ---------- WATERMARK ---------- */
.watermark {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: calc(24px + env(safe-area-inset-left));
  font-size: 0.7rem; letter-spacing: 0.3em; color: var(--muted); opacity: 0.2;
  text-transform: uppercase; z-index: 50; pointer-events: none; font-weight: 600;
}

/* ---------- TOOLTIP ---------- */
.tooltip {
  position: fixed; background: var(--bg); border: 1px solid var(--line);
  padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; color: var(--text);
  max-width: 320px; line-height: 1.5; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s; pointer-events: none;
}
.tooltip.show { opacity: 1; visibility: visible; transform: translateY(0); }

@media (max-width: 900px) {
  .slide-inner { justify-content: flex-start; padding-top: calc(14vh + env(safe-area-inset-top)); padding-bottom: calc(8vh + env(safe-area-inset-bottom)); }
  .points { grid-template-columns: 1fr; gap: 0.8rem; }
  .title { font-size: 1.6rem; margin-bottom: 1.5rem; }
  .point p { font-size: 0.95rem; line-height: 1.5; }
  .note { font-size: 0.9rem; margin-top: 1.5rem; }
  .settings-btn { top: calc(18px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right)); }
  .watermark { bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); }
}
</style>
</head>

// ==========================================
// РЕНДЕР И ЛОГИКА
// ==========================================
const deck = document.getElementById('deck');
const total = D.length;

function highlightTerms(text) {
  let result = text;
  const terms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
  for (const term of terms) {
    const regex = new RegExp(`\\b(${term})\\b`, 'gi');
    result = result.replace(regex, `<span class="term" data-def="${GLOSSARY[term]}">$1</span>`);
  }
  return result;
}

D.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s[0] === 'S' ? 'section' : 'info');
  
  let html = '<div class="slide-inner">';
  
  if (s[0] === 'S') {
    html += `<div class="num">${s[1]}</div><h2 class="section-title">${s[2]}</h2><p class="section-sub">${s[3]}</p>`;
  } else {
    const pts = (s[3] || []).map((p, k) => {
      const highlighted = highlightTerms(p);
      return `<div class="point"><span class="n">${String(k + 1).padStart(2, '0')}</span><p>${highlighted}</p></div>`;
    }).join('');
    
    html += `
      <div class="kicker">${s[1]}</div>
      <h2 class="title">${s[2]}</h2>
      <div class="points">${pts}</div>
      ${s[4] ? `<p class="note">${highlightTerms(s[4])}</p>` : ''}
    `;
  }
  
  html += '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
function show(n) {
  if (n < 0) n = 0;
  if (n >= total) n = total - 1;
  if (n === cur && deck.children[cur].classList.contains('active')) return;

  const oldEl = deck.children[cur];
  const newEl = deck.children[n];

  if (oldEl && oldEl !== newEl) {
    oldEl.classList.remove('active');
    oldEl.classList.add('prev-out');
    setTimeout(() => oldEl.classList.remove('prev-out'), 1100);
  }

  cur = n;
  newEl.classList.add('active');
  newEl.querySelector('.slide-inner').scrollTop = 0;
}

function nextSlide() { show(cur + 1); }
function prevSlide() { show(cur - 1); }

document.addEventListener('click', (e) => {
  if (e.target.closest('#settingsBtn') || e.target.closest('#settingsMenu')) return;
  if (e.target.classList.contains('term')) {
    e.stopPropagation();
    const def = e.target.getAttribute('data-def');
    showTooltip(e.target, def);
    return;
  }
  if (window.getSelection && window.getSelection().toString()) return;
  if (e.clientX > window.innerWidth * 0.5) nextSlide();
  else prevSlide();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(total - 1); }
  else if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  }
});

let wheelLock = false;
window.addEventListener('wheel', (e) => {
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 20) return;
  wheelLock = true;
  if (e.deltaY > 0) nextSlide(); else prevSlide();
  setTimeout(() => { wheelLock = false; }, 700);
}, { passive: true });

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  
  if (dt > 500) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextSlide(); else prevSlide();
  }
}, { passive: true });

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(target, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  const rect = target.getBoundingClientRect();
  const top = rect.top - 10;
  const left = Math.max(10, Math.min(rect.left, window.innerWidth - 330));
  tooltip.style.top = `${top}px`;
  tooltip.style.left = `${left}px`;
  tooltip.style.transform = 'translateY(-100%)';
  setTimeout(() => { tooltip.classList.remove('show'); }, 4000);
}

// Настройки и темы
const settingsBtn = document.getElementById('settingsBtn');
const settingsMenu = document.getElementById('settingsMenu');
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeText = document.getElementById('themeText');

settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsMenu.classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#settingsBtn') && !e.target.closest('#settingsMenu')) {
    settingsMenu.classList.remove('open');
  }
});

const MOON_PATH = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    themeIcon.innerHTML = MOON_PATH;
    themeText.textContent = 'Тёмная тема';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08090c');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeIcon.innerHTML = SUN_PATH;
    themeText.textContent = 'Светлая тема';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fbfbfd');
  }
});

show(0);
</script>
